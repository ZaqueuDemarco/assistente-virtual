<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #161b22;
    --raised: #1d242e;
    --hover: #242c38;
    --border: #2b3441;
    --border-strong: #3a4556;
    --text: #e6eaf0;
    --text-2: #aab4c3;
    --muted: #7d8898;
    --accent: #5b9dff;
    --accent-soft: rgba(91, 157, 255, .14);
    --good: #3fb97a;
    --warn: #e0a449;
    --bad: #e5534b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --grid: #262e3a;
    --radius: 8px;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 224px minmax(0, 1fr) 380px;
    height: 100%;
  }
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 20px;
    padding: 18px 14px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--accent-soft); border: 1px solid rgba(91,157,255,.35);
    display: grid; place-items: center; color: var(--accent);
    font: 600 13px var(--mono);
  }
  .brand b { display: block; font-size: 14px; }
  .brand small { color: var(--muted); font-size: 12px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; padding: 0 8px 6px;
  }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; border-radius: 6px;
    padding: 8px 10px; text-align: left; cursor: pointer; color: var(--text-2);
  }
  .nav button:hover { background: var(--hover); color: var(--text); }
  .nav button[aria-current="true"] { background: var(--accent-soft); color: var(--text); }
  .nav button[aria-current="true"] svg { color: var(--accent); }
  .nav svg { width: 16px; height: 16px; flex: none; }
  .nav-item { display: flex; align-items: center; gap: 2px; }
  .nav-item > button:first-child { flex: 1; min-width: 0; }
  .nav .nav-del { opacity: .45; flex: none; width: auto; padding: 6px; }
  .nav .nav-item > button:first-child span:not(.count) { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imp-head .icon-btn { margin-left: auto; }
  .imp-head .steps + .icon-btn { margin-left: 0; }
  .nav-item:hover .nav-del, .nav-del:focus-visible { opacity: 1; }
  .nav-del:hover { color: var(--bad); }
  .nav .count { margin-left: auto; color: var(--muted); font: 12px var(--mono); }
  .side-foot { margin-top: auto; color: var(--muted); font-size: 12px; padding: 0 8px; display: flex; flex-direction: column; gap: 10px; }
  .store-line { color: var(--text-2); font-size: 11.5px; line-height: 1.4; }
  .store-line.warn { color: var(--warn); }
  .store-bar { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 5px; overflow: hidden; }
  .store-bar i { display: block; height: 100%; background: var(--accent); }
  .store-actions { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 -8px; }
  .store-actions .btn { padding: 5px 8px; font-size: 12px; }
  kbd {
    font: 11px var(--mono); padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--border-strong); background: var(--raised); color: var(--text-2);
  }

  .main { overflow-y: auto; min-width: 0; }
  .main-inner { padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1180px; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
  .topbar p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    background: var(--raised); border: 1px solid var(--border-strong); color: var(--text);
    font-size: 13px; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #07111f; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }
  .btn svg { width: 14px; height: 14px; }
  select.ctl, input.ctl {
    background: var(--raised); border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 6px 10px; font-size: 13px; min-width: 0;
  }
  .tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: rgba(224,164,73,.14); color: var(--warn); border: 1px solid rgba(224,164,73,.3);
    letter-spacing: .02em;
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-head .sub { color: var(--muted); font-size: 12px; }

  /* ---------- KPIs ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; container-type: inline-size; }
  .kpi .lbl { color: var(--text-2); font-size: 13px; line-height: 1.3; }
  .kpi .val { font-size: 26px; font-size: clamp(18px, 14.5cqi, 26px); font-weight: 650; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kpi .delta { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .delta .up { color: var(--good); }
  .delta .down { color: var(--bad); }
  .kpi .spark { margin-top: 6px; height: 32px; position: relative; }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters label { color: var(--muted); font-size: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; border: 1px solid var(--border-strong); background: var(--raised);
    font-size: 12px; cursor: pointer; color: var(--text-2);
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

  /* ---------- Charts ---------- */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
  .chart-card .body { padding: 12px 14px 14px; height: 280px; position: relative; }
  .row.nowrap { flex-wrap: nowrap; }
  .chart-card .panel-head { flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--raised); border: 0; padding: 4px 8px; cursor: pointer;
    color: var(--muted); font-size: 12px;
  }
  .seg button + button { border-left: 1px solid var(--border-strong); }
  .seg button[aria-pressed="true"] { color: var(--text); background: var(--hover); }
  .icon-btn {
    background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px;
    border-radius: 5px; display: inline-grid; place-items: center;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; font-size: 13px; }
  .empty code { font-family: var(--mono); color: var(--accent); }

  /* ---------- Spreadsheet ---------- */
  .sheet-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .sheet-tabs button {
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 10px;
    cursor: pointer; color: var(--text-2); font-size: 13px;
  }
  .sheet-tabs button:hover { background: var(--hover); }
  .sheet-tabs button[aria-current="true"] { border-color: var(--border-strong); background: var(--raised); color: var(--text); }
  .formula-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 13px;
  }
  .formula-bar .ref { color: var(--accent); min-width: 42px; }
  .formula-bar input { flex: 1; background: none; border: 0; color: var(--text); font-family: var(--mono); min-width: 0; }
  .grid-wrap { overflow: auto; max-height: calc(100vh - 290px); min-height: 260px; }
  table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-variant-numeric: tabular-nums; }
  .grid th, .grid td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
  .grid thead th {
    position: sticky; top: 0; z-index: 2; background: var(--raised);
    font-weight: 500; text-align: left; padding: 0; font-size: 12px;
  }
  .grid thead .col-letter { display: block; color: var(--muted); font: 11px var(--mono); padding: 4px 10px 0; }
  .type-pick { background: none; border: 0; color: var(--accent); font: 11px var(--mono); padding: 0; cursor: pointer; }
  .type-pick:hover { text-decoration: underline; }
  .type-pick option { background: var(--raised); color: var(--text); }
  .grid thead input {
    display: block; width: 100%; background: none; border: 0; padding: 0 10px 6px;
    font-weight: 600; color: var(--text); font-size: 13px;
  }
  .grid .rownum {
    position: sticky; left: 0; z-index: 1; background: var(--raised); color: var(--muted);
    font: 11px var(--mono); text-align: center; width: 40px; min-width: 40px;
  }
  .grid thead .rownum { z-index: 3; }
  .grid td { padding: 0; min-width: 120px; background: var(--surface); }
  .grid td input {
    width: 100%; background: none; border: 0; padding: 6px 10px; font-size: 13px;
    color: var(--text); font-variant-numeric: tabular-nums;
  }
  .grid td.num input { text-align: right; }
  .grid td.formula input { color: #9cc3ff; }
  .grid td.err input { color: var(--bad); }
  .grid td:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
  .grid tfoot td {
    background: var(--raised); font-size: 12px; color: var(--text-2); padding: 6px 10px; text-align: right;
    position: sticky; bottom: 0;
  }
  .grid tfoot td.rownum { text-align: center; }
  .grid tr.hl td { background: rgba(91,157,255,.08); }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border-top: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
  .pager .pg { color: var(--muted); font-variant-numeric: tabular-nums; }
  .pager .btn { padding: 5px 10px; font-size: 12.5px; }
  .pager .btn[disabled] { opacity: .4; cursor: default; }

  /* ---------- Tasks ---------- */
  .tasks { list-style: none; margin: 0; padding: 0; }
  .tasks li {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .tasks li:last-child { border-bottom: 0; }
  .tasks li.done .t { color: var(--muted); text-decoration: line-through; }
  .tasks input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .tasks .n { color: var(--muted); font: 12px var(--mono); margin-right: 6px; }
  .due { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; }
  .due.late { color: var(--bad); border-color: rgba(229,83,75,.4); background: rgba(229,83,75,.1); }
  .due.soon { color: var(--warn); border-color: rgba(224,164,73,.4); background: rgba(224,164,73,.1); }

  /* ---------- Assistant ---------- */
  .assist {
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; height: 100%;
  }
  /* Conversa em balões, nas cores do próprio assistente (azul/violeta sobre fundo escuro) */
  .assist { --wa-bg: #0f141b; --wa-in: #1f2733; --wa-out: #3563c9; --wa-green: var(--accent); --wa-meta: #8b97a8; --wa-head: var(--surface); --wa-text: #e8edf4; }
  .assist-head {
    padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--wa-head);
    display: flex; align-items: center; gap: 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(63,185,122,.18); }
  .avatar {
    position: relative; flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(135deg, #5b9dff, #8b6cf0); color: #fff; font-weight: 700; font-size: 13px; letter-spacing: .02em;
  }
  .avatar i { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--good); border: 2px solid var(--wa-head); }
  .assist-head .who { min-width: 0; }
  .assist-head b { font-size: 14.5px; display: block; }
  .assist-head small { color: var(--wa-meta); display: block; font-size: 12.5px; }
  .assist-head .icon-btn:first-of-type { margin-left: auto; }
  .log {
    flex: 1; overflow-y: auto; padding: 14px 5%; display: flex; flex-direction: column; gap: 4px;
    background-color: var(--wa-bg);
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1.4px), radial-gradient(rgba(255,255,255,.02) 1px, transparent 1.4px);
    background-size: 22px 22px, 22px 22px; background-position: 0 0, 11px 11px;
  }
  .day { align-self: center; margin: 8px 0; font-size: 12px; color: var(--wa-meta); background: #1a2230; border: 1px solid var(--border); padding: 5px 12px; border-radius: 8px; box-shadow: 0 1px .5px rgba(0,0,0,.3); }
  .msg {
    position: relative; max-width: 85%; padding: 8px 12px 8px; border-radius: 14px; font-size: 14px; line-height: 1.45;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 0 10px; box-shadow: 0 1px .5px rgba(0,0,0,.35); overflow-wrap: anywhere;
  }
  .msg[hidden] { display: none; }
  .msg + .msg { margin-top: 6px; }
  .msg .txt { flex: 1 1 auto; min-width: 0; }
  .msg .meta { margin-left: auto; font-size: 11px; color: var(--wa-meta); white-space: nowrap; display: inline-flex; align-items: center; gap: 3px; transform: translateY(3px); }
  .msg .ticks { width: 16px; height: 11px; color: #cfe0ff; }
  .msg.user { align-self: flex-end; background: var(--wa-out); color: #fff; border-bottom-right-radius: 4px; }
  .msg.user .meta { color: rgba(255,255,255,.7); }
  .msg.user code { color: #fff; background: rgba(255,255,255,.18); }
  .msg.bot { align-self: flex-start; background: var(--wa-in); color: var(--wa-text); border-bottom-left-radius: 4px; border: 1px solid #2a3442; }
  .msg.bot.err { box-shadow: inset 3px 0 0 var(--bad), 0 1px .5px rgba(0,0,0,.35); }
  .msg.typing { padding: 12px 14px; gap: 4px; }
  .msg.typing i, .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--wa-meta); display: inline-block; animation: blink 1.2s infinite ease-in-out; }
  .msg.typing i:nth-child(2), .dots i:nth-child(2) { animation-delay: .15s; }
  .msg.typing i:nth-child(3), .dots i:nth-child(3) { animation-delay: .3s; }
  .dots { display: inline-flex; gap: 4px; margin-right: 6px; vertical-align: middle; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .msg.bot.ai .thinking { color: var(--wa-meta); font-size: 12.5px; }
  .msg.bot.ai .ai-stop { padding: 2px 10px; font-size: 12px; margin-left: 6px; border-radius: 999px; }
  .msg.bot.ai ul { margin: 4px 0; padding-left: 18px; }
  @media (prefers-reduced-motion: reduce) { .msg.typing i, .dots i { animation: none; opacity: .7; } }
  .msg code { font-family: var(--mono); font-size: 12.5px; color: #b9d3ff; background: rgba(91,157,255,.14); padding: 1px 5px; border-radius: 4px; }
  .msg ul { margin: 6px 0 0; padding-left: 18px; }
  .msg li { margin: 2px 0; }
  .msg .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  /* ---------- Capa de abertura ---------- */
  .cover {
    position: fixed; inset: 0; z-index: 900; overflow-y: auto; color: var(--text);
    background:
      radial-gradient(900px 520px at 85% 15%, rgba(139,108,240,.18), transparent 60%),
      radial-gradient(700px 480px at 10% 90%, rgba(91,157,255,.14), transparent 60%),
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 100% 36px,
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 120px 100%,
      var(--bg);
    padding: calc(28px + env(safe-area-inset-top, 0px)) 24px calc(28px + env(safe-area-inset-bottom, 0px));
    display: grid; place-items: center; transition: opacity .35s ease, transform .35s ease;
  }
  .cover.closing { opacity: 0; transform: scale(1.02); pointer-events: none; }
  .cover-in { width: min(1120px, 100%); display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: center; }
  .cover-brand { display: flex; align-items: center; gap: 12px; color: var(--text-2); font-weight: 600; }
  .cover-mark { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font: 700 16px var(--mono); color: #fff; background: linear-gradient(135deg, #5b9dff, #8b6cf0); box-shadow: 0 10px 30px -10px rgba(91,157,255,.7); }
  .cover h1 { font-family: "Bricolage Grotesque", var(--sans); font-size: clamp(34px, 5vw, 56px); line-height: 1.05; letter-spacing: -.02em; margin: 22px 0 14px; text-wrap: balance; }
  .cover h1 em { font-style: normal; background: linear-gradient(90deg, #5b9dff, #a08bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cover-lead { color: var(--text-2); font-size: 16.5px; line-height: 1.55; max-width: 46ch; margin: 0; }
  .cover-status { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .cover-status span { font-size: 12.5px; color: var(--text-2); padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border-strong); background: rgba(22,27,34,.7); }
  .cover-status span.warn { color: var(--warn); border-color: rgba(224,164,73,.4); }
  .cover-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .cover-actions .btn { padding: 12px 20px; font-size: 15px; border-radius: 10px; }
  .cover-actions .btn.primary { padding-inline: 28px; box-shadow: 0 12px 30px -12px rgba(91,157,255,.8); }
  .cover-sheets { margin-top: 26px; }
  .cover-sheets p { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .cover-sheets div { display: flex; flex-wrap: wrap; gap: 8px; }
  .cover-sheets button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; cursor: pointer; background: var(--surface); border: 1px solid var(--border); color: var(--text); font: inherit; font-size: 13.5px; }
  .cover-sheets button:hover { border-color: var(--accent); }
  .cover-sheets button small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .cover-sheets button svg { width: 14px; height: 14px; color: var(--accent); }
  .cover-foot { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 30px; color: var(--muted); font-size: 12.5px; }
  .cover-foot label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .cover-foot input { accent-color: var(--accent); }
  .cover-art { position: relative; aspect-ratio: 6 / 5; max-width: 100%; }
  .cover-art svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .cover-art .card { filter: drop-shadow(0 24px 40px rgba(0,0,0,.45)); }
  @keyframes coverRise { from { transform: scaleY(.05); } to { transform: scaleY(1); } }
  @keyframes coverFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cover-art .bar { transform-box: fill-box; transform-origin: bottom; animation: coverRise .9s cubic-bezier(.2,.8,.2,1) both; }
  .cover-art .pop { animation: coverFade .6s ease both; }

<script>
(() => {
  "use strict";
  // Safari antigo (iPad com iOS < 15.4) não tem <dialog>.showModal: imita o básico.
  document.querySelectorAll("dialog").forEach(d => {
    if (typeof d.showModal === "function") return;
    Object.defineProperty(d, "open", { get: () => d.hasAttribute("open"), configurable: true });
    d.showModal = d.show = () => { d.setAttribute("open", ""); d.classList.add("nomodal"); };
    d.close = () => { if (!d.hasAttribute("open")) return; d.removeAttribute("open"); d.dispatchEvent(new Event("close")); };
  });

  /* =====================================================================
     Utilidades
     ===================================================================== */
  const $ = (s, el = document) => el.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const colLetter = i => { let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const colIndex = l => { let n = 0; for (const ch of l.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
  const nfNum = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
  const nfBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  const nfBRL2 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const nfCompact = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });
  const nfBRLCompact = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", notation: "compact", maximumFractionDigits: 2 });
  // Página de demonstração (portfólio): abre com dados fictícios de várias áreas e não usa a nuvem. Definido por tools/build-demo.js.
  const DEMO = window.ASSISTENTE_DEMO || null;

  function parseNum(v) {
    if (typeof v === "number") return v;
    let s = String(v ?? "").replace(/R\$|\s|%/g, "");
    if (!s || !/^-?[\d.,]+$/.test(s)) return NaN;
    if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
    else if (s.includes(",")) s = s.replace(",", ".");
    else if (/^\-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    return Number(s);
  }
  // Dinheiro só com sinal claro no nome; quantidades, tempos e contagens nunca são dinheiro.
  const NOT_MONEY = /quant|qtd|qtde|numero|n[º°]|registros|itens|unidades|contagem|percent|%|chamados|ordens/;
  const isMoneyCol = name => {
    const n = norm(name);
    if (/r\$|\breais\b/.test(n)) return true;
    if (NOT_MONEY.test(n)) return false;
    return /(^|\s)(custo|custos|preco|valor|valores|receita|receitas|despesa|despesas|faturamento|salario|lucro|orcamento|pagamento|pagamentos|gasto|gastos|montante|investimento|mao de obra|ticket medio)(\s|$)/.test(n);
  };
  // Tipo identificado na importação tem prioridade; sem ele, o nome da coluna decide.
  const isMoney = (sh, c) => sh.types?.[c] ? sh.types[c] === "moeda" : isMoneyCol(sh.columns[c]);
  const isPct = (sh, c) => sh.types?.[c] === "percentual";
  const isDur = (sh, c) => sh.types?.[c] === "duracao";
  // Colunas em que somar não faz sentido (preço unitário, taxa, tempo...): usa-se a média.
  const isAvgCol = (sh, c) => c >= 0 && (isPct(sh, c) || isDur(sh, c) || /(^|[\s(])(preco|unitario|media|taxa|nota|idade|margem|ticket|tempo|mttr|mtbf|indice|disponibilidade)/.test(norm(sh.columns[c])));
  // Nome do que é contado: "O.S." quando a planilha é de ordens de serviço, senão "Registros".
  const countLabel = sh => sh.columns.some(c => /(^|\s)(o\.?s\.?|ordens? de servico|ordem de servico)(\s|$)/.test(norm(c))) ? "O.S." : "Registros";
  const colName = (sh, c) => c < 0 ? countLabel(sh) : sh.columns[c];

  /* =====================================================================
     Estado (dados de exemplo) + persistência local
     ===================================================================== */
  const MESES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set"];
  function sampleSales() {
    const base = { "Serviços": [42, 3.4], "Produtos": [31, 1.2], "Assinaturas": [18, 2.1] };
    const custoPct = { "Serviços": .58, "Produtos": .71, "Assinaturas": .34 };
    const rows = [];
    MESES.forEach((m, i) => {
      for (const [cat, [b, g]] of Object.entries(base)) {
        const wobble = [1, .96, 1.04, .99, 1.07, 1.02, .94, 1.08, 1.05][i];
        const rec = Math.round((b + g * i) * 1000 * wobble / 10) * 10;
        const custo = Math.round(rec * custoPct[cat] * (cat === "Produtos" && i > 5 ? .93 : 1) / 10) * 10;
        const r = rows.length + 2;
        rows.push([m, cat, String(rec), String(custo), `=C${r}-D${r}`]);
      }
    });
    return rows;
  }
  // Estado inicial: vazio. Os exemplos só aparecem quando o usuário pede ("ver dados de exemplo").
  const emptyState = () => ({ view: "painel", activeSheet: null, filter: { col: null, val: "" }, sheets: [], charts: [], tasks: [], history: [] });
  function sampleState() {
    const vendasId = uid(), estoqueId = uid();
    return {
      view: "painel",
      activeSheet: vendasId,
      filter: { col: 1, val: "" },
      sheets: [
        { id: vendasId, sample: true, name: "Vendas 2026", columns: ["Mês", "Categoria", "Receita", "Custo", "Lucro"], rows: sampleSales() },
        { id: estoqueId, sample: true, name: "Estoque", columns: ["Item", "Fornecedor", "Quantidade", "Preço unitário", "Valor total"], rows: [
          ["Papel A4 (cx)", "Fornecedor A", "38", "189.90", "=C2*D2"],
          ["Toner HP 85A", "Fornecedor B", "12", "329.00", "=C3*D3"],
          ["Cadeira ergonômica", "Fornecedor C", "6", "1240.00", "=C4*D4"],
          ["Monitor 24\"", "Fornecedor B", "9", "899.00", "=C5*D5"],
          ["Café em grãos (kg)", "Fornecedor D", "24", "72.50", "=C6*D6"],
          ["Headset USB", "Fornecedor B", "15", "214.00", "=C7*D7"],
        ] },
      ],
      charts: [
        { id: uid(), sheetId: vendasId, type: "line", label: 0, values: [2, 3], title: "Receita e custo por mês" },
        { id: uid(), sheetId: vendasId, type: "doughnut", label: 1, values: [4], title: "Lucro por categoria" },
        { id: uid(), sheetId: vendasId, type: "bar", label: 0, values: [4], title: "Lucro por mês" },
        { id: uid(), sheetId: estoqueId, type: "bar", label: 0, values: [4], title: "Valor em estoque por item" },
      ],
      tasks: [
        { id: uid(), sample: true, text: "Fechar relatório de setembro", due: "2026-09-30", done: false },
        { id: uid(), sample: true, text: "Renegociar contrato com Fornecedor B", due: "2026-09-24", done: false },
        { id: uid(), sample: true, text: "Revisar metas do 4º trimestre", due: "2026-10-10", done: false },
        { id: uid(), sample: true, text: "Enviar planilha de estoque ao financeiro", due: "2026-09-20", done: true },
      ],
      history: [],
    };
  }
  /* ---------- Armazenamento ----------
     Os dados ficam no IndexedDB do navegador (centenas de MB ou mais, conforme o disco).
     Versões anteriores usavam localStorage (~5 MB); o conteúdo antigo é migrado na primeira abertura.
     Sem IndexedDB (ex.: algumas janelas anônimas), volta para localStorage; sem nenhum, fica só na memória. */
  const KEY = "assistente-gestao-v1";
  let state = null;           // carregado de forma assíncrona em boot()
  let storeMode = "memory";   // "idb" | "local" | "memory"
  let idb = null, movedFromLocal = false;
  const migrated = [];
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
  function idbOpen() {
    return new Promise((res, rej) => {
      let req; try { req = indexedDB.open("assistente-gestao", 1); } catch (e) { return rej(e); }
      req.onupgradeneeded = () => req.result.createObjectStore("kv");
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error("blocked"));
    });
  }
  const idbReq = (mode, fn) => new Promise((res, rej) => {
    const tx = idb.transaction("kv", mode), out = fn(tx.objectStore("kv"));
    tx.oncomplete = () => res(out?.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
  });
  function readLocal() { try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
  async function loadState() {
    try {
      idb = await withTimeout(idbOpen(), 4000);
      let s = await idbReq("readonly", st => st.get("state"));
      if (!s) {
        const old = readLocal();
        if (old) { s = old; await idbReq("readwrite", st => st.put(old, "state")); try { localStorage.removeItem(KEY); } catch {} movedFromLocal = true; }
      }
      storeMode = "idb";
      navigator.storage?.persist?.().catch(() => {}); // pede ao navegador para não apagar os dados sozinho
      return s || emptyState();
    } catch {
      idb = null;
      try { localStorage.setItem(KEY + "-teste", "1"); localStorage.removeItem(KEY + "-teste"); storeMode = "local"; } catch { storeMode = "memory"; }
      return readLocal() || emptyState();
    }
  }
  let saveTimer = null, saveChain = Promise.resolve(), warnedQuota = false, lastSaveOk = true;
  function warnStorage(msg) { if (warnedQuota) return; warnedQuota = true; setTimeout(() => say(msg, "bot", "err"), 0); }
  function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (!state) return;
    if (storeMode === "idb") {
      // Uma gravação por vez, na ordem.
      saveChain = saveChain.then(() => idbReq("readwrite", st => st.put(state, "state")))
        .then(() => { lastSaveOk = true; updateStoreInfo(); })
        .catch(() => { lastSaveOk = false; updateStoreInfo(); warnStorage(`Não consegui salvar no navegador (o disco pode estar cheio). Os dados continuam abertos agora, mas faça um ${code("backup")} para não perder nada.`); });
    } else if (storeMode === "local") {
      try { localStorage.setItem(KEY, JSON.stringify(state)); lastSaveOk = true; }
      catch { lastSaveOk = false; warnStorage(`Seus dados passaram do limite deste navegador (cerca de 5 MB) e <b>podem sumir ao fechar a página</b>. Faça um ${code("backup")} agora.`); }
      updateStoreInfo();
    } else if (!cloudOk) {
      warnStorage(`Este navegador não está permitindo salvar dados (janela anônima ou bloqueio). Tudo funciona agora, mas some ao fechar. Use ${code("backup")} para guardar um arquivo.`);
      updateStoreInfo();
    }
  }
  const save = () => { if (!state) return; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500); scheduleCloud(); };

  /* ---------- Nuvem (capacidade "db" do Claude) ----------
     No iPad, o que a página guarda no navegador pode ser apagado ao fechar. Por isso uma cópia fica
     no banco do próprio assistente (só o dono lê e grava) e é carregada ao abrir, em qualquer aparelho.
     O estado vai em partes de até 60 mil caracteres (limite do banco: 256 KiB por documento). */
  const CLOUD_CHUNK = 60000;
  const dbReady = !DEMO && window.claude?.use ? window.claude.use("db").catch(() => null) : Promise.resolve(null);
  let cloudDb = null, cloudChunks = [], cloudLast = "", cloudTimer = null, cloudBusy = false, cloudDirty = false, cloudOk = null;
  let cloudHadSheets = 0, userRemovedSheets = false; // trava contra apagar a nuvem por engano
  // Tokens de API não vão para a nuvem; ficam só no aparelho.
  // Token no endereço (?token=...) também é segredo: sai da cópia na nuvem e do backup, como os cabeçalhos.
  const stripUrlSecret = u => String(u || "").replace(/([?&](?:token|apikey|api_key|api-key|key|access_token|auth)=)[^&#]*/gi, "$1");
  const publicApi = api => ({ ...api, url: stripUrlSecret(api.url), headers: "", lastError: "" });
  const cloudText = () => JSON.stringify({ ...state, savedAt: undefined, sheets: state.sheets.map(sh => sh.api ? { ...sh, api: publicApi(sh.api) } : sh) });
  function scheduleCloud() { if (!cloudDb) return; clearTimeout(cloudTimer); cloudTimer = setTimeout(cloudSave, 2500); }
  async function cloudSave() {
    if (!cloudDb || !state) return;
    if (cloudBusy) { cloudDirty = true; return; }
    if (!state.sheets.length && cloudHadSheets && !userRemovedSheets) return; // estado vazio não substitui planilhas salvas
    const txt = cloudText();
    if (txt === cloudLast) return;
    cloudBusy = true; cloudDirty = false;
    try {
      const now = Date.now(), parts = [];
      for (let i = 0; i < txt.length; i += CLOUD_CHUNK) parts.push(txt.slice(i, i + CLOUD_CHUNK));
      for (let i = 0; i < parts.length; i++) if (cloudChunks[i] !== parts[i]) { await cloudDb.doc(`nuvem/parte${i}`).set({ t: parts[i] }); cloudChunks[i] = parts[i]; }
      await cloudDb.doc("nuvem/meta").set({ n: parts.length, len: txt.length, savedAt: now, v: 1 });
      for (let i = parts.length; i < cloudChunks.length; i++) await cloudDb.doc(`nuvem/parte${i}`).delete().catch(() => {});
      cloudChunks.length = parts.length; cloudLast = txt; cloudOk = true; cloudHadSheets = state.sheets.length;
      state.savedAt = now; clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 500);
    } catch (e) { cloudOk = false; console.warn("nuvem:", e?.code || e); }
    finally { cloudBusy = false; updateStoreInfo(); if (cloudDirty) scheduleCloud(); }
  }
  async function cloudLoad() {
    const db = await withTimeout(dbReady, 6000).catch(() => null);
    if (!db) return null;
    // Só passa a gravar na nuvem depois de conseguir LER o que já está lá; se a leitura falhar,
    // esta sessão não grava nada (senão um estado vazio podia apagar a cópia boa).
    try {
      const meta = await withTimeout(db.doc("nuvem/meta").get(), 8000);
      if (!meta.exists) { cloudDb = db; cloudOk = true; return { empty: true }; }
      const m = meta.data();
      const docs = await withTimeout(Promise.all(Array.from({ length: m.n }, (_, i) => db.doc(`nuvem/parte${i}`).get())), 15000);
      if (docs.some(d => !d.exists)) { cloudOk = false; return null; }
      const parts = docs.map(d => d.data().t), txt = parts.join("");
      if (m.len && txt.length !== m.len) { cloudOk = false; return null; } // cópia pela metade: fica com a do aparelho e não grava
      const parsed = JSON.parse(txt);
      cloudChunks = parts; cloudLast = txt; cloudOk = true; cloudDb = db;
      cloudHadSheets = (parsed.sheets || []).length;
      return { state: parsed, savedAt: m.savedAt || 0 };
    } catch (e) { cloudOk = false; console.warn("nuvem:", e?.code || e); return null; }
  }
  addEventListener("pagehide", () => { if (saveTimer) saveNow(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden && saveTimer) saveNow(); });
  const fmtBytes = b => b >= 1e9 ? nfNum.format(Math.round(b / 1e8) / 10) + " GB" : b >= 1e6 ? nfNum.format(Math.round(b / 1e5) / 10) + " MB" : Math.max(1, Math.round(b / 1e3)) + " KB";
  let infoTimer = null;
  function updateStoreInfo() {
    clearTimeout(infoTimer);
    infoTimer = setTimeout(async () => {
      const el = $("#storeInfo"); if (!el || !state) return;
      let used = 0; try { used = new Blob([JSON.stringify(state)]).size; } catch {}
      let quota = 0; try { const est = await navigator.storage?.estimate?.(); quota = est?.quota || 0; } catch {}
      const cloudTxt = cloudOk === true ? " · cópia na nuvem ✓" : cloudOk === false ? " · nuvem indisponível" : "";
      const label0 = storeMode === "idb" ? `Salvo neste navegador · ${fmtBytes(used)}${quota ? ` de ${fmtBytes(quota)} disponíveis` : ""}`
        : storeMode === "local" ? `Salvo neste navegador · ${fmtBytes(used)} de ~5 MB (armazenamento limitado)`
        : cloudOk ? "Salvo só na nuvem do assistente" : "Não está salvando: use Fazer backup";

    // "variação %": entre colunas parecidas, prefere a que é percentual.
    if (/%|percent/.test(measureText)) { const pc = numericCols(sh).find(c => /%|percent/i.test(sh.columns[c]) && nums.some(x => stemPhrase(sh.columns[x]).split(" ")[0] === stemPhrase(sh.columns[c]).split(" ")[0])); if (pc != null) { const st = stemPhrase(sh.columns[pc]).split(" ")[0]; nums = [pc, ...nums.filter(x => x !== pc && stemPhrase(sh.columns[x]).split(" ")[0] !== st)]; } }
    // Citou uma coluna numérica (custo, tempo, peças...) -> mede essa coluna; senão, conta registros.
    out.values = nums.length ? nums.slice(0, 3) : [-1];
    out.agg = avg ? "avg" : sum ? "sum" : "auto";
    // Sem "por": agrupa pela coluna de texto/categoria citada ("top 10 equipamentos")
    if (out.label == null) {
      const g = chartColsIn(sh, measureText).find(c => !numericCols(sh).includes(c));
      if (g != null) out.label = g;
    }
    // Valores citados: dois ou mais ("abertas x fechadas") viram comparação; um só vira filtro.
    if (vh) {
      if (vh.vals.length >= 2) {
        if (out.label == null || out.label === vh.col) { out.label = vh.col; out.where = { col: vh.col, vals: vh.vals }; }
        else { out.split = { col: vh.col, vals: vh.vals }; out.values = [out.values[0]]; }
      } else if (out.label !== vh.col) {
        out.where = { col: vh.col, val: vh.vals[0] };
        if (out.label == null) { const pc = periodCol(sh); out.label = pc ?? dateCols[0]; }
      }
    }
    if (out.label == null) return { error: `Diga como agrupar, por exemplo: ${chartExamples(sh).slice(0, 3).map(e => code(e)).join(", ")}.` };
    if (range) out.range = range;
    // Tipo
    const period = isDateCol(sh, out.label) || out.label === periodCol(sh);
    if (/pizza|rosca|donut|torta/.test(n0) && !out.split) out.type = "doughnut";
    else if ((/ranking|lista|tabela/.test(n0) || (out.top && !/barra|coluna/.test(n0))) && !out.split) out.type = "rank";
    else if (/linha|evolucao|tendencia|ao longo/.test(n0) || period && !/barra|coluna|versus|\bvs\b|\bx\b|contra|compar/.test(n0)) out.type = "line";
    else out.type = "bar";
    if (out.type === "doughnut" && out.values.length > 1) out.values = [out.values[0]];
    return out;
  }
  // Exemplos de pedidos usando as colunas reais da planilha.
  /* Menu de pedidos: sem IA (versão offline / link próprio), mostra o que dá para pedir com as colunas desta planilha.
     Cada item é um comando que o interpretador já entende; escolher no menu executa na hora. */
  function menuOptions(sh) {
    if (!sh) return [];
    const cl = countLabel(sh) === "O.S." ? "O.S." : "registros", pc = periodCol(sh);
    const hasPeriod = pc != null || dateColOf(sh) >= 0;
    const nm = c => sh.columns[c].replace(/\s*\(.*?\)\s*/g, " ").replace(/\s+/g, " ").trim().toLowerCase();
    const counts = c => { const m = new Map(); sh.rows.forEach(r => { const v = r[c]; if (v) m.set(v, (m.get(v) || 0) + 1); }); return [...m].sort((a, b) => b[1] - a[1]).map(x => x[0]); };
    const nc = numericCols(sh).filter(c => !isIdCol(sh, c));
    const cats = sh.columns.map((_, i) => i).filter(i => effType(sh, i) === "categoria" && i !== pc && !isIdCol(sh, i) && counts(i).length >= 2).sort((a, b) => counts(a).length - counts(b).length);
    const statusCol = cats.find(c => /status|situacao|tipo|prioridade|etapa|fase/.test(norm(sh.columns[c])) && counts(c).length <= 8) ?? cats.find(c => counts(c).length <= 6);
    const small = cats.filter(c => counts(c).length <= 30), big = cats.find(c => counts(c).length > 8);
    const numTxt = c => isAvgCol(sh, c) ? `média de ${nm(c)}` : `soma de ${nm(c)}`;
    const G = [], add = (group, label, cmd) => { let g = G.find(x => x.group === group); if (!g) G.push(g = { group, items: [] }); if (!g.items.some(i => i[1] === cmd) && g.items.length < 10) g.items.push([label, cmd]); };
    const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
    // Gráficos
    small.slice(0, 4).forEach(c => add("Gráficos", `Quantidade de ${cl} por ${nm(c)}`, `gráfico de quantidade de ${cl} por ${nm(c)}`));
    if (hasPeriod) add("Gráficos", `${cap(cl)} por mês`, `gráfico de ${cl} por mês`);
    if (statusCol != null && hasPeriod) { const [a, b] = counts(statusCol); if (a && b) add("Gráficos", `${a} x ${b} por mês`, `gráfico de ${cl} ${a.toLowerCase()} x ${b.toLowerCase()} por mês`); }
    nc.slice(0, 2).forEach(n => { if (small[0] != null) add("Gráficos", `${cap(numTxt(n))} por ${nm(small[0])}`, `gráfico de ${numTxt(n)} por ${nm(small[0])}`); if (hasPeriod) add("Gráficos", `${cap(numTxt(n))} por mês`, `gráfico de ${numTxt(n)} por mês`); });
    const pie = cats.find(c => counts(c).length <= 8); if (pie != null) add("Gráficos", `Pizza: ${cl} por ${nm(pie)}`, `gráfico de pizza de ${cl} por ${nm(pie)}`);
    if (big != null) add("Gráficos", `Top 10 ${nm(big)}`, `top 10 ${nm(big)}`);
    // Cartões
    if (statusCol != null) counts(statusCol).slice(0, 4).forEach(v => add("Cartões", `${cap(cl)}: ${v}`, `cartão de ${cl} ${v.toLowerCase()}`));
    nc.slice(0, 3).forEach(n => { add("Cartões", `Média de ${nm(n)}`, `cartão de média de ${nm(n)}`); if (!isAvgCol(sh, n)) add("Cartões", `Total de ${nm(n)}`, `cartão de soma de ${nm(n)}`); });
    // Análises
    add("Análises", "Resumo da planilha", "resumo"); add("Análises", "Como cada coluna é calculada", "verificar");
    nc.slice(0, 3).forEach(n => { add("Análises", `Maior ${nm(n)}`, `maior ${nm(n)}`); add("Análises", `Média de ${nm(n)}`, `média de ${nm(n)}`); if (!isAvgCol(sh, n)) add("Análises", `Somar ${nm(n)}`, `somar ${nm(n)}`); });
    // Filtros
    [statusCol, small.find(c => c !== statusCol)].filter(c => c != null).forEach(c => counts(c).slice(0, 4).forEach(v => add("Filtrar o painel", `${sh.columns[c]} = ${v}`, `filtrar ${nm(c)} = ${v}`)));
    if (G.some(g => g.group === "Filtrar o painel")) add("Filtrar o painel", "Tirar o filtro", "limpar filtro");
    // Planilha
    add("Planilha", "Abrir a planilha", "mostrar planilha");
    if (nc[0] != null) add("Planilha", `Ordenar por ${nm(nc[0])} (maior primeiro)`, `ordenar por ${nm(nc[0])} desc`);
    add("Planilha", "Baixar em Excel", "exportar excel"); add("Planilha", "Baixar em CSV", "exportar csv"); add("Planilha", "Fazer backup", "fazer backup");
    return G;
  }
  function menuHtml(sh) {
    const G = menuOptions(sh); if (!G.length) return "";
    return `<select class="menu-pick" data-menu="1" data-sheet="${esc(sh.id)}" aria-label="Menu de pedidos para ${esc(sh.name)}"><option value="">Escolha um pedido…</option>${G.map(g => `<optgroup label="${esc(g.group)}">${g.items.map(([l, c]) => `<option value="${esc(c)}">${esc(l)}</option>`).join("")}</optgroup>`).join("")}</select>`;
  }
  function showMenu(sh) {
    if (!sh) return say(`Ainda não há planilhas. Digite ${code("importar dados")} ou arraste um arquivo para a página.`);
    say(`📋 <b>O que você quer ver em ${esc(sh.name)}?</b> Escolha no menu e eu faço na hora.${menuHtml(sh)}<small style="display:block;margin-top:6px;color:var(--wa-meta)">O menu fica guardado aqui na conversa. Para abrir de novo, toque em <b>📋 Menu de pedidos</b> ou digite ${code("menu")}.</small>`);
  }
  function chartExamples(sh) {
    if (!sh) return [];
    const cl = countLabel(sh) === "O.S." ? "O.S." : "registros";
    const pc = periodCol(sh);
    const nc = numericCols(sh), tc = sh.columns.map((_, i) => i).filter(i => !nc.includes(i) && !isIdCol(sh, i) && !isDateCol(sh, i) && i !== pc);
    const uniq = c => new Set(sh.rows.map(r => r[c]).filter(Boolean)).size;
    const cats = tc.filter(c => uniq(c) >= 2 && uniq(c) < sh.rows.length).sort((a, b) => uniq(a) - uniq(b));
    const hasDate = sh.columns.some((_, i) => isDateCol(sh, i)) || periodCol(sh) != null;
    const ex = [];
    if (cats[1] != null || cats[0] != null) ex.push(`quantidade de ${cl} por ${sh.columns[cats[cats.length > 1 ? 1 : 0]].toLowerCase()}`);
    if (hasDate) ex.push(`${cl} por mês`);
    if (cats[0] != null) ex.push(`pizza de ${cl} por ${sh.columns[cats[0]].toLowerCase()}`);
    const big = cats[cats.length - 1];
    if (big != null) ex.push(`top 10 ${sh.columns[big].toLowerCase()}`);
    if (nc[0] != null && cats[0] != null) ex.push(`${isAvgCol(sh, nc[0]) ? "média de " : ""}${sh.columns[nc[0]].toLowerCase()} por ${sh.columns[cats[0]].toLowerCase()}`);
    return ex.length ? ex : [`quantidade de ${cl} por ${sh.columns[0].toLowerCase()}`];
  }
  function periodCol(sh) {
    if (sh.periodCol != null && sh.periodCol < sh.columns.length) return sh.periodCol;
    const tc = textCols(sh);
    return tc.find(c => /^(mes|periodo|semana|trimestre|ano|mes\/ano)$/.test(norm(sh.columns[c])));
  }
  const findSheet = name => { const n = norm(name); return state.sheets.find(s => norm(s.name) === n) || state.sheets.find(s => norm(s.name).includes(n)); };

  const isDateCol = (sh, c) => c != null && c >= 0 && effType(sh, c) === "data";
  const useAvg = (sh, c, agg) => c >= 0 && (agg === "avg" || (agg !== "sum" && isAvgCol(sh, c)));
  function measureLabel(sh, v, agg) {
    if (v < 0) return countLabel(sh) === "O.S." ? "Quantidade de O.S." : "Quantidade de registros";
    return `${useAvg(sh, v, agg) ? "Média de" : "Total de"} ${sh.columns[v].toLowerCase()}`;
  }
  function groupLabel(sh, c, dateGroup) {
    return isDateCol(sh, c) ? `${{ ano: "ano", dia: "dia" }[dateGroup] || "mês"} (${sh.columns[c].toLowerCase()})` : sh.columns[c].toLowerCase();

  function chartData(sh, c, rows) {

  // "01/08 a 15/09", "desde 01/08/2026", "últimos 30 dias", "últimos 3 meses", "esta semana", "hoje", "este ano", "2026"

    if (/^hoje$/.test(p)) return { type: "dates", rel: { n: 1, unit: "dias" }, label };

        delta = `<div class="delta"><span class="${good ? "up" : "down"}">${pct >= 0 ? "▲" : "▼"} ${new Intl.NumberFormat("pt-BR", { maximumFractionDigits: Math.abs(pct) >= 10 ? 0 : 1 }).format(Math.abs(pct))}%</span> vs ${esc(dl.label.split(" vs ")[1] || "")}</div>`;
      }
    }
    const huge = cd.col >= 0 && Math.abs(v) >= 1e8 && !isMoney(sh, cd.col);
    return `<div class="panel kpi" data-card="${cd.id}" role="button" tabindex="0" aria-label="Editar cartão ${esc(cardTitle(sh, cd))}">${tools}<span class="lbl" title="${esc(cardTitle(sh, cd))}">${esc(cardTitle(sh, cd))}</span><span class="val" title="${esc(cd.col >= 0 && cd.agg !== "count" ? fmtCol(sh, cd.col, v) : nfNum.format(v))}">${cardFormat(sh, cd, v)}</span>`
      + (huge ? `<div class="delta" style="margin-top:2px"><span class="down">⚠ Valor muito alto. É um código?</span></div><button class="btn" style="margin-top:6px;align-self:flex-start" data-suggest="${esc(sh.columns[cd.col].toLowerCase())} é código">Marcar como código</button>` : "")
      + `${delta}</div>`;
  }

  function drawChart(sh, c, rows, tok, series) {
    const { aggs, labels, isPeriod } = chartData(sh, c, c.where || c.range ? cardRows(sh, c, rows) : rows); // gráfico pode ter filtro/mês próprios
    const round = c.type === "doughnut";
    const money = c.values.every(v => v >= 0 && isMoney(sh, v));
    const dur = c.values.every(v => v >= 0 && isDur(sh, v));
    const fmt = v => money ? nfBRL.format(v) : dur ? fmtDur(v) : nfNum.format(Math.round(v * 100) / 100);
    const tick = v => money ? "R$ " + nfCompact.format(v) : dur ? v + "h" : nfCompact.format(v);

    if (c.type === "rank") {
      const el = $("#r_" + c.id); if (!el) return;
      const a = aggs[0], max = Math.max(...labels.map(l => a.get(l) || 0), 1), tot = labels.reduce((s, l) => s + (a.get(l) || 0), 0) || 1;
      const count = c.values[0] < 0;
      el.innerHTML = labels.length ? labels.map((l, i) => { const v = a.get(l) || 0; return `
        <li><span class="rk-pos">${i + 1}</span><span class="rk-name" title="${esc(l)}">${esc(l)}</span>
        <span class="rk-bar"><i style="width:${Math.max(2, v / max * 100)}%"></i></span>
        <span class="rk-val">${esc(fmt(v))}${count ? `<small>${nfNum.format(Math.round(v / tot * 1000) / 10)}%</small>` : ""}</span></li>`; }).join("") : `<li class="empty">Sem dados para mostrar.</li>`;
      return;
    }
    const el = $("#c_" + c.id); if (!el) return;
    const horizontal = c.type === "bar" && !isPeriod && (labels.length > 5 || Math.max(...labels.map(l => String(l).length)) > 10);
    const vals = round ? [aggs[0]] : aggs;
    const single = vals.length === 1;
    const datasets = vals.map((a, i) => ({
      label: c.split ? c.split.vals[i] : measureLabel(sh, c.values[i], c.agg),
      data: labels.map(l => a.get(l) || 0),
      backgroundColor: round ? labels.map((l, j) => /^Outros/.test(l) ? tok("--border-strong") : series[j]) : (c.type === "line" ? series[i] + "22" : series[i]),
      borderColor: round ? tok("--surface") : series[i],
      borderWidth: round ? 3 : 2,
      borderRadius: c.type === "bar" ? 5 : 0,
      borderSkipped: false,
      pointRadius: c.type === "line" ? (labels.length > 24 ? 0 : 4) : 0,
      pointHoverRadius: 6,
      pointBackgroundColor: series[i],
      pointBorderColor: tok("--surface"),
      pointBorderWidth: 2,
      fill: c.type === "line" && single,
      tension: 0,
      barPercentage: .72, categoryPercentage: .8,
      maxBarThickness: horizontal ? 22 : 44,
    }));
    const showLabels = c.type === "bar" && single && labels.length <= 15;
    const total = round ? datasets[0].data.reduce((a, b) => a + b, 0) : 0;
    charts.push(new Chart(el, {
      type: c.type,
      data: { labels, datasets },
      plugins: [valueLabels, centerTotal],
      options: {
        responsive: true, maintainAspectRatio: false,
        indexAxis: horizontal ? "y" : "x",
        layout: { padding: { right: horizontal && showLabels ? Math.max(56, 12 + 7 * Math.max(...datasets[0].data.map(v => fmt(v).length))) : 8, top: !horizontal && showLabels ? 20 : 4 } },
        interaction: { mode: round ? "nearest" : "index", intersect: round, axis: horizontal ? "y" : "x" },
        cutout: round ? "64%" : undefined,
        plugins: {
          vl: { on: showLabels, horizontal, fmt, color: tok("--text-2") },
          ct: { on: round, text: money ? nfBRLCompact.format(total) : nfNum.format(Math.round(total)), label: c.values[0] < 0 ? "total" : "soma", color: tok("--text"), sub: tok("--muted") },
          legend: { display: round || !single, position: round ? "right" : "top", align: round ? "center" : "end", labels: { color: tok("--text-2"), boxWidth: 10, boxHeight: 10, padding: 12, usePointStyle: true, pointStyle: "rectRounded", generateLabels: round ? chart => { const ds = chart.data.datasets[0], tot = ds.data.reduce((a, b) => a + b, 0) || 1; return chart.data.labels.map((l, i) => ({ text: `${String(l).length > 22 ? String(l).slice(0, 21) + "…" : l}  ${nfNum.format(Math.round(ds.data[i] / tot * 1000) / 10)}%`, fillStyle: ds.backgroundColor[i], strokeStyle: ds.backgroundColor[i], fontColor: tok("--text-2"), index: i, hidden: !chart.getDataVisibility(i), pointStyle: "rectRounded" })); } : undefined } },
          tooltip: {
            backgroundColor: tok("--raised"), borderColor: tok("--border-strong"), borderWidth: 1,
            titleColor: tok("--text"), bodyColor: tok("--text-2"), padding: 10, boxPadding: 4,
            callbacks: { label: ctx => {
              if (round) { const tot = ctx.dataset.data.reduce((a, b) => a + b, 0) || 1; return ` ${ctx.label}: ${fmt(ctx.parsed)} (${nfNum.format(Math.round(ctx.parsed / tot * 1000) / 10)}%)`; }
              return ` ${ctx.dataset.label}: ${fmt(horizontal ? ctx.parsed.x : ctx.parsed.y)}`;
            } },
          },
        },
        scales: round ? {} : (() => {
          const cat = { grid: { display: false }, border: { display: false }, ticks: { color: tok("--text-2"), autoSkip: !horizontal, maxRotation: 0, padding: 6, callback(v) { const l = String(this.getLabelForValue(v)); return l.length > 24 ? l.slice(0, 23) + "…" : l; } } };
          const val = { beginAtZero: true, grid: { color: tok("--grid"), drawTicks: false }, border: { display: false }, ticks: { color: tok("--muted"), callback: tick, maxTicksLimit: 5, padding: 6, precision: c.values[0] < 0 ? 0 : undefined } };
          if (horizontal && showLabels) { val.display = false; }
          return horizontal ? { x: val, y: cat } : { x: cat, y: val };
        })(),
      },
    }));
  }

  const log = $("#log");
  let sayCapture = null; // quando a IA executa um comando, guarda as respostas para devolver a ela
  /* Conversa estilo WhatsApp: balões com hora, separador de dia, "digitando…" e histórico salvo. */
  const NO_DELAY = navigator.webdriver || matchMedia?.("(prefers-reduced-motion: reduce)").matches;
  const hhmm = t => new Date(t).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  function dayLabel(t) {
    const d = new Date(t).toDateString(), today = new Date(), y = new Date(); y.setDate(today.getDate() - 1);
    return d === today.toDateString() ? "Hoje" : d === y.toDateString() ? "Ontem" : new Date(t).toLocaleDateString("pt-BR");
  }
  let lastDay = "";
  function daySep(t) {
    const k = new Date(t).toDateString(); if (k === lastDay) return;
    lastDay = k;
    const s = document.createElement("div"); s.className = "day"; s.textContent = dayLabel(t); log.appendChild(s);
  }
  const TICKS = `<svg class="ticks" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.6" aria-label="lida"><path d="M1 6l3 3 6-7M6.5 8.5l1 1 6-7"/></svg>`;
  function bubble(html, who, extra, t) {
    const el = document.createElement("div");
    el.className = `msg ${who} ${extra}`;
    el.innerHTML = `<div class="txt">${html}</div><span class="meta">${hhmm(t)}${who === "user" ? TICKS : ""}</span>`;
    return el;
  }
  function remember(who, extra, html, t) {
    if (!state) return;
    if (!state.chat) state.chat = [];
    state.chat.push({ w: who, x: extra, h: html, t });
    if (state.chat.length > 80) state.chat.splice(0, state.chat.length - 80);
    save();
  }
  const setStatus = s => { const el = $("#assistStatus"); if (el) el.textContent = s; };
  const typing = document.createElement("div");
  typing.className = "msg bot typing"; typing.setAttribute("aria-label", "digitando"); typing.innerHTML = "<i></i><i></i><i></i>";
  let revealAt = 0, pendingMsgs = 0, chatReady = false;
  function say(html, who = "bot", extra = "") {
    if (sayCapture && who === "bot") return sayCapture.push(html); // a IA resume o resultado na resposta dela
    const t = Date.now();
    daySep(t);
    const el = bubble(html, who, extra, t);
    log.appendChild(el);
    remember(who, extra, html, t);
    // A resposta aparece depois de um instante "digitando…", como numa conversa.
    if (who === "bot" && chatReady && !NO_DELAY) {
      const now = performance.now();
      revealAt = Math.max(revealAt, now) + Math.min(1100, 350 + el.textContent.length * 4);
      el.hidden = true; pendingMsgs++;
      log.appendChild(typing); setStatus("digitando…");
      setTimeout(() => {
        el.hidden = false;
        if (--pendingMsgs === 0) { typing.remove(); setStatus("online"); } else log.appendChild(typing);
        log.scrollTop = log.scrollHeight;
      }, revealAt - now);
    }
    log.scrollTop = log.scrollHeight;
  }
  function restoreChat() {
    (state.chat || []).forEach(m => { daySep(m.t); log.appendChild(bubble(m.h, m.w, m.x || "", m.t)); });
    log.scrollTop = log.scrollHeight;
  }
  const code = s => `<code>${esc(s)}</code>`;

  function run(input) {
    if (!state) return;
    bust();
    const raw = input.trim().replace(/^\//, "");
    if (!raw) return;
    say(esc(raw), "user");
    state.history.push(raw);
    state.history = state.history.slice(-50);
    Promise.resolve().then(() => handle(raw)).catch(e => { if (!state.sheets.length) { say(`Você ainda não tem planilhas. Digite ${code("importar dados")} ou cole seus dados aqui.`, "bot", "err"); save(); return; } say("Não consegui executar esse comando. Digite " + code("ajuda") + " para ver exemplos.", "bot", "err"); console.error(e); }).finally(save);
  }

  async function handle(raw, nested = false) {
    const n = norm(raw);
    const sh = sheet();
    let m;

    if (/^(menu|menu de pedidos|opcoes|o que (eu )?posso pedir|pedidos)\b/.test(n)) return showMenu(sh);
    if (/^(capa|inicio|tela inicial|abertura)$/.test(n)) { showCover(); return say("Abri a capa."); }

      return say(`Cartões mostrando <b>${per === "all" ? "todo o período" : per === "last" ? "o último mês" : per.from === per.to ? per.from : `${per.from} a ${per.to}`}</b>. ${kept.length ? ` Mantive como estavam: ${kept.map(c => `<b>${esc(c.title)}</b>`).join(", ")}.` : ""} Cada cartão pode ter um período próprio pelo lápis.`);
    }
    if (/^(restaurar|voltar|resetar)\s+(os\s+)?cartoes( automaticos| originais)?$/.test(n)) { delete sh.cards; sh.hiddenKpis = []; goto("painel"); return say("Voltei os cartões para a escolha automática."); }
    if ((m = n.match(/^(?:remover|apagar|excluir|tirar)\s+(?:o\s+)?cartao\s+(?:de\s+)?(.+)$/))) {
      const want = m[1].split(/\s+/).filter(w => w.length > 1 && !/^(de|do|da|dos|das|o|a|os|as|e)$/.test(w)).map(w => w.replace(/(as|os|es|s)$/, ""));
      const cd = cardsFor(sh).find(c => norm(cardTitle(sh, c)).includes(m[1])) || cardsFor(sh).find(c => want.length && want.every(w => norm(cardTitle(sh, c)).includes(w)));
      if (!cd) return say(`Não achei um cartão com “${esc(m[1])}”. Cartões: ${cardsFor(sh).map(c => code(cardTitle(sh, c))).join(", ")}.`, "bot", "err");
      snapshot("cartão"); removeCard(sh, cd.id); goto("painel"); return say(`Cartão <b>${esc(cardTitle(sh, cd))}</b> removido.${undoBtn}`);
    }
    if (/^(criar|cria|novo|nova|adicionar|adiciona|quero|fazer)?\s*(um\s+)?(novo\s+)?(cartao|card|indicador|kpi)\s+/.test(n)) {
      if (!nested && !chartUnderstood(sh, n.replace(/\b(cartao|card|indicador|kpi|cartoes|maior|menor|maximo|minimo)\b/g, " ")) && await askAI(raw)) return;
      const cd = parseCardRequest(sh, n, raw);
      if (!cd) { openCardEditor(); return say(`Não entendi o que o cartão deve mostrar; abri o editor. Exemplos: ${code(`cartão de ${countLabel(sh) === "O.S." ? "O.S." : "registros"} ${(() => { const nc = numericCols(sh); const cats = sh.columns.map((_, i) => i).filter(i => effType(sh, i) === "categoria" && i !== periodCol(sh) && !nc.includes(i)); const c = cats.find(i => /status|situacao|tipo|prioridade/.test(norm(sh.columns[i]))) ?? cats[0]; return c != null ? String(sh.rows.find(r => r[c])?.[c] || "").toLowerCase() : "abertas"; })()}`)}, ${code(`cartão de média de ${(sh.columns[numericCols(sh)[0]] || "tempo").toLowerCase()}`)}.`); }
      const list = ownCards(sh); cd.id = uid();
      list.splice(list.findIndex(c => c.kind === "tasks") >= 0 ? list.findIndex(c => c.kind === "tasks") : list.length, 0, cd);
      goto("painel");
      return say(`Cartão <b>${esc(cardTitle(sh, cd))}</b> adicionado: ${esc(cardFormat(sh, cd, cardValue(sh, cd, filteredRows(sh))))}. Clique no lápis dele para mudar título, filtro ou posição.`);
    }
    if (/^(criar|cria|novo|nova|adicionar|fazer|faz|gerar|gera|montar|quero)?\s*(um\s+)?(novo\s+)?grafico$/.test(n)) { openBuilder(); return say("Abri o montador de gráfico. Escolha o que medir e como agrupar."); }
    const chartIntent = !/^(nova|criar|cria|adicionar)\s+tarefa|^concluir|^(abrir|apagar|excluir|remover)\s+planilha/.test(n) && (/grafico|pizza|rosca|ranking|\btop\s*\d/.test(n)
      || (/ por /.test(` ${n} `) && /^(mostrar|mostre|mostra|quero|ver|exibir|quantos|quantas|quantidade|numero|total|qtd|media|contar|conte|distribuicao|evolucao|comparar|o\.?s\b|os\b)/.test(n))
      || / por /.test(` ${n} `) && chartColsIn(sh, n.split(" por ")[0]).length > 0);
    if (chartIntent) {
      // Pedido com palavras que o interpretador não conhece: a IA entende melhor (quando disponível).
      if (!nested && !chartUnderstood(sh, n) && await askAI(raw)) return;
      const req = parseChartRequest(sh, n);
      if (req.error) { if (!nested && await askAI(raw)) return; return say(req.error, "bot", "err"); }
      const c = { id: uid(), sheetId: sh.id, ...req };
      c.title = chartTitle(sh, c);
      state.charts.push(c);
      goto("painel");
      $("#main").scrollTop = $("#main").scrollHeight;
      return say(`Adicionei <b>${esc(c.title)}</b> (${esc(unitText(sh, c))}). Mude o tipo nos botões do cartão ou clique no lápis para editar.`);
    }

    // Tarefas
    if ((m = raw.match(/^(?:nova|criar?|adicionar)\s+tarefa\s*:?\s*(.+)$/i))) {
      let text = m[1].trim(), due = "";
      const dm = text.match(/\s+(?:at[eé]|para|em|prazo)\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*$/i);
      if (dm) {
        const y = dm[3] ? (dm[3].length === 2 ? "20" + dm[3] : dm[3]) : TODAY.getFullYear();
        due = `${y}-${dm[2].padStart(2, "0")}-${dm[1].padStart(2, "0")}`;
        text = text.slice(0, dm.index).trim();
      } else if (/\s+(amanha|amanhã|hoje)$/i.test(text)) {
        const d = new Date(TODAY); if (/amanh/i.test(text)) d.setDate(d.getDate() + 1);
        due = d.toISOString().slice(0, 10); text = text.replace(/\s+(amanha|amanhã|hoje)$/i, "");
      }
      state.tasks.unshift({ id: uid(), text, due, done: false });
      render();
      return say(`Tarefa criada: <b>${esc(text)}</b>${due ? ` · prazo ${fmtDate(due)}` : ""}.`);
    }
    if ((m = n.match(/^(concluir|finalizar|feito|marcar)\s+(?:a\s+)?tarefa\s+#?(\d+)/))) {
      const t = state.tasks[+m[2] - 1];
      if (!t) return say(`Não existe tarefa #${m[2]}.`, "bot", "err");
      t.done = true; render();
      return say(`Tarefa concluída: <b>${esc(t.text)}</b>.`);
    }

    // Exportar
    if ((m = n.match(/^(exportar|baixar|salvar)\s*(?:como|em)?\s*(csv|excel|xlsx)?/))) {
      return exportSheet(sh, m[2] === "csv" ? "csv" : "xlsx");
    }

    // Resumo
    if (/^(resumo|resumir|analisar|analise|como (estao|esta))/.test(n)) {
      const rows = filteredRows(sh);
      const nc = numericCols(sh), tc = textCols(sh);
      const lines = nc.map(c => `<li>${code(sh.columns[c])}: ${isAvgCol(sh, c) ? "" : `total ${fmtCol(sh, c, colTotal(sh, c, rows))}, `}média ${fmtCol(sh, c, colSummary(sh, c, rows) / (isAvgCol(sh, c) ? 1 : rows.length || 1))}</li>`);
      const catCols = sh.types ? sh.types.map((t, i) => t === "categoria" && i !== sh.periodCol ? i : -1).filter(i => i >= 0) : [];
      catCols.slice(0, 2).forEach(g => {
        const cnt = [...aggregate(sh, g, -1, rows)].sort((a, b) => b[1] - a[1]);
        lines.push(`<li>Mais registros por ${esc(sh.columns[g].toLowerCase())}: ${cnt.slice(0, 3).map(([k, v]) => `<b>${esc(k)}</b> (${v})`).join(", ")}</li>`);
      });
      const groupCol = catCols[0] ?? tc[1];
      if (groupCol != null && nc.length) {
        const c = nc.find(x => !isAvgCol(sh, x)) ?? nc[0];
        const agg = [...aggregate(sh, groupCol, c, rows)].sort((a, b) => b[1] - a[1]);
        lines.push(`<li>Maior ${esc(sh.columns[c].toLowerCase())} por ${esc(sh.columns[groupCol].toLowerCase())}: <b>${esc(agg[0][0])}</b> (${fmtCol(sh, c, agg[0][1])})</li>`);
      }
      return say(`<b>${esc(sh.name)}</b>: ${rows.length} linhas, ${sh.columns.length} colunas.<ul>${lines.join("")}</ul>`);
    }

    if (!nested && await askAI(raw)) return;
    say(`Não entendi “${esc(raw)}”. Tente ${code("ajuda")} ou um destes: ${code("resumo")}, ${code("criar gráfico de receita por mês")}, ${code("nova tarefa ...")}.${!nested && !aiOn() ? ` <small>(Para pedidos livres, ligue uma IA em ⚙️ Configurações, ou use o ${code("menu")} de pedidos.)</small>` : ""}`, "bot", "err");
  }

  /* =====================================================================

  const sampleReady = window.claude?.use ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
  let aiOff = "", aiTurns = [], aiCtl = null;

  /* ---------- Configurações: internet e IA ----------
     Ficam só neste aparelho (localStorage), nunca na nuvem nem no backup: as chaves de API são segredos. */
  const CFG_KEY = "assistente-config";
  const AI_PROVIDERS = {

    const pill = $("#netPill"); if (pill) { pill.textContent = (cfg.online ? "🌐 " : "📴 ") + lbl; pill.title = "Internet e inteligência artificial"; }

  // Chamada a uma API de IA com mensagens de erro em português.
  async function aiFetch(url, init, signal) {
    let res;
    try { res = await fetch(url, { ...init, signal }); }
    catch (e) { if (e?.name === "AbortError") throw { code: "cancelled" }; throw { code: "network" }; }
    let data = null; try { data = await res.json(); } catch {}
    const detail = String(data?.error?.message || data?.[0]?.error?.message || "").slice(0, 200);
    // O Google responde 400 para chave inválida: tratar como problema de chave, não de pedido.
    if (!res.ok && res.status === 400 && /api.?key|API_KEY/i.test(detail + JSON.stringify(data?.error?.details || ""))) throw { code: "auth", status: res.status, detail };
    if (!res.ok) throw { code: res.status === 401 || res.status === 403 ? "auth" : res.status === 429 ? "rate_limited" : res.status === 404 ? "model" : res.status === 400 ? "bad_request" : "server", status: res.status, detail };
    return data;
  }
  // Executa uma ferramenta pedida pela IA e devolve texto (JSON) para ela.
  async function runAiTool(tools, name, input) {
    const t = tools.find(x => x.name === name);
    if (!t) return { text: `Ferramenta “${name}” não existe.`, error: true };
    try { const r = await t.execute(input || {}); return { text: typeof r === "string" ? r : JSON.stringify(r) }; }
    catch (e) { return { text: `Erro: ${e?.message || e}`, error: true }; }
  }
  const textOfTurns = m => typeof m.content === "string" ? m.content : "";
  // Laço de ferramentas de cada provedor: a IA pede consultas/ações, o assistente executa e devolve, até a resposta final.
  const AI_CHAT = {
    async claude(system, msgs, tools, signal) {
      const model = cfg.models.claude || AI_PROVIDERS.claude.model;
      const headers = { "content-type": "application/json", "x-api-key": cfg.keys.claude, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
      // Nos modelos mais novos, se o pedido for recusado por um filtro de segurança, a própria API tenta outro modelo.
      const fallback = /^claude-(opus-5|fable-5|sonnet-5-5)/.test(model);
      if (fallback) headers["anthropic-beta"] = "server-side-fallback-2026-07-01";
      const defs = tools.map(t => ({ name: t.name, description: t.description, input_schema: t.inputSchema || { type: "object", properties: {} } }));
      const messages = msgs.map(m => ({ role: m.role, content: textOfTurns(m) }));
      for (let round = 0; round < 10; round++) {
        const r = await aiFetch("https://api.anthropic.com/v1/messages", { method: "POST", headers, body: JSON.stringify({ model, max_tokens: 16000, system, ...(defs.length ? { tools: defs } : {}), messages, ...(fallback ? { fallbacks: "default" } : {}) }) }, signal);
        if (r.stop_reason === "refusal") throw { code: "refused" };
        messages.push({ role: "assistant", content: r.content }); // devolve o conteúdo inteiro, sem alterar (inclui blocos de raciocínio)
        const uses = (r.content || []).filter(b => b.type === "tool_use");
        if (r.stop_reason !== "tool_use" || !uses.length) return { text: (r.content || []).filter(b => b.type === "text").map(b => b.text).join("\n"), truncated: r.stop_reason === "max_tokens" };
        const results = [];
        for (const u of uses) { const o = await runAiTool(tools, u.name, u.input); results.push({ type: "tool_result", tool_use_id: u.id, content: o.text, ...(o.error ? { is_error: true } : {}) }); }
        messages.push({ role: "user", content: results });
      }
      return { text: "Parei: o pedido precisou de passos demais. Tente algo mais específico.", truncated: true };
    },
    async openai(system, msgs, tools, signal) {
      const model = cfg.models.openai;
      if (!model) throw { code: "model" };
      const headers = { "content-type": "application/json", authorization: `Bearer ${cfg.keys.openai}` };
      const defs = tools.map(t => ({ type: "function", function: { name: t.name, description: t.description, parameters: t.inputSchema || { type: "object", properties: {} } } }));
      const messages = [{ role: "system", content: system }, ...msgs.map(m => ({ role: m.role, content: textOfTurns(m) }))];
      for (let round = 0; round < 10; round++) {
        const r = await aiFetch("https://api.openai.com/v1/chat/completions", { method: "POST", headers, body: JSON.stringify({ model, messages, ...(defs.length ? { tools: defs } : {}) }) }, signal);
        const ch = r.choices?.[0] || {}, msg = ch.message || { role: "assistant", content: "" };
        messages.push(msg);
        if (!msg.tool_calls?.length) { if (msg.refusal) throw { code: "refused" }; return { text: msg.content || "", truncated: ch.finish_reason === "length" }; }
        for (const tc of msg.tool_calls) {
          let args = {}; try { args = JSON.parse(tc.function?.arguments || "{}"); } catch {}
          const o = await runAiTool(tools, tc.function?.name, args);
          messages.push({ role: "tool", tool_call_id: tc.id, content: o.text });
        }
      }
      return { text: "Parei: o pedido precisou de passos demais. Tente algo mais específico.", truncated: true };
    },
    async gemini(system, msgs, tools, signal) {
      const model = cfg.models.gemini;
      if (!model) throw { code: "model" };
      // O Gemini usa os tipos em maiúsculas (OBJECT, STRING...) nas declarações de função.
      const up = s => !s || typeof s !== "object" ? s : Array.isArray(s) ? s.map(up) : Object.fromEntries(Object.entries(s).map(([k, v]) => [k, k === "type" && typeof v === "string" ? v.toUpperCase() : k === "properties" ? Object.fromEntries(Object.entries(v).map(([pk, pv]) => [pk, up(pv)])) : up(v)]));
      const decls = tools.map(t => ({ name: t.name, description: t.description, parameters: up(t.inputSchema || { type: "object", properties: {} }) }));
      const contents = msgs.map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: textOfTurns(m) }] }));
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(cfg.keys.gemini)}`;
      for (let round = 0; round < 10; round++) {
        const r = await aiFetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ systemInstruction: { parts: [{ text: system }] }, contents, ...(decls.length ? { tools: [{ functionDeclarations: decls }] } : {}) }) }, signal);
        const cand = r.candidates?.[0];
        if (!cand?.content) { if (r.promptFeedback?.blockReason || cand?.finishReason === "SAFETY") throw { code: "refused" }; return { text: "", truncated: false }; }
        contents.push(cand.content); // devolve a resposta sem alterar (mantém as assinaturas de raciocínio)
        const calls = (cand.content.parts || []).filter(x => x.functionCall);
        if (!calls.length) return { text: (cand.content.parts || []).filter(x => x.text && !x.thought).map(x => x.text).join(""), truncated: cand.finishReason === "MAX_TOKENS" };
        const parts = [];
        for (const c of calls) { const o = await runAiTool(tools, c.functionCall.name, c.functionCall.args); parts.push({ functionResponse: { name: c.functionCall.name, response: o.error ? { error: o.text } : { result: o.text } } }); }
        contents.push({ role: "user", parts });
      }
      return { text: "Parei: o pedido precisou de passos demais. Tente algo mais específico.", truncated: true };
    },
  };
  // Lista os modelos que a chave pode usar, para escolher na tela de configurações.
  async function listAiModels(id, key) {
    if (id === "claude") { const r = await aiFetch("https://api.anthropic.com/v1/models?limit=100", { headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" } }); return (r.data || []).map(m => m.id); }
    if (id === "openai") { const r = await aiFetch("https://api.openai.com/v1/models", { headers: { authorization: `Bearer ${key}` } }); return (r.data || []).map(m => m.id).filter(x => /^(gpt|o\d|chatgpt)/.test(x) && !/audio|realtime|tts|transcri|image|search|embed|instruct|moderation/.test(x)).sort().reverse(); }
    const r = await aiFetch(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(key)}`, {});
    return (r.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => m.name.replace(/^models\//, "")).filter(x => /^gemini/.test(x)).sort().reverse();
  }
  const pickModel = (id, list) => id === "claude" ? (list.includes("claude-opus-5-5") ? "claude-opus-5-5" : list[0]) : id === "openai" ? (list.find(x => /^gpt-\d/.test(x) && !/-\d{4}-\d\d-\d\d$/.test(x)) || list[0]) : (list.find(x => /flash/.test(x) && !/lite|preview|exp|tts|image/.test(x)) || list[0]);
  function aiErrorText(e, provider) {
    const who = provider ? AI_PROVIDERS[provider].short : "a IA";
    return {
      auth: `${who} recusou a chave (erro ${e.status}${e.detail ? `: ${esc(e.detail)}` : ""}). Confira se copiou a chave inteira, sem espaços.${provider === "gemini" ? " Se acabou de criar, espere 1 ou 2 minutos e tente de novo." : ""}`,
      rate_limited: `${who} pediu para esperar: limite de uso ou créditos esgotados. Confira os créditos da sua conta e tente de novo em alguns minutos.`,
      model: `O modelo escolhido não existe ou não está liberado para essa chave. Em ⚙️ Configurações, toque em <b>Buscar modelos</b> e escolha outro.`,
      bad_request: `${who} não aceitou o pedido (erro 400)${e.detail ? `: ${esc(e.detail)}` : ""}. Tente outro modelo em ⚙️ Configurações.`,
      network: `Não consegui falar com ${who}. Confira a internet. ${window.claude?.use ? "Aqui no link do Claude, sites externos são bloqueados: abra o assistente pelo link do GitHub ou pela versão offline." : "Se estiver numa rede de empresa (ou Wi-Fi com bloqueio), ela pode impedir esse acesso; teste no 4G."}`,
      server: `${who} está com instabilidade agora (erro ${e.status}). Tente de novo em alguns minutos.`,
      refused: "Não consegui responder esse pedido. Tente escrever de outro jeito.",
    }[e?.code];
  }

  // ---------- Tela de configurações ----------
  let cfgDraft = null, cfgModels = {};
  function openCfg() {
    cfgDraft = JSON.parse(JSON.stringify(cfg));

    const d = $("#cfgDlg"); try { d.showModal(); } catch { d.setAttribute("open", ""); }
  }
  function renderCfg(status = "", ok = true) {
    const d = cfgDraft, p = AI_PROVIDERS[d.ai], inC = !!window.claude?.use;
    const models = [...new Set([...(cfgModels[d.ai] || []), d.models[d.ai] || (p && p.model) || ""].filter(Boolean))];
    $("#cfgBody").innerHTML = `
      <div class="bfield"><label>Internet</label>
        <div class="cfg-net" role="group" aria-label="Internet">
          <button type="button" data-net="on" aria-pressed="${d.online}"><b>🌐 Online</b><span>Busca dados de APIs e usa a IA escolhida para pedidos livres.</span></button>
          <button type="button" data-net="off" aria-pressed="${!d.online}"><b>📴 Offline</b><span>Nada sai deste aparelho. APIs e IA ficam desligadas; use o menu de pedidos.</span></button>

  /* ---------- Leitura ---------- */
  function splitLine(line, d) {
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (ch === '"') q = false; else cur += ch; }
      else if (ch === '"' && !cur.trim()) q = true;
      else if (line.startsWith(d, i)) { out.push(cur); cur = ""; i += d.length - 1; }
      else cur += ch;
    }
    out.push(cur);
    return out;
  }
  function textToMatrix(text) {
    const lines = text.replace(/\r\n?/g, "\n").split("\n");
    const filled = lines.filter(l => l.trim()).slice(0, 300); // amostra basta para achar o separador
    if (!filled.length) return [];
    // Escolhe o separador que aparece de forma mais consistente entre as linhas.
    let best = null, bestScore = 0;
    for (const d of ["\t", ";", "|", ",", " - "]) {
      const counts = filled.map(l => splitLine(l, d).length - 1);
      const freq = {}; counts.forEach(c => freq[c] = (freq[c] || 0) + 1);
      const [mode, hits] = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
      if (+mode === 0) continue;
      const score = hits / filled.length * (d === "," ? .9 : 1) + Math.min(+mode, 10) * .01;
      if (hits / filled.length >= .6 && score > bestScore) { best = d; bestScore = score; }
    }
    if (!best && filled.some(l => /\S\s{2,}\S/.test(l))) return lines.map(l => l.trim().split(/\s{2,}/));
    return lines.map(l => best ? splitLine(l, best) : [l]);
