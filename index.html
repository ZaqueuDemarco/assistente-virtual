<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistente de Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --surface: #161b22;
    --raised: #1d242e;
    --hover: #242c38;
    --border: #2b3441;
    --border-strong: #3a4556;
    --text: #e6eaf0;
    --text-2: #aab4c3;
    --muted: #7d8898;
    --accent: #5b9dff;
    --accent-soft: rgba(91, 157, 255, .14);
    --good: #3fb97a;
    --warn: #e0a449;
    --bad: #e5534b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    --grid: #262e3a;
    --radius: 8px;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 224px minmax(0, 1fr) 380px;
    height: 100%;
  }
  .side {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 20px;
    padding: 18px 14px;
    overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
  .brand-mark {
    width: 30px; height: 30px; border-radius: 7px;
    background: var(--accent-soft); border: 1px solid rgba(91,157,255,.35);
    display: grid; place-items: center; color: var(--accent);
    font: 600 13px var(--mono);
  }
  .brand b { display: block; font-size: 14px; }
  .brand small { color: var(--muted); font-size: 12px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav-label {
    color: var(--muted); font-size: 11px; text-transform: uppercase;
    letter-spacing: .08em; padding: 0 8px 6px;
  }
  .nav button {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; border-radius: 6px;
    padding: 8px 10px; text-align: left; cursor: pointer; color: var(--text-2);
  }
  .nav button:hover { background: var(--hover); color: var(--text); }
  .nav button[aria-current="true"] { background: var(--accent-soft); color: var(--text); }
  .nav button[aria-current="true"] svg { color: var(--accent); }
  .nav svg { width: 16px; height: 16px; flex: none; }
  .nav .count { margin-left: auto; color: var(--muted); font: 12px var(--mono); }
  .side-foot { margin-top: auto; color: var(--muted); font-size: 12px; padding: 0 8px; }
  kbd {
    font: 11px var(--mono); padding: 1px 5px; border-radius: 4px;
    border: 1px solid var(--border-strong); background: var(--raised); color: var(--text-2);
  }

  .main { overflow-y: auto; min-width: 0; }
  .main-inner { padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 1180px; }
  .topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .topbar h1 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
  .topbar p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    background: var(--raised); border: 1px solid var(--border-strong); color: var(--text);
    font-size: 13px; white-space: nowrap;
  }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #07111f; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.ghost { background: none; border-color: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--hover); color: var(--text); }
  .btn svg { width: 14px; height: 14px; }
  select.ctl, input.ctl {
    background: var(--raised); border: 1px solid var(--border-strong); border-radius: 6px;
    padding: 6px 10px; font-size: 13px; min-width: 0;
  }
  .tag {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: rgba(224,164,73,.14); color: var(--warn); border: 1px solid rgba(224,164,73,.3);
    letter-spacing: .02em;
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
  .panel-head .sub { color: var(--muted); font-size: 12px; }

  /* ---------- KPIs ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .kpi .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .kpi .val { font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
  .kpi .delta { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .delta .up { color: var(--good); }
  .delta .down { color: var(--bad); }
  .kpi .spark { margin-top: 6px; height: 32px; position: relative; }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters label { color: var(--muted); font-size: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
    border-radius: 999px; border: 1px solid var(--border-strong); background: var(--raised);
    font-size: 12px; cursor: pointer; color: var(--text-2);
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }

  /* ---------- Charts ---------- */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; }
  .chart-card .body { padding: 12px 14px 14px; height: 280px; position: relative; }
  .row.nowrap { flex-wrap: nowrap; }
  .chart-card .panel-head { flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: var(--raised); border: 0; padding: 4px 8px; cursor: pointer;
    color: var(--muted); font-size: 12px;
  }
  .seg button + button { border-left: 1px solid var(--border-strong); }
  .seg button[aria-pressed="true"] { color: var(--text); background: var(--hover); }
  .icon-btn {
    background: none; border: 0; color: var(--muted); cursor: pointer; padding: 4px;
    border-radius: 5px; display: inline-grid; place-items: center;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .icon-btn svg { width: 15px; height: 15px; }
  .empty { padding: 28px 16px; color: var(--muted); text-align: center; font-size: 13px; }
  .empty code { font-family: var(--mono); color: var(--accent); }

  /* ---------- Spreadsheet ---------- */
  .sheet-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  .sheet-tabs button {
    background: none; border: 1px solid transparent; border-radius: 6px; padding: 5px 10px;
    cursor: pointer; color: var(--text-2); font-size: 13px;
  }
  .sheet-tabs button:hover { background: var(--hover); }
  .sheet-tabs button[aria-current="true"] { border-color: var(--border-strong); background: var(--raised); color: var(--text); }
  .formula-bar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 13px;
  }
  .formula-bar .ref { color: var(--accent); min-width: 42px; }
  .formula-bar input { flex: 1; background: none; border: 0; color: var(--text); font-family: var(--mono); min-width: 0; }
  .grid-wrap { overflow: auto; max-height: calc(100vh - 290px); min-height: 260px; }
  table.grid { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; font-variant-numeric: tabular-nums; }
  .grid th, .grid td { border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); }
  .grid thead th {
    position: sticky; top: 0; z-index: 2; background: var(--raised);
    font-weight: 500; text-align: left; padding: 0; font-size: 12px;
  }
  .grid thead .col-letter { display: block; color: var(--muted); font: 11px var(--mono); padding: 4px 10px 0; }
  .grid thead input {
    display: block; width: 100%; background: none; border: 0; padding: 0 10px 6px;
    font-weight: 600; color: var(--text); font-size: 13px;
  }
  .grid .rownum {
    position: sticky; left: 0; z-index: 1; background: var(--raised); color: var(--muted);
    font: 11px var(--mono); text-align: center; width: 40px; min-width: 40px;
  }
  .grid thead .rownum { z-index: 3; }
  .grid td { padding: 0; min-width: 120px; background: var(--surface); }
  .grid td input {
    width: 100%; background: none; border: 0; padding: 6px 10px; font-size: 13px;
    color: var(--text); font-variant-numeric: tabular-nums;
  }
  .grid td.num input { text-align: right; }
  .grid td.formula input { color: #9cc3ff; }
  .grid td.err input { color: var(--bad); }
  .grid td:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
  .grid tfoot td {
    background: var(--raised); font-size: 12px; color: var(--text-2); padding: 6px 10px; text-align: right;
    position: sticky; bottom: 0;
  }
  .grid tfoot td.rownum { text-align: center; }
  .grid tr.hl td { background: rgba(91,157,255,.08); }

  /* ---------- Tasks ---------- */
  .tasks { list-style: none; margin: 0; padding: 0; }
  .tasks li {
    display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px; align-items: center;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  .tasks li:last-child { border-bottom: 0; }
  .tasks li.done .t { color: var(--muted); text-decoration: line-through; }
  .tasks input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
  .tasks .n { color: var(--muted); font: 12px var(--mono); margin-right: 6px; }
  .due { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--text-2); white-space: nowrap; }
  .due.late { color: var(--bad); border-color: rgba(229,83,75,.4); background: rgba(229,83,75,.1); }
  .due.soon { color: var(--warn); border-color: rgba(224,164,73,.4); background: rgba(224,164,73,.1); }

  /* ---------- Assistant ---------- */
  .assist {
    background: var(--surface); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; height: 100%;
  }
  .assist-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px rgba(63,185,122,.18); }
  .assist-head b { font-size: 14px; }
  .assist-head small { color: var(--muted); display: block; font-size: 12px; }
  .assist-head .icon-btn { margin-left: auto; }
  .log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 10px; font-size: 13px; line-height: 1.5; }
  .msg.user {
    align-self: flex-end; background: var(--accent-soft); border: 1px solid rgba(91,157,255,.3);
    font-family: var(--mono); font-size: 12.5px;
  }
  .msg.bot { align-self: flex-start; background: var(--raised); border: 1px solid var(--border); }
  .msg.bot.err { border-color: rgba(229,83,75,.45); }
  .msg code { font-family: var(--mono); font-size: 12px; color: #9cc3ff; background: rgba(91,157,255,.1); padding: 1px 4px; border-radius: 4px; }
  .msg ul { margin: 6px 0 0; padding-left: 18px; }
  .msg li { margin: 2px 0; }
  .msg .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .suggest { padding: 0 16px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .suggest button {
    background: var(--raised); border: 1px solid var(--border-strong); border-radius: 999px;
    padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--text-2); font-family: var(--mono);
  }
  .suggest button:hover { color: var(--text); border-color: var(--accent); }
  .cmd {
    border-top: 1px solid var(--border); padding: 12px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    position: relative;
  }
  .cmd form {
    display: flex; align-items: center; gap: 8px; background: var(--bg);
    border: 1px solid var(--border-strong); border-radius: 8px; padding: 4px 4px 4px 12px;
  }
  .cmd form:focus-within { border-color: var(--accent); }
  .cmd .prompt { color: var(--accent); font-family: var(--mono); }
  .cmd input { flex: 1; background: none; border: 0; padding: 7px 0; font-family: var(--mono); font-size: 13px; min-width: 0; }
  .cmd input:focus { outline: none; }
  .ac {
    position: absolute; left: 16px; right: 16px; bottom: calc(100% - 6px);
    background: var(--raised); border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 4px; max-height: 260px; overflow-y: auto; box-shadow: 0 12px 30px rgba(0,0,0,.45);
  }
  .ac button {
    display: flex; width: 100%; gap: 10px; justify-content: space-between; text-align: left;
    background: none; border: 0; padding: 7px 10px; border-radius: 5px; cursor: pointer;
  }
  .ac button span:first-child { font-family: var(--mono); font-size: 12.5px; }
  .ac button span:last-child { color: var(--muted); font-size: 12px; }
  .ac button[aria-selected="true"], .ac button:hover { background: var(--hover); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 6px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: var(--raised); border: 1px solid var(--border-strong); padding: 8px 14px; border-radius: 8px;
    font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.5); z-index: 50;
  }
  .assist-toggle { display: none; }
  .mobile-nav { display: none; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1180px) {
    .app { grid-template-columns: 200px minmax(0, 1fr); }
    .assist {
      position: fixed; right: 0; top: 0; bottom: 0; width: min(400px, 100%); z-index: 40;
      transform: translateX(100%); transition: transform .2s ease; box-shadow: -20px 0 40px rgba(0,0,0,.4);
      padding-top: env(safe-area-inset-top, 0px);
    }
    .assist.open { transform: none; }
    .assist-toggle {
      display: inline-flex; position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 30;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; }
    .side { display: none; }
    .mobile-nav {
      display: flex; gap: 4px; padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface); overflow-x: auto;
    }
    .mobile-nav button {
      background: none; border: 1px solid transparent; border-radius: 6px; padding: 6px 10px;
      color: var(--text-2); cursor: pointer; white-space: nowrap;
    }
    .mobile-nav button[aria-current="true"] { background: var(--accent-soft); color: var(--text); }
    .main-inner { padding: 16px 16px 90px; }
    .charts { grid-template-columns: minmax(0, 1fr); }
    .chart-card .body { height: 240px; }
    .grid-wrap { max-height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <nav class="mobile-nav" id="mobileNav" aria-label="Seções"></nav>

  <aside class="side" aria-label="Navegação">
    <div class="brand">
      <div class="brand-mark">AG</div>
      <div><b>Assistente de Gestão</b><small>Protótipo</small></div>
    </div>
    <div class="nav" id="nav">
      <div class="nav-label">Áreas</div>
    </div>
    <div class="nav" id="sheetNav">
      <div class="nav-label">Planilhas</div>
    </div>
    <div class="side-foot">Digite <kbd>/</kbd> para comandos ou <kbd>Ctrl</kbd> + <kbd>K</kbd> para focar o assistente.</div>
  </aside>

  <main class="main" id="main"><div class="main-inner" id="view"></div></main>

  <section class="assist" id="assist" aria-label="Assistente">
    <div class="assist-head">
      <span class="dot" aria-hidden="true"></span>
      <div><b>Assistente</b><small>Aceita comandos em português</small></div>
      <button class="icon-btn" id="closeAssist" title="Fechar assistente" aria-label="Fechar assistente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="suggest" id="suggest"></div>
    <div class="cmd">
      <div class="ac" id="ac" role="listbox" hidden></div>
      <form id="cmdForm" autocomplete="off">
        <span class="prompt" aria-hidden="true">›</span>
        <input id="cmdInput" placeholder="Ex.: criar gráfico de receita por mês" aria-label="Comando para o assistente">
        <button class="btn primary" type="submit">Enviar</button>
      </form>
      <div class="hint"><kbd>↑</kbd> repete o último comando · <kbd>Tab</kbd> completa</div>
    </div>
  </section>

  <button class="btn primary assist-toggle" id="openAssist">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H8l-4 4z"/></svg>
    Assistente
  </button>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(() => {
  "use strict";

  /* =====================================================================
     Utilidades
     ===================================================================== */
  const $ = (s, el = document) => el.querySelector(s);
  const uid = () => Math.random().toString(36).slice(2, 9);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
  const colLetter = i => { let s = ""; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; };
  const colIndex = l => { let n = 0; for (const ch of l.toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64); return n - 1; };
  const nfNum = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 });
  const nfBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  const nfBRL2 = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
  const nfCompact = new Intl.NumberFormat("pt-BR", { notation: "compact", maximumFractionDigits: 1 });

  function parseNum(v) {
    if (typeof v === "number") return v;
    let s = String(v ?? "").replace(/R\$|\s|%/g, "");
    if (!s || !/^-?[\d.,]+$/.test(s)) return NaN;
    if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
    else if (s.includes(",")) s = s.replace(",", ".");
    else if (/^\-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
    return Number(s);
  }
  const isMoneyCol = name => /receita|custo|valor|preco|total|lucro|despesa|faturamento|salario|r\$/.test(norm(name));

  /* =====================================================================
     Estado (dados de exemplo) + persistência local
     ===================================================================== */
  const MESES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set"];
  function sampleSales() {
    const base = { "Serviços": [42, 3.4], "Produtos": [31, 1.2], "Assinaturas": [18, 2.1] };
    const custoPct = { "Serviços": .58, "Produtos": .71, "Assinaturas": .34 };
    const rows = [];
    MESES.forEach((m, i) => {
      for (const [cat, [b, g]] of Object.entries(base)) {
        const wobble = [1, .96, 1.04, .99, 1.07, 1.02, .94, 1.08, 1.05][i];
        const rec = Math.round((b + g * i) * 1000 * wobble / 10) * 10;
        const custo = Math.round(rec * custoPct[cat] * (cat === "Produtos" && i > 5 ? .93 : 1) / 10) * 10;
        const r = rows.length + 2;
        rows.push([m, cat, String(rec), String(custo), `=C${r}-D${r}`]);
      }
    });
    return rows;
  }
  function defaultState() {
    const vendasId = uid(), estoqueId = uid();
    return {
      view: "painel",
      activeSheet: vendasId,
      filter: { col: 1, val: "" },
      sheets: [
        { id: vendasId, name: "Vendas 2026", columns: ["Mês", "Categoria", "Receita", "Custo", "Lucro"], rows: sampleSales() },
        { id: estoqueId, name: "Estoque", columns: ["Item", "Fornecedor", "Quantidade", "Preço unitário", "Total"], rows: [
          ["Papel A4 (cx)", "Distrib. Sul", "38", "189.90", "=C2*D2"],
          ["Toner HP 85A", "InfoParts", "12", "329.00", "=C3*D3"],
          ["Cadeira ergonômica", "Móveis Lima", "6", "1240.00", "=C4*D4"],
          ["Monitor 24\"", "InfoParts", "9", "899.00", "=C5*D5"],
          ["Café em grãos (kg)", "Torra Viva", "24", "72.50", "=C6*D6"],
          ["Headset USB", "InfoParts", "15", "214.00", "=C7*D7"],
        ] },
      ],
      charts: [
        { id: uid(), sheetId: vendasId, type: "line", label: 0, values: [2, 3], title: "Receita e custo por mês" },
        { id: uid(), sheetId: vendasId, type: "doughnut", label: 1, values: [4], title: "Lucro por categoria" },
        { id: uid(), sheetId: vendasId, type: "bar", label: 0, values: [4], title: "Lucro por mês" },
        { id: uid(), sheetId: estoqueId, type: "bar", label: 0, values: [4], title: "Valor em estoque por item" },
      ],
      tasks: [
        { id: uid(), text: "Fechar relatório de setembro", due: "2026-09-30", done: false },
        { id: uid(), text: "Renegociar contrato com InfoParts", due: "2026-09-24", done: false },
        { id: uid(), text: "Revisar metas do 4º trimestre", due: "2026-10-10", done: false },
        { id: uid(), text: "Enviar planilha de estoque ao financeiro", due: "2026-09-20", done: true },
      ],
      history: [],
    };
  }
  const KEY = "assistente-gestao-v1";
  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)) || defaultState(); } catch { state = defaultState(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

  const sheet = () => state.sheets.find(s => s.id === state.activeSheet) || state.sheets[0];

  /* =====================================================================
     Motor de fórmulas: =C2-D2, =SOMA(C2:C10), =MEDIA(), =MAX(), =MIN(), =CONT()
     ===================================================================== */
  function cellValue(sh, r, c, seen = new Set()) {
    const raw = sh.rows[r]?.[c] ?? "";
    if (typeof raw === "string" && raw.startsWith("=")) {
      const key = r + ":" + c;
      if (seen.has(key)) return { v: NaN, err: "#CICLO" };
      seen.add(key);
      try {
        const v = evalFormula(sh, raw.slice(1), seen);
        seen.delete(key);
        return Number.isFinite(v) ? { v } : { v: NaN, err: "#ERRO" };
      } catch { seen.delete(key); return { v: NaN, err: "#ERRO" }; }
    }
    const n = parseNum(raw);
    return { v: Number.isNaN(n) ? raw : n };
  }
  function evalFormula(sh, expr, seen) {
    const num = (r, c) => { const x = cellValue(sh, r, c, seen); if (x.err) throw 0; return typeof x.v === "number" ? x.v : 0; };
    const range = (a, b) => {
      const [, c1, r1] = a.match(/([A-Z]+)(\d+)/), [, c2, r2] = b.match(/([A-Z]+)(\d+)/);
      const out = [];
      for (let r = Math.min(+r1, +r2); r <= Math.max(+r1, +r2); r++)
        for (let c = Math.min(colIndex(c1), colIndex(c2)); c <= Math.max(colIndex(c1), colIndex(c2)); c++) out.push(num(r - 2, c));
      return out;
    };
    const F = {
      SOMA: (...a) => a.flat().reduce((s, x) => s + x, 0),
      MEDIA: (...a) => { const f = a.flat(); return f.length ? f.reduce((s, x) => s + x, 0) / f.length : 0; },
      MAX: (...a) => Math.max(...a.flat()),
      MIN: (...a) => Math.min(...a.flat()),
      CONT: (...a) => a.flat().length,
    };
    const fnAlias = { SUM: "SOMA", AVERAGE: "MEDIA", MÉDIA: "MEDIA", COUNT: "CONT" };
    let js = expr.toUpperCase().replace(/(\d),(\d)/g, "$1.$2").replace(/;/g, ",");
    js = js.replace(/\b([A-ZÉ]+)\s*\(/g, (m, f) => { const n = fnAlias[f] || f; if (!F[n]) throw 0; return `F.${n}(`; });
    js = js.replace(/\b([A-Z]+\d+):([A-Z]+\d+)\b/g, (m, a, b) => `R("${a}","${b}")`);
    js = js.replace(/(?<![".A-Z])\b([A-Z]{1,2})(\d+)\b/g, (m, c, r) => `N(${+r - 2},${colIndex(c)})`);
    const check = js.replace(/F\.[A-Z]+|R\("[A-Z]+\d+","[A-Z]+\d+"\)|N\(-?\d+,\d+\)/g, "");
    if (!/^[\d\s+\-*/().,]*$/.test(check)) throw 0;
    return Function("F", "R", "N", `"use strict";return (${js});`)(F, range, num);
  }
  function display(sh, r, c) {
    const x = cellValue(sh, r, c);
    if (x.err) return x.err;
    if (typeof x.v === "number") return isMoneyCol(sh.columns[c]) ? nfBRL2.format(x.v) : nfNum.format(x.v);
    return x.v;
  }
  const numericCols = sh => sh.columns.map((_, c) => c).filter(c => {
    const vals = sh.rows.map((_, r) => cellValue(sh, r, c).v).filter(v => v !== "");
    return vals.length && vals.filter(v => typeof v === "number").length / vals.length >= .8;
  });
  const textCols = sh => { const n = numericCols(sh); return sh.columns.map((_, c) => c).filter(c => !n.includes(c)); };
  const colTotal = (sh, c, rows) => rows.reduce((s, r) => { const v = cellValue(sh, r, c).v; return s + (typeof v === "number" ? v : 0); }, 0);

  function filteredRows(sh) {
    const all = sh.rows.map((_, i) => i);
    const f = state.filter;
    if (sh.id !== state.activeSheet || !f.val || f.col == null) return all;
    return all.filter(r => norm(sh.rows[r][f.col]) === norm(f.val));
  }
  function findCol(sh, name) {
    const n = norm(name).replace(/^(a|o|as|os|de|do|da)\s+/, "");
    if (!n) return -1;
    if (/^[a-z]{1,2}$/.test(n) && colIndex(n) < sh.columns.length && !sh.columns.some(c => norm(c) === n)) return colIndex(n);
    let i = sh.columns.findIndex(c => norm(c) === n);
    if (i < 0) i = sh.columns.findIndex(c => norm(c).startsWith(n) || n.startsWith(norm(c)));
    if (i < 0) i = sh.columns.findIndex(c => norm(c).includes(n));
    return i;
  }
  const findSheet = name => { const n = norm(name); return state.sheets.find(s => norm(s.name) === n) || state.sheets.find(s => norm(s.name).includes(n)); };

  /* =====================================================================
     Renderização
     ===================================================================== */
  const ICONS = {
    painel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>',
    planilhas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M3 15h18M9 4v16"/></svg>',
    tarefas: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3 6l1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg>',
    sheet: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
    dl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
  };
  const VIEWS = [["painel", "Painel"], ["planilhas", "Planilhas"], ["tarefas", "Tarefas"]];

  function renderNav() {
    const pending = state.tasks.filter(t => !t.done).length;
    $("#nav").innerHTML = '<div class="nav-label">Áreas</div>' + VIEWS.map(([k, l]) =>
      `<button data-view="${k}" aria-current="${state.view === k}">${ICONS[k]}${l}${k === "tarefas" ? `<span class="count">${pending}</span>` : ""}</button>`).join("");
    $("#sheetNav").innerHTML = '<div class="nav-label">Planilhas</div>' + state.sheets.map(s =>
      `<button data-sheet="${s.id}" aria-current="${state.view === "planilhas" && s.id === state.activeSheet}">${ICONS.sheet}${esc(s.name)}<span class="count">${s.rows.length}</span></button>`).join("");
    $("#mobileNav").innerHTML = VIEWS.map(([k, l]) => `<button data-view="${k}" aria-current="${state.view === k}">${l}</button>`).join("");
  }

  let charts = [];
  function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }

  function render() {
    destroyCharts();
    renderNav();
    const v = $("#view");
    if (state.view === "painel") v.innerHTML = viewPainel();
    else if (state.view === "planilhas") v.innerHTML = viewPlanilhas();
    else v.innerHTML = viewTarefas();
    if (state.view === "painel") drawPainel();
    save();
  }

  function sheetSelect(id = "sheetPick") {
    return `<select class="ctl" id="${id}" aria-label="Planilha">${state.sheets.map(s => `<option value="${s.id}" ${s.id === state.activeSheet ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>`;
  }

  /* ---------- Painel ---------- */
  function viewPainel() {
    const sh = sheet();
    const tcols = textCols(sh);
    const f = state.filter;
    if (!tcols.includes(f.col)) f.col = tcols[1] ?? tcols[0] ?? null;
    const values = f.col != null ? [...new Set(sh.rows.map(r => r[f.col]).filter(Boolean))] : [];
    if (f.val && !values.includes(f.val)) f.val = "";
    const myCharts = state.charts.filter(c => c.sheetId === sh.id);
    const isSample = sh.name === "Vendas 2026" || sh.name === "Estoque";
    return `
      <div class="topbar">
        <div><h1>Painel · ${esc(sh.name)}</h1><p>${sh.rows.length} linhas · atualizado ao editar a planilha ${isSample ? '· <span class="tag">dados de exemplo</span>' : ""}</p></div>
        <div class="row">${sheetSelect()}<button class="btn" data-run="criar gráfico">${ICONS.plus}Novo gráfico</button></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="filters">
        <label for="filterCol">Filtrar por</label>
        <select class="ctl" id="filterCol">${tcols.map(c => `<option value="${c}" ${c === f.col ? "selected" : ""}>${esc(sh.columns[c])}</option>`).join("")}</select>
        <button class="chip" data-fval="" aria-pressed="${!f.val}">Todos</button>
        ${values.slice(0, 12).map(v => `<button class="chip" data-fval="${esc(v)}" aria-pressed="${f.val === v}">${esc(v)}</button>`).join("")}
      </div>
      <div class="charts">
        ${myCharts.length ? myCharts.map(c => `
          <section class="panel chart-card">
            <div class="panel-head">
              <h2>${esc(c.title)}</h2>
              <div class="row nowrap">
                <div class="seg" role="group" aria-label="Tipo de gráfico">
                  ${[["bar", "Barras"], ["line", "Linhas"], ["doughnut", "Rosca"]].map(([t, l]) =>
                    `<button data-ctype="${t}" data-chart="${c.id}" aria-pressed="${c.type === t}">${l}</button>`).join("")}
                </div>
                <button class="icon-btn" data-delchart="${c.id}" title="Remover gráfico" aria-label="Remover gráfico">${ICONS.x}</button>
              </div>
            </div>
            <div class="body"><canvas id="c_${c.id}" role="img" aria-label="${esc(c.title)}"></canvas></div>
          </section>`).join("") : `<div class="panel empty">Nenhum gráfico para esta planilha. Peça ao assistente: <code>criar gráfico de ${esc(sh.columns[numericCols(sh)[0]] || "valor")} por ${esc(sh.columns[0])}</code></div>`}
      </div>`;
  }

  function aggregate(sh, labelCol, valueCol, rows) {
    const map = new Map();
    rows.forEach(r => {
      const k = sh.rows[r][labelCol] || "(vazio)";
      const v = cellValue(sh, r, valueCol).v;
      map.set(k, (map.get(k) || 0) + (typeof v === "number" ? v : 0));
    });
    return map;
  }

  function drawPainel() {
    const sh = sheet();
    const rows = filteredRows(sh);
    const ncols = numericCols(sh).slice(0, 4);
    const css = getComputedStyle(document.documentElement);
    const tok = n => css.getPropertyValue(n).trim();
    const series = ["--s1", "--s2", "--s3", "--s4", "--s5"].map(tok);
    Chart.defaults.font.family = "IBM Plex Sans, system-ui, sans-serif";
    Chart.defaults.color = tok("--muted");

    // KPIs: total por coluna numérica + variação entre o último e o penúltimo grupo da 1ª coluna de texto
    const tc = textCols(sh)[0];
    const groups = tc != null ? [...new Set(rows.map(r => sh.rows[r][tc]))] : [];
    $("#kpis").innerHTML = ncols.map((c, i) => {
      const total = colTotal(sh, c, rows);
      let delta = "";
      if (groups.length >= 2) {
        const agg = aggregate(sh, tc, c, rows);
        const a = agg.get(groups[groups.length - 2]), b = agg.get(groups[groups.length - 1]);
        if (a) {
          const pct = (b - a) / Math.abs(a) * 100;
          const good = /custo|despesa/.test(norm(sh.columns[c])) ? pct <= 0 : pct >= 0;
          delta = `<div class="delta"><span class="${good ? "up" : "down"}">${pct >= 0 ? "▲" : "▼"} ${nfNum.format(Math.abs(pct))}%</span> ${esc(groups[groups.length - 1])} vs ${esc(groups[groups.length - 2])}</div>`;
        }
      }
      return `<div class="panel kpi"><span class="lbl">${esc(sh.columns[c])}</span><span class="val">${isMoneyCol(sh.columns[c]) ? nfBRL.format(total) : nfNum.format(total)}</span>${delta}<div class="spark"><canvas id="spark_${i}" aria-hidden="true"></canvas></div></div>`;
    }).join("") + `<div class="panel kpi"><span class="lbl">Tarefas pendentes</span><span class="val">${state.tasks.filter(t => !t.done).length}</span><div class="delta">${state.tasks.filter(t => !t.done && dueClass(t.due) === "late").length} atrasada(s)</div></div>`;

    // Sparklines
    if (tc != null) ncols.forEach((c, i) => {
      const agg = aggregate(sh, tc, c, rows);
      const el = $("#spark_" + i);
      if (!el || agg.size < 2) { el && el.parentElement.remove(); return; }
      charts.push(new Chart(el, {
        type: "line",
        data: { labels: [...agg.keys()], datasets: [{ data: [...agg.values()], borderColor: series[0], borderWidth: 2, pointRadius: 0, fill: true, backgroundColor: series[0] + "22", tension: .3 }] },
        options: { responsive: true, maintainAspectRatio: false, animation: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } } },
      }));
    });

    state.charts.filter(c => c.sheetId === sh.id).forEach(c => {
      const el = $("#c_" + c.id); if (!el) return;
      const round = c.type === "doughnut";
      let aggs = c.values.map(v => aggregate(sh, c.label, v, rows));
      if (round && aggs[0].size > 5) {
        // Rosca com muitas fatias vira ilegível: mantém as 4 maiores e agrupa o resto em "Outros".
        const sorted = [...aggs[0]].sort((a, b) => b[1] - a[1]);
        aggs = [new Map([...sorted.slice(0, 4), ["Outros", sorted.slice(4).reduce((s, [, v]) => s + v, 0)]])];
      }
      const labels = [...aggs[0].keys()];
      const money = c.values.every(v => isMoneyCol(sh.columns[v]));
      const fmt = v => money ? nfBRL.format(v) : nfNum.format(v);
      const vals = round ? [aggs[0]] : aggs;
      const datasets = vals.map((a, i) => ({
        label: sh.columns[c.values[i]],
        data: labels.map(l => a.get(l) || 0),
        backgroundColor: round ? labels.map((l, j) => l === "Outros" ? tok("--border-strong") : series[j]) : (c.type === "line" ? series[i] + "1f" : series[i]),
        borderColor: round ? tok("--surface") : series[i],
        borderWidth: 2,
        borderRadius: c.type === "bar" ? 4 : 0,
        pointRadius: c.type === "line" ? 3 : 0,
        pointHoverRadius: 6,
        pointBackgroundColor: series[i],
        fill: c.type === "line" && vals.length === 1,
        tension: .3,
        maxBarThickness: 36,
      }));
      charts.push(new Chart(el, {
        type: c.type,
        data: { labels, datasets },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: round ? "nearest" : "index", intersect: round },
          cutout: round ? "62%" : undefined,
          plugins: {
            legend: { display: round || datasets.length > 1, position: round ? "right" : "top", align: "end", labels: { color: tok("--text-2"), boxWidth: 10, boxHeight: 10, usePointStyle: true, pointStyle: "rectRounded" } },
            tooltip: {
              backgroundColor: tok("--raised"), borderColor: tok("--border-strong"), borderWidth: 1,
              titleColor: tok("--text"), bodyColor: tok("--text-2"), padding: 10, boxPadding: 4,
              callbacks: { label: ctx => ` ${round ? ctx.label : ctx.dataset.label}: ${fmt(ctx.parsed.y ?? ctx.parsed)}` },
            },
          },
          scales: round ? {} : {
            x: { grid: { display: false }, border: { color: tok("--border-strong") }, ticks: { color: tok("--muted") } },
            y: { beginAtZero: true, grid: { color: tok("--grid") }, border: { display: false }, ticks: { color: tok("--muted"), callback: v => money ? "R$ " + nfCompact.format(v) : nfCompact.format(v) } },
          },
        },
      }));
    });
  }

  /* ---------- Planilhas ---------- */
  let selCell = null; // {r, c}
  function viewPlanilhas() {
    const sh = sheet();
    const ncols = numericCols(sh);
    const f = state.filter;
    const matches = new Set(f.val ? filteredRows(sh) : []);
    return `
      <div class="topbar">
        <div><h1>${esc(sh.name)}</h1><p>Edite direto nas células. Fórmulas começam com <code style="font-family:var(--mono)">=</code>, como <code style="font-family:var(--mono)">=SOMA(C2:C10)</code> ou <code style="font-family:var(--mono)">=C2-D2</code>.</p></div>
        <div class="row">
          <button class="btn" data-act="addRow">${ICONS.plus}Linha</button>
          <button class="btn" data-act="addCol">${ICONS.plus}Coluna</button>
          <button class="btn" data-run="exportar csv">${ICONS.dl}CSV</button>
          <button class="btn" data-run="exportar excel">${ICONS.dl}Excel</button>

        </div>
      </div>
      <div class="sheet-tabs">${state.sheets.map(s => `<button data-sheet="${s.id}" aria-current="${s.id === sh.id}">${esc(s.name)}</button>`).join("")}<button data-run="nova planilha">+ Nova</button></div>
      <section class="panel">
        <div class="formula-bar"><span class="ref" id="cellRef">${selCell ? colLetter(selCell.c) + (selCell.r + 2) : "—"}</span><input id="fx" aria-label="Conteúdo da célula" placeholder="Selecione uma célula" value="${selCell ? esc(sh.rows[selCell.r]?.[selCell.c] ?? "") : ""}"></div>
        <div class="grid-wrap">
          <table class="grid">
            <thead><tr><th class="rownum"><span class="col-letter">&nbsp;</span>1</th>${sh.columns.map((c, i) => `<th><span class="col-letter">${colLetter(i)}</span><input data-hcol="${i}" value="${esc(c)}" aria-label="Nome da coluna ${colLetter(i)}"></th>`).join("")}</tr></thead>
            <tbody>${sh.rows.map((row, r) => `<tr class="${matches.has(r) ? "hl" : ""}"><td class="rownum">${r + 2}</td>${sh.columns.map((_, c) => {
              const raw = row[c] ?? "";
              const isF = String(raw).startsWith("=");
              const d = display(sh, r, c);

              return `<td class="${cls}"><input data-r="${r}" data-c="${c}" value="${esc(d)}" aria-label="${colLetter(c)}${r + 2}"></td>`;
            }).join("")}</tr>`).join("")}</tbody>
            <tfoot><tr><td class="rownum">Σ</td>${sh.columns.map((c, i) => `<td>${ncols.includes(i) ? (isMoneyCol(c) ? nfBRL2.format(colTotal(sh, i, sh.rows.map((_, r) => r))) : nfNum.format(colTotal(sh, i, sh.rows.map((_, r) => r)))) : ""}</td>`).join("")}</tr></tfoot>
          </table>
        </div>
      </section>`;
  }

  /* ---------- Tarefas ---------- */
  const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  function dueClass(d) {
    if (!d) return "";
    const diff = (new Date(d + "T00:00") - TODAY) / 864e5;
    return diff < 0 ? "late" : diff <= 3 ? "soon" : "";
  }
  const fmtDate = d => d ? new Date(d + "T00:00").toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(/\.$/, "") : "";
  function viewTarefas() {
    const pend = state.tasks.filter(t => !t.done).length;
    return `
      <div class="topbar">
        <div><h1>Tarefas</h1><p>${pend} pendente(s) de ${state.tasks.length}</p></div>
        <form class="row" id="taskForm">
          <input class="ctl" id="taskText" placeholder="Nova tarefa" aria-label="Nova tarefa" style="width:220px;max-width:100%">
          <input class="ctl" id="taskDue" type="date" aria-label="Prazo">
          <button class="btn primary" type="submit">${ICONS.plus}Adicionar</button>
        </form>
      </div>
      <section class="panel">
        ${state.tasks.length ? `<ul class="tasks">${state.tasks.map((t, i) => `
          <li class="${t.done ? "done" : ""}">
            <input type="checkbox" data-task="${t.id}" ${t.done ? "checked" : ""} aria-label="Concluir: ${esc(t.text)}">
            <span class="t"><span class="n">#${i + 1}</span>${esc(t.text)}</span>
            ${t.due ? `<span class="due ${t.done ? "" : dueClass(t.due)}">${dueClass(t.due) === "late" && !t.done ? "Atrasada · " : ""}${fmtDate(t.due)}</span>` : "<span></span>"}
            <button class="icon-btn" data-deltask="${t.id}" aria-label="Excluir tarefa">${ICONS.x}</button>
          </li>`).join("")}</ul>` : `<div class="empty">Sem tarefas. Tente <code>nova tarefa revisar orçamento até 30/10</code></div>`}
      </section>`;
  }

  /* =====================================================================
     Assistente: comandos
     ===================================================================== */
  const COMMANDS = [
    ["ajuda", "Lista todos os comandos"],
    ["resumo", "Resumo da planilha atual"],
    ["nova planilha Clientes com colunas Nome, Cidade, Valor", "Cria uma planilha"],
    ["abrir planilha Estoque", "Abre uma planilha"],
    ["adicionar linha Out; Serviços; 52000; 29000", "Insere uma linha (separe com ;)"],
    ["adicionar coluna Meta", "Insere uma coluna"],
    ["somar receita", "Soma uma coluna"],
    ["média de custo", "Média de uma coluna"],
    ["maior lucro", "Maior valor e onde está"],
    ["ordenar por receita desc", "Ordena as linhas"],
    ["filtrar categoria = Serviços", "Filtra o painel"],
    ["limpar filtro", "Remove o filtro"],
    ["criar gráfico de receita por mês", "Adiciona gráfico ao painel"],
    ["gráfico de pizza de lucro por categoria", "Gráfico de rosca"],
    ["mostrar painel", "Abre o painel"],
    ["mostrar planilha", "Abre a planilha"],
    ["nova tarefa Ligar para fornecedor até 30/09", "Cria uma tarefa"],
    ["concluir tarefa 2", "Marca tarefa como feita"],
    ["listar tarefas", "Mostra as tarefas"],
    ["exportar excel", "Baixa .xlsx"],
    ["exportar csv", "Baixa .csv"],
    ["limpar conversa", "Apaga o histórico"],
    ["restaurar exemplo", "Volta aos dados de exemplo"],
  ];

  const log = $("#log");
  function say(html, who = "bot", extra = "") {
    const el = document.createElement("div");
    el.className = `msg ${who} ${extra}`;
    el.innerHTML = html;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
  }
  const code = s => `<code>${esc(s)}</code>`;
  const fmtCol = (sh, c, v) => isMoneyCol(sh.columns[c]) ? nfBRL2.format(v) : nfNum.format(v);
  function goto(view) { state.view = view; render(); }

  function helpText() {
    return `Posso criar e editar planilhas, montar gráficos e organizar tarefas. Alguns comandos:<ul>${COMMANDS.slice(0, -1).map(([c, d]) => `<li>${code(c)} · ${esc(d)}</li>`).join("")}</ul>Também entendo variações, como “cria uma planilha chamada Metas”.`;
  }

  function run(input) {
    const raw = input.trim().replace(/^\//, "");
    if (!raw) return;
    say(esc(raw), "user");
    state.history.push(raw);
    state.history = state.history.slice(-50);
    try { handle(raw); } catch (e) { say("Não consegui executar esse comando. Digite " + code("ajuda") + " para ver exemplos.", "bot", "err"); console.error(e); }
    save();
  }

  function handle(raw) {
    const n = norm(raw);
    const sh = sheet();
    let m;

    if (/^(ajuda|help|\?|comandos|o que (voce )?(faz|sabe))/.test(n)) return say(helpText());
    if (/^limpar (conversa|chat|historico)/.test(n)) { log.innerHTML = ""; return say("Conversa limpa."); }
    if (/^restaurar exemplo/.test(n)) { state = defaultState(); render(); return say("Dados de exemplo restaurados."); }

    // Navegação
    if (/^(mostrar|abrir|ver|ir para)\s+(o\s+)?(painel|dashboard)/.test(n)) { goto("painel"); return say(`Painel de ${esc(sh.name)} aberto.`); }
    if (/^(mostrar|ver|ir para)\s+(a\s+)?planilhas?$/.test(n)) { goto("planilhas"); return say(`Planilha ${esc(sh.name)} aberta.`); }
    if (/^(listar|mostrar|ver)\s+(as\s+)?tarefas/.test(n)) {
      goto("tarefas");
      const p = state.tasks.filter(t => !t.done);
      return say(p.length ? `Você tem ${p.length} tarefa(s) pendente(s):<ul>${p.map(t => `<li>${esc(t.text)}${t.due ? ` · ${fmtDate(t.due)}${dueClass(t.due) === "late" ? " (atrasada)" : ""}` : ""}</li>`).join("")}</ul>` : "Nenhuma tarefa pendente.");
    }

    // Nova planilha
    if ((m = raw.match(/^(?:nova|criar?|cria)\s+(?:uma\s+)?planilha(?:\s+(?:chamada|de|do|da|com nome))?\s*(.*)$/i))) {
      let rest = m[1].trim(), cols = [];
      const cm = rest.match(/^(.*?)\s*(?:com\s+(?:as\s+)?colunas?|colunas?:?)\s+(.+)$/i);
      if (cm) { rest = cm[1].trim(); cols = cm[2].split(/\s*[,;]\s*|\s+e\s+/).map(s => s.trim()).filter(Boolean); }
      const name = rest || `Planilha ${state.sheets.length + 1}`;
      if (!cols.length) cols = ["Item", "Categoria", "Valor"];
      const ns = { id: uid(), name: name.charAt(0).toUpperCase() + name.slice(1), columns: cols, rows: [cols.map(() => "")] };
      state.sheets.push(ns);
      state.activeSheet = ns.id; state.filter = { col: null, val: "" }; selCell = null;
      goto("planilhas");
      return say(`Criei a planilha <b>${esc(ns.name)}</b> com as colunas ${cols.map(c => code(c)).join(", ")}. Adicione dados com ${code("adicionar linha " + cols.map((_, i) => "valor" + (i + 1)).join("; "))} ou digite direto nas células.`);
    }

    // Abrir planilha
    if ((m = raw.match(/^(?:abrir|abre|usar|trocar para)\s+(?:a\s+)?planilha\s+(.+)$/i))) {
      const s = findSheet(m[1]);
      if (!s) return say(`Não encontrei a planilha “${esc(m[1])}”. Disponíveis: ${state.sheets.map(s => code(s.name)).join(", ")}.`, "bot", "err");
      state.activeSheet = s.id; state.filter = { col: null, val: "" }; selCell = null;
      goto("planilhas");
      return say(`Planilha <b>${esc(s.name)}</b> aberta.`);
    }

    // Adicionar linha
    if ((m = raw.match(/^(?:adicionar|adiciona|inserir|incluir)\s+linha\s*:?\s*(.*)$/i))) {
      const vals = m[1] ? m[1].split(/\s*[;|]\s*/) : [];
      const row = sh.columns.map((_, i) => vals[i] ?? "");
      sh.rows.push(row);
      render();
      return say(`Linha ${sh.rows.length + 1} adicionada em <b>${esc(sh.name)}</b>${vals.length ? ": " + row.filter(Boolean).map(v => code(v)).join(" ") : ""}.`);
    }

    // Adicionar coluna
    if ((m = raw.match(/^(?:adicionar|adiciona|inserir|incluir|nova)\s+coluna\s+(.+)$/i))) {
      sh.columns.push(m[1].trim());
      sh.rows.forEach(r => r.push(""));
      render();
      return say(`Coluna ${code(m[1].trim())} adicionada (${colLetter(sh.columns.length - 1)}).`);
    }

    // Estatísticas
    if ((m = n.match(/^(somar|soma|total|media|maior|max|maximo|menor|min|minimo)\s+(?:d[aeo]s?\s+)?(?:coluna\s+)?(.+)$/))) {
      const c = findCol(sh, m[2]);
      if (c < 0) return say(`Não achei a coluna “${esc(m[2])}”. Colunas: ${sh.columns.map(x => code(x)).join(", ")}.`, "bot", "err");
      const rows = filteredRows(sh);
      const pairs = rows.map(r => [r, cellValue(sh, r, c).v]).filter(([, v]) => typeof v === "number");
      if (!pairs.length) return say(`A coluna ${code(sh.columns[c])} não tem números.`, "bot", "err");
      const op = m[1];
      const filt = state.filter.val ? ` (filtro: ${esc(state.filter.val)})` : "";
      if (/^(somar|soma|total)/.test(op)) return say(`Soma de ${code(sh.columns[c])}${filt}: <b>${fmtCol(sh, c, pairs.reduce((s, [, v]) => s + v, 0))}</b> em ${pairs.length} linhas.`);
      if (op === "media") return say(`Média de ${code(sh.columns[c])}${filt}: <b>${fmtCol(sh, c, pairs.reduce((s, [, v]) => s + v, 0) / pairs.length)}</b>.`);
      const best = pairs.reduce((a, b) => (/^(maior|max)/.test(op) ? b[1] > a[1] : b[1] < a[1]) ? b : a);
      const ctx = textCols(sh).slice(0, 2).map(tc => sh.rows[best[0]][tc]).filter(Boolean).join(" · ");
      return say(`${/^(maior|max)/.test(op) ? "Maior" : "Menor"} ${code(sh.columns[c])}${filt}: <b>${fmtCol(sh, c, best[1])}</b> na linha ${best[0] + 2}${ctx ? ` (${esc(ctx)})` : ""}.`);
    }

    // Ordenar
    if ((m = n.match(/^ordenar\s+(?:por\s+)?(.+?)(\s+(desc|decrescente|maior primeiro|asc|crescente))?$/))) {
      const c = findCol(sh, m[1]);
      if (c < 0) return say(`Não achei a coluna “${esc(m[1])}”.`, "bot", "err");
      if (sh.rows.some(r => r.some(v => String(v).startsWith("=")))) {
        // Fórmulas usam referências de linha: congela os valores antes de ordenar.
        sh.rows = sh.rows.map((r, ri) => r.map((v, ci) => String(v).startsWith("=") ? String(cellValue(sh, ri, ci).v) : v));
      }
      const desc = /desc|decrescente|maior/.test(m[2] || "");
      sh.rows.sort((a, b) => {
        const x = parseNum(a[c]), y = parseNum(b[c]);
        const r = !isNaN(x) && !isNaN(y) ? x - y : String(a[c]).localeCompare(String(b[c]), "pt-BR");
        return desc ? -r : r;
      });
      goto("planilhas");
      return say(`Planilha ordenada por ${code(sh.columns[c])} (${desc ? "decrescente" : "crescente"}). Fórmulas foram convertidas em valores para manter os resultados corretos.`);
    }

    // Filtros
    if (/^(limpar|remover|tirar)\s+filtros?/.test(n)) { state.filter.val = ""; render(); return say("Filtro removido."); }
    if ((m = raw.match(/^filtr(?:ar|e|a)\s+(?:por\s+)?(.+?)\s*(?:=|:|igual a|é)\s*(.+)$/i))) {
      const c = findCol(sh, m[1]);
      if (c < 0) return say(`Não achei a coluna “${esc(m[1])}”.`, "bot", "err");
      const val = sh.rows.map(r => r[c]).find(v => norm(v) === norm(m[2]));
      if (!val) return say(`Nenhuma linha com ${code(sh.columns[c])} = “${esc(m[2])}”.`, "bot", "err");
      state.filter = { col: c, val };
      goto("painel");
      return say(`Painel filtrado: ${code(sh.columns[c])} = <b>${esc(val)}</b> (${filteredRows(sh).length} linhas).`);
    }

    // Gráficos
    if (/^(criar|cria|novo|adicionar|fazer|faz|gerar|gera)?\s*(um\s+)?grafico/.test(n)) {
      let type = /pizza|rosca|donut|torta/.test(n) ? "doughnut" : /linha|evolucao|tendencia/.test(n) ? "line" : "bar";
      const gm = n.match(/de\s+(?:(?:barras?|linhas?|pizza|rosca|colunas)\s+(?:de\s+)?)?(.+?)\s+por\s+(.+)$/);
      if (!gm) {
        const nc = numericCols(sh), tc = textCols(sh);
        return say(`Diga o que medir e como agrupar. Exemplos para ${esc(sh.name)}:<ul>${nc.slice(0, 2).map(v => `<li>${code(`criar gráfico de ${sh.columns[v].toLowerCase()} por ${sh.columns[tc[0]]?.toLowerCase()}`)}</li>`).join("")}${nc[0] != null && tc[1] != null ? `<li>${code(`gráfico de pizza de ${sh.columns[nc[0]].toLowerCase()} por ${sh.columns[tc[1]].toLowerCase()}`)}</li>` : ""}</ul>`);
      }
      const valueNames = gm[1].split(/\s*(?:,|\se\s)\s*/);
      const values = valueNames.map(v => findCol(sh, v));
      const label = findCol(sh, gm[2]);
      if (values.some(v => v < 0) || label < 0) return say(`Não reconheci as colunas. Disponíveis: ${sh.columns.map(x => code(x)).join(", ")}.`, "bot", "err");
      if (!values.every(v => numericCols(sh).includes(v))) return say(`${values.filter(v => !numericCols(sh).includes(v)).map(v => code(sh.columns[v])).join(", ")} não é numérica; escolha uma coluna com valores.`, "bot", "err");
      if (type === "doughnut" && values.length > 1) type = "bar";
      const title = `${values.map(v => sh.columns[v]).join(" e ")} por ${sh.columns[label].toLowerCase()}`;
      state.charts.push({ id: uid(), sheetId: sh.id, type, label, values, title: title.charAt(0).toUpperCase() + title.slice(1) });
      goto("painel");
      $("#main").scrollTop = $("#main").scrollHeight;
      return say(`Gráfico <b>${esc(title)}</b> adicionado ao painel. Troque o tipo pelos botões Barras, Linhas e Rosca no cartão.`);
    }

    // Tarefas
    if ((m = raw.match(/^(?:nova|criar?|adicionar)\s+tarefa\s*:?\s*(.+)$/i))) {
      let text = m[1].trim(), due = "";
      const dm = text.match(/\s+(?:at[eé]|para|em|prazo)\s+(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\s*$/i);
      if (dm) {
        const y = dm[3] ? (dm[3].length === 2 ? "20" + dm[3] : dm[3]) : TODAY.getFullYear();
        due = `${y}-${dm[2].padStart(2, "0")}-${dm[1].padStart(2, "0")}`;
        text = text.slice(0, dm.index).trim();
      } else if (/\s+(amanha|amanhã|hoje)$/i.test(text)) {
        const d = new Date(TODAY); if (/amanh/i.test(text)) d.setDate(d.getDate() + 1);
        due = d.toISOString().slice(0, 10); text = text.replace(/\s+(amanha|amanhã|hoje)$/i, "");
      }
      state.tasks.unshift({ id: uid(), text, due, done: false });
      render();
      return say(`Tarefa criada: <b>${esc(text)}</b>${due ? ` · prazo ${fmtDate(due)}` : ""}.`);
    }
    if ((m = n.match(/^(concluir|finalizar|feito|marcar)\s+(?:a\s+)?tarefa\s+#?(\d+)/))) {
      const t = state.tasks[+m[2] - 1];
      if (!t) return say(`Não existe tarefa #${m[2]}.`, "bot", "err");
      t.done = true; render();
      return say(`Tarefa concluída: <b>${esc(t.text)}</b>.`);
    }

    // Exportar
    if ((m = n.match(/^(exportar|baixar|salvar)\s*(?:como|em)?\s*(csv|excel|xlsx)?/))) {
      return exportSheet(sh, m[2] === "csv" ? "csv" : "xlsx");
    }

    // Resumo
    if (/^(resumo|resumir|analisar|analise|como (estao|esta))/.test(n)) {
      const rows = filteredRows(sh);
      const nc = numericCols(sh), tc = textCols(sh);
      const lines = nc.map(c => `<li>${code(sh.columns[c])}: total ${fmtCol(sh, c, colTotal(sh, c, rows))}, média ${fmtCol(sh, c, colTotal(sh, c, rows) / rows.length)}</li>`);
      if (tc[1] != null && nc.length) {
        const c = nc[nc.length - 1];
        const agg = [...aggregate(sh, tc[1], c, rows)].sort((a, b) => b[1] - a[1]);
        lines.push(`<li>Maior ${esc(sh.columns[c].toLowerCase())} por ${esc(sh.columns[tc[1]].toLowerCase())}: <b>${esc(agg[0][0])}</b> (${fmtCol(sh, c, agg[0][1])})</li>`);
      }
      return say(`<b>${esc(sh.name)}</b>: ${rows.length} linhas, ${sh.columns.length} colunas.<ul>${lines.join("")}</ul>`);
    }

    say(`Não entendi “${esc(raw)}”. Tente ${code("ajuda")} ou um destes: ${code("resumo")}, ${code("criar gráfico de receita por mês")}, ${code("nova tarefa ...")}.`, "bot", "err");
  }

  // Dentro do visualizador do Claude, o download passa pela capacidade "downloads";
  // aberto direto no navegador, usa um link de download comum.
  const downloadsReady = window.claude?.use ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);

  async function exportSheet(sh, fmt) {
    const data = [sh.columns, ...sh.rows.map((_, r) => sh.columns.map((_, c) => cellValue(sh, r, c).v))];
    const base = sh.name.replace(/[^\w\-À-ú ]/g, "").trim() || "planilha";
    const filename = `${base}.${fmt}`;
    let blob;
    if (fmt === "xlsx") {
      if (!window.XLSX) return say("A biblioteca de Excel não carregou. Tente " + code("exportar csv") + ".", "bot", "err");
      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!cols"] = sh.columns.map(() => ({ wch: 16 }));
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, base.slice(0, 31));
      blob = new Blob([XLSX.write(wb, { type: "array", bookType: "xlsx" })]);
    } else {
      const csv = data.map(r => r.map(v => { const s = String(v ?? ""); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(";")).join("\n");
      blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
    }
    const downloads = await downloadsReady;
    if (downloads) {
      try {
        await downloads.save({ filename, data: blob });
        return say(`Arquivo <b>${esc(filename)}</b> salvo.`);
      } catch (e) {
        if (e?.code === "declined") return say("Download cancelado.");
        return say("Não foi possível salvar o arquivo aqui. Abra o <code>index.html</code> direto no navegador para baixar.", "bot", "err");
      }
    }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    say(`Arquivo <b>${esc(filename)}</b> gerado.`);
  }

  /* =====================================================================
     Eventos
     ===================================================================== */
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1800); }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-run]");
    if (!t) return;
    if (t.dataset.view) { goto(t.dataset.view); return; }
    if (t.dataset.sheet) { state.activeSheet = t.dataset.sheet; state.filter = { col: null, val: "" }; selCell = null; state.view = "planilhas"; render(); return; }
    if (t.dataset.run) { const inp = $("#cmdInput"); if (/ $|planilha$|gráfico$/.test(t.dataset.run)) { openAssist(); inp.value = t.dataset.run + " "; inp.focus(); } else run(t.dataset.run); return; }
    if (t.dataset.ctype) { const c = state.charts.find(c => c.id === t.dataset.chart); if (c.values.length > 1 && t.dataset.ctype === "doughnut") { toast("Rosca mostra só uma medida; usei a primeira."); c.values = [c.values[0]]; } c.type = t.dataset.ctype; render(); return; }
    if (t.dataset.delchart) { state.charts = state.charts.filter(c => c.id !== t.dataset.delchart); render(); toast("Gráfico removido"); return; }
    if (t.dataset.fval !== undefined) { state.filter.val = t.dataset.fval; render(); return; }
    if (t.dataset.deltask) { state.tasks = state.tasks.filter(x => x.id !== t.dataset.deltask); render(); return; }
    if (t.dataset.act === "addRow") { const sh = sheet(); sh.rows.push(sh.columns.map(() => "")); render(); const g = $(".grid-wrap"); g.scrollTop = g.scrollHeight; return; }
    if (t.dataset.act === "addCol") { const sh = sheet(); sh.columns.push("Coluna " + colLetter(sh.columns.length)); sh.rows.forEach(r => r.push("")); render(); return; }
    if (t.dataset.suggest) { run(t.dataset.suggest); return; }
  });

  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "sheetPick") { state.activeSheet = t.value; state.filter = { col: null, val: "" }; render(); }
    else if (t.id === "filterCol") { state.filter = { col: +t.value, val: "" }; render(); }
    else if (t.dataset.task) { const x = state.tasks.find(x => x.id === t.dataset.task); x.done = t.checked; render(); }
    else if (t.dataset.hcol) { sheet().columns[+t.dataset.hcol] = t.value || "Coluna"; render(); }
  });

  // Edição de células: mostra a fórmula ao focar, recalcula ao sair
  document.addEventListener("focusin", e => {
    const t = e.target;
    if (t.dataset.r !== undefined) {
      const sh = sheet(); selCell = { r: +t.dataset.r, c: +t.dataset.c };
      t.value = sh.rows[selCell.r][selCell.c] ?? "";
      $("#cellRef").textContent = colLetter(selCell.c) + (selCell.r + 2);
      $("#fx").value = t.value;
      t.select();
    }
  });
  function commitCell(r, c, value) {
    const sh = sheet();
    if ((sh.rows[r][c] ?? "") === value) return false;
    sh.rows[r][c] = value; save(); return true;
  }
  function refreshCells() {
    const sh = sheet();
    document.querySelectorAll(".grid td input[data-r]").forEach(inp => {
      if (inp === document.activeElement) return;
      inp.value = display(sh, +inp.dataset.r, +inp.dataset.c);
    });
    const ncols = numericCols(sh);
    document.querySelectorAll(".grid tfoot td:not(.rownum)").forEach((td, i) => {
      td.textContent = ncols.includes(i) ? (isMoneyCol(sh.columns[i]) ? nfBRL2.format(colTotal(sh, i, sh.rows.map((_, r) => r))) : nfNum.format(colTotal(sh, i, sh.rows.map((_, r) => r)))) : "";
    });
  }
  document.addEventListener("focusout", e => {
    const t = e.target;
    if (t.dataset.r !== undefined) {
      const r = +t.dataset.r, c = +t.dataset.c;
      commitCell(r, c, t.value);
      const td = t.parentElement, raw = sheet().rows[r][c];
      td.classList.toggle("formula", String(raw).startsWith("="));
      t.value = display(sheet(), r, c);
      td.classList.toggle("err", String(raw).startsWith("=") && t.value.startsWith("#"));
      refreshCells();
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "fx" && selCell) {
      commitCell(selCell.r, selCell.c, e.target.value);
      const inp = document.querySelector(`.grid input[data-r="${selCell.r}"][data-c="${selCell.c}"]`);
      if (inp) inp.value = display(sheet(), selCell.r, selCell.c);
      refreshCells();
    } else if (e.target.dataset.r !== undefined) {
      $("#fx").value = e.target.value;
    }
  });
  document.addEventListener("keydown", e => {
    const t = e.target;
    if (t.dataset && t.dataset.r !== undefined && (e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      const nr = +t.dataset.r + (e.key === "ArrowUp" ? -1 : 1);
      const next = document.querySelector(`.grid input[data-r="${nr}"][data-c="${t.dataset.c}"]`);
      if (next) next.focus(); else t.blur();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openAssist(); $("#cmdInput").focus(); }
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openAssist(); $("#cmdInput").focus(); }
    if (e.key === "Escape") closeAssist();
  });

  document.addEventListener("submit", e => {
    if (e.target.id === "taskForm") {
      e.preventDefault();
      const text = $("#taskText").value.trim();
      if (!text) return;
      state.tasks.unshift({ id: uid(), text, due: $("#taskDue").value, done: false });
      render(); toast("Tarefa adicionada");
    }
  });

  // Assistente: formulário, autocompletar, histórico
  const form = $("#cmdForm"), input = $("#cmdInput"), ac = $("#ac");
  let acIdx = -1, histIdx = -1;
  form.addEventListener("submit", e => { e.preventDefault(); const v = input.value; input.value = ""; ac.hidden = true; histIdx = -1; run(v); });
  function acItems() {
    const q = norm(input.value.replace(/^\//, ""));
    if (!q) return [];
    return COMMANDS.filter(([c]) => norm(c).includes(q) || norm(c).split(" ")[0].startsWith(q.split(" ")[0])).slice(0, 7);
  }
  function renderAc() {
    const items = acItems();
    if (!items.length || document.activeElement !== input) { ac.hidden = true; return; }
    acIdx = Math.min(acIdx, items.length - 1);
    ac.innerHTML = items.map(([c, d], i) => `<button type="button" role="option" data-ac="${esc(c)}" aria-selected="${i === acIdx}"><span>${esc(c)}</span><span>${esc(d)}</span></button>`).join("");
    ac.hidden = false;
  }
  input.addEventListener("input", () => { acIdx = -1; renderAc(); });
  input.addEventListener("blur", () => setTimeout(() => ac.hidden = true, 150));
  ac.addEventListener("mousedown", e => { const b = e.target.closest("[data-ac]"); if (b) { e.preventDefault(); input.value = b.dataset.ac; ac.hidden = true; input.focus(); } });
  input.addEventListener("keydown", e => {
    const items = acItems();
    if (!ac.hidden && items.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault(); acIdx = (acIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; renderAc(); return;
    }
    if (e.key === "Tab" && !ac.hidden && items.length) { e.preventDefault(); input.value = items[Math.max(acIdx, 0)][0]; ac.hidden = true; return; }
    if (e.key === "Enter" && !ac.hidden && acIdx >= 0) { e.preventDefault(); input.value = items[acIdx][0]; ac.hidden = true; return; }
    if (e.key === "ArrowUp" && ac.hidden && state.history.length) {
      e.preventDefault(); histIdx = histIdx < 0 ? state.history.length - 1 : Math.max(0, histIdx - 1); input.value = state.history[histIdx];
    }
    if (e.key === "ArrowDown" && ac.hidden && histIdx >= 0) {
      e.preventDefault(); histIdx++; input.value = histIdx < state.history.length ? state.history[histIdx] : ""; if (histIdx >= state.history.length) histIdx = -1;
    }
  });

  function openAssist() { $("#assist").classList.add("open"); }
  function closeAssist() { $("#assist").classList.remove("open"); }
  $("#openAssist").addEventListener("click", () => { openAssist(); input.focus(); });
  $("#closeAssist").addEventListener("click", closeAssist);

  $("#suggest").innerHTML = ["resumo", "criar gráfico de receita por categoria", "maior lucro", "filtrar categoria = Serviços", "listar tarefas", "ajuda"]
    .map(s => `<button type="button" data-suggest="${esc(s)}">${esc(s)}</button>`).join("");

  // Início
  render();
  say(`Olá! Sou seu assistente de gestão. Abri o painel com a planilha de exemplo <b>Vendas 2026</b>. Experimente:<ul><li>${code("resumo")}</li><li>${code("criar gráfico de receita por categoria")}</li><li>${code("nova planilha Clientes com colunas Nome, Cidade, Valor")}</li><li>${code("nova tarefa Revisar orçamento até 30/10")}</li></ul>Digite ${code("ajuda")} para ver tudo.`);
})();
</script>
