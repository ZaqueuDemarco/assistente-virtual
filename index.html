    if ((m = norm(v).match(/^(?:(\d+(?:[.,]\d+)?)\s*h(?:oras?|rs?)?)?\s*(?:(\d+)\s*m(?:in(?:utos?)?)?)?$/)) && (m[1] || m[2])) return parseNum(m[1] || "0") + (+m[2] || 0) / 60;
    return NaN;
  }
  const fmtDur = h => { const t = Math.round(h * 60); return `${Math.floor(t / 60)}h${pad2(t % 60)}`; };
  const monthLabel = dt => `${MES_NOMES[dt.getMonth()].charAt(0).toUpperCase() + MES_NOMES[dt.getMonth()].slice(1)}/${String(dt.getFullYear()).slice(2)}`;

  function detectType(vals, name) {
    const n = vals.length, nn = norm(name);
    if (!n) return { type: "texto" };
    const share = f => vals.filter(f).length / n;
    if (share(v => reEmail.test(v)) >= .8) return { type: "email" };
    if (share(looksPhone) >= .7 || (/tel|fone|cel|whats|contato/.test(nn) && share(v => [10, 11].includes(phoneDigits(v).length)) >= .7)) return { type: "telefone" };
    const mdy = vals.some(v => { const m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-]\d{2,4}$/); return m && +m[1] <= 12 && +m[2] > 12; })
      && !vals.some(v => { const m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-]\d{2,4}$/); return m && +m[1] > 12; });
    const order = mdy ? "mdy" : "dmy";
    if (share(v => parseDate(v, order)) >= .8) return { type: "data", order, hasTime: vals.some(v => reTime.test(v) && v.length > 10) };
    if (/data|dia|vencimento|prazo/.test(nn) && share(v => /^\d{5}$/.test(v) && +v > 20000 && +v < 60000) >= .8) return { type: "data", order: "serial" };
    if (share(v => /^\d{1,5}:\d{2}(:\d{2})?$/.test(v)) >= .8 || (/tempo|duracao|horas|hh|mttr|mtbf/.test(nn) && share(v => !isNaN(parseDuration(v))) >= .8 && share(v => isNaN(parseNum(v))) > .3)) return { type: "duracao" };
    // Códigos e identificadores (OS, patrimônio, série, TAG...) são texto mesmo quando só têm dígitos.
    if (ID_HINT.test(nn) || share(v => /^0\d+$/.test(v)) > .3 || share(v => /^\d{7,}$/.test(v)) >= .8) return { type: "texto" };
    if (share(v => /%\s*$/.test(v) && !isNaN(parseNum(v))) >= .6) return { type: "percentual" };
    if (share(v => !isNaN(parseNum(v))) >= .8) {
      return { type: share(v => /R\$/.test(v)) >= .3 || isMoneyCol(name) ? "moeda" : "numero" };
    }
    const uniq = new Set(vals.map(norm)).size;
    const avgLen = vals.reduce((s, v) => s + v.length, 0) / n;
    if (n >= 4 && uniq < n && avgLen < 40 && (CAT_HINT.test(nn) ? uniq <= Math.max(3, n * .8) : uniq <= Math.max(3, Math.min(20, n * .6)))) return { type: "categoria" };
    return { type: "texto" };
  }
  const CAT_HINT = /(^|\s)(setor|status|situacao|tipo|categoria|prioridade|unidade|local|localizacao|cidade|estado|uf|fabricante|marca|modelo|equipamento|departamento|grupo|familia|criticidade|responsavel|tecnico|vendedor|fornecedor|empresa|origem|canal|regiao|area|centro de custo|contrato|produto|servico)(\s|$)/;
  const ID_HINT = /(^|[\s.])(id|cod|codigo|cep|cpf|cnpj|matricula|pedido|nf|nota fiscal|os|o\.s|ordem|ordem de servico|tag|patrimonio|serie|n[º°o]?\.?\s*(de\s+)?serie|registro|chamado|protocolo|n[º°]|nr|ticket|lote|anvisa)([\s.]|$)/;
  function guessName(type, vals) {
    if (type === "numero") return vals.every(v => Number.isInteger(parseNum(v)) && Math.abs(parseNum(v)) < 10000) ? "Quantidade" : "Número";
    if (type === "texto") return vals.filter(looksName).length / (vals.length || 1) >= .7 ? "Nome" : "Descrição";
    return { categoria: "Categoria", moeda: "Valor", percentual: "Percentual", duracao: "Duração", data: "Data", email: "E-mail", telefone: "Telefone" }[type];
  }
  function cleanHeader(h) {
    h = h.replace(/[:_]+$/g, "").replace(/_/g, " ").trim();
    // Tudo maiúsculo: mantém siglas curtas (OS, TAG, UTI) e ajusta o resto; tudo minúsculo: só a primeira letra.
    if (h === h.toUpperCase() && /[A-ZÀ-Ý]{4,}/.test(h)) h = h.split(" ").map((w, i) => w.replace(/[^A-Za-zÀ-ÿ]/g, "").length <= 3 && i > 0 && !SMALL.has(w.toLowerCase()) ? w : i > 0 && SMALL.has(w.toLowerCase()) ? w.toLowerCase() : w.charAt(0) + w.slice(1).toLowerCase()).join(" ");
    else if (h === h.toLowerCase()) h = h.charAt(0).toUpperCase() + h.slice(1);
    return h.replace(/\(r\$\)/i, "(R$)");
  }
  const HEADER_WORDS = /^(nome|data|valor|cliente|e-?mail|cidade|estado|uf|status|situacao|categoria|produto|servico|quantidade|qtd|preco|telefone|celular|total|descricao|id|codigo|mes|ano|vendedor|responsavel|setor|departamento|tipo|origem|fornecedor|item|custo|receita|obs|observacao|os|o\.s|ordem|equipamento|tag|patrimonio|serie|n[º°]|numero|modelo|fabricante|marca|prioridade|tecnico|solicitante|unidade|local|localizacao|defeito|causa|solucao|abertura|fechamento|prazo|tempo|duracao|contrato|empresa|centro de custo|familia|grupo|criticidade)/;
  const EMPTY_TOKENS = /^(-+|—|n\/?a|n\/?d|null|none|nan|#n\/a|#ref!|#valor!|\(vazio\)|sem informacao)$/i;
  const JUNK_ROW = /^(total|subtotal|soma|totais|p[aá]gina|pag\.|gerado|emitido|impresso|relat[oó]rio|filtros?|per[ií]odo|data de emiss|usu[aá]rio|quantidade de registros|registros?:)/i;

  /* ---------- Análise ---------- */
  function analyze(raw, forceHeader = false) {
    let m = raw.map(r => r.map(v => { const x = String(v ?? "").replace(/\s+/g, " ").trim(); return EMPTY_TOKENS.test(x) ? "" : x; }));
    const width = Math.max(0, ...m.map(r => r.length));
    m = m.map(r => Array.from({ length: width }, (_, i) => r[i] ?? ""));
    const filled = m.filter(r => r.some(Boolean));
    const keep = [...Array(width).keys()].filter(c => filled.some(r => r[c]));
    let rows = filled.map(r => keep.map(c => r[c]));
    if (!rows.length || !keep.length) return null;

    const typedOf = (v) => !isNaN(parseNum(v)) || parseDate(v) || reEmail.test(v) || looksPhone(v);
    const count = r => r.filter(Boolean).length;
    // Largura "normal" da tabela = quantidade de células preenchidas mais comum entre as linhas.
    const freq = {}; rows.forEach(r => { const k = count(r); freq[k] = (freq[k] || 0) + 1; });
    const w = Math.max(...Object.entries(freq).filter(([, f]) => f >= Math.max(2, rows.length * .15)).map(([k]) => +k), 1);

    // Relatórios exportados costumam ter título, filtros e data de emissão antes da tabela.
    let top = 0;
    const skipped = [];
    if (!forceHeader && w >= 2) {
      const limit = Math.min(rows.length - 1, 30);
      for (let i = 0; i < limit; i++) {
        const r = rows[i];
        if (count(r) >= Math.max(2, Math.ceil(w * .6)) && count(rows[i + 1]) >= Math.max(1, Math.ceil(w * .5))) { top = i; break; }
      }
      skipped.push(...rows.slice(0, top).map(r => r.filter(Boolean).join(" ")));
      rows = rows.slice(top);
    }

    let hasHeader = forceHeader;
    if (!forceHeader && rows.length > 1) {
      const h = rows[0], body = rows.slice(1);
      const allText = h.every(v => !v || !typedOf(v));
      const mismatch = keep.some((_, c) => h[c] && body.filter(r => r[c]).filter(r => typedOf(r[c])).length / (body.filter(r => r[c]).length || 1) >= .8);
      const words = h.filter(v => HEADER_WORDS.test(norm(v))).length;
      const unseen = h.every((v, c) => !v || !body.some(r => norm(r[c]) === norm(v)));
      hasHeader = allText && (top > 0 || mismatch || words >= 1 || (unseen && h.filter(Boolean).length === h.length && keep.length > 1 && body.length > 2 && keep.some((_, c) => new Set(body.map(r => norm(r[c]))).size < body.length)));
    }
    const header = hasHeader ? rows[0] : null;
    let body = hasHeader ? rows.slice(1) : rows;
    // Remove cabeçalhos repetidos a cada página, linhas de total/rodapé e linhas quase vazias (títulos de grupo).
    const hKey = header ? header.map(norm).join("|") : null;
    const junk = [];
    body = body.filter(r => {
      const n = count(r), first = r.find(Boolean) || "";
      const isJunk = (hKey && r.map(norm).join("|") === hKey)
        || (JUNK_ROW.test(norm(first)) && n < Math.max(2, w * .7))
        || (w >= 4 && n <= Math.max(1, Math.floor(w * .25)));
      if (isJunk) junk.push(r.filter(Boolean).join(" "));
      return !isJunk;
    });
    const used = new Map();
    const columns = keep.map((_, c) => {
      const vals = body.map(r => r[c]).filter(Boolean);
      const hname = header ? cleanHeader(header[c] || "") : "";
      const det = detectType(vals, hname);
      let name = hname || guessName(det.type, vals);
      const k = norm(name); used.set(k, (used.get(k) || 0) + 1);
      if (used.get(k) > 1) name += " " + used.get(k);
      return { name, type: det.type, detected: det.type, order: det.order || "dmy", hasTime: !!det.hasTime, samples: [...new Set(vals)].slice(0, 3) };
    });
    return { columns, body, hasHeader, skipped, junk, emptyRows: m.length - filled.length, emptyCols: width - keep.length };
  }

  /* ---------- Organização ---------- */
  function organize(an, opts) {
    const cols = an.columns;
    const st = { data: 0, numero: 0, moeda: 0, percentual: 0, duracao: 0, categoria: 0, texto: 0, email: 0, telefone: 0 };
    const invalid = [], unify = [];
    // Categoria: agrupa grafias parecidas (maiúsculas, acentos, espaços) e usa a mais frequente.
    const canon = cols.map((col, c) => {
      if (col.type !== "categoria") return null;
      const groups = new Map();
      an.body.forEach(r => { const v = r[c]; if (!v) return; const k = norm(v); if (!groups.has(k)) groups.set(k, new Map()); const g = groups.get(k); g.set(v, (g.get(v) || 0) + 1); });
      const map = new Map();
      groups.forEach((g, k) => {
        let best = [...g].sort((a, b) => b[1] - a[1] || (/[À-ÿ]/.test(b[0]) - /[À-ÿ]/.test(a[0])))[0][0];
        const withAccent = [...g.keys()].find(v => /[À-ÿ]/.test(v));
        if (withAccent && !/[À-ÿ]/.test(best)) best = withAccent;
        if (best === best.toLowerCase() || (best === best.toUpperCase() && best.length > 3)) best = titleCase(best);
        map.set(k, best);
        if (g.size > 1 && unify.length < 4) unify.push([[...g.keys()].filter(v => v !== best).slice(0, 3), best]);
      });
      return map;
    });
    const nameCols = cols.map((col, c) => col.type === "texto" && an.body.filter(r => r[c]).filter(r => looksName(r[c])).length / (an.body.filter(r => r[c]).length || 1) >= .7);

    const cell = (v, col, c) => {
      if (!v) return "";
      let out = v;
      switch (col.type) {
        case "data": {
          const dt = col.order === "serial" && /^\d+$/.test(v) ? new Date(Date.UTC(1899, 11, 30) + +v * 864e5 + new Date().getTimezoneOffset() * 6e4) : parseDate(v, col.order);
          if (dt) out = fmtDMY(dt) + (col.hasTime ? " " + fmtTime(dt) : ""); else invalid.push([col.name, v]);
          break;
        }
        case "duracao": {
          const h = parseDuration(v);
          const n = isNaN(h) ? parseNum(v) : h;
          if (isNaN(n)) invalid.push([col.name, v]); else out = String(Math.round(n * 100) / 100);
          break;
        }
        case "numero": case "moeda": case "percentual": {
          const n = parseNum(v);
          if (isNaN(n)) invalid.push([col.name, v]); else out = String(Math.round(n * 100) / 100);
          break;
        }
        case "email": out = v.toLowerCase().replace(/\s/g, ""); if (!reEmail.test(out)) invalid.push([col.name, v]); break;
        case "telefone": {
          const d = phoneDigits(v);
          out = d.length === 11 ? `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}` : d.length === 10 ? `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}` : v;
          break;
        }
        case "categoria": out = canon[c].get(norm(v)) || v; break;
        default: if (nameCols[c] && (v === v.toLowerCase() || v === v.toUpperCase())) out = titleCase(v);
      }
      if (out !== v) st[col.type]++;
      return out;
    };
    let rows = an.body.map(r => cols.map((col, c) => cell(r[c], col, c)));

    const seen = new Set(); let dups = 0;
    rows = rows.filter(r => { const k = r.map(norm).join("\u0001"); if (seen.has(k)) { dups++; return false; } seen.add(k); return true; });

    let columns = cols.map(c => c.name), types = cols.map(c => c.type), periodCol = null, addedMonth = false;
    const dc = types.indexOf("data");
    if (dc >= 0) {
      const key = r => { const d = parseDate(r[dc]); return d ? d.getTime() : Infinity; };
      if (opts.sortDate) rows.sort((a, b) => key(a) - key(b));
      if (opts.addMonth && !columns.some(n => norm(n) === "mes")) {
        rows = rows.map(r => { const d = parseDate(r[dc]); const x = [...r]; x.splice(dc + 1, 0, d ? monthLabel(d) : ""); return x; });
        columns.splice(dc + 1, 0, "Mês"); types.splice(dc + 1, 0, "categoria");
        periodCol = dc + 1; addedMonth = true;
      }
    }
    return { columns, types, rows, periodCol, addedMonth, st, invalid, unify, dups };
  }

  /* ---------- Janela de importação ---------- */
  const dlg = $("#impDlg"), impContent = $("#impContent");
  let imp = null; // { an, name, replaceId, note, opts }

  function openImport(pre) {
    imp = { replaceId: null, note: "", opts: { sortDate: true, addMonth: true } };
    if (!dlg.open) { try { dlg.showModal(); } catch { dlg.setAttribute("open", ""); } }
    if (pre?.matrix) return loadMatrix(pre.matrix, pre.name, pre);
    if (pre?.text) return loadMatrix(textToMatrix(pre.text), "", pre);
    renderStep1();
  }
  function closeImport() { dlg.open && dlg.close(); imp = null; }

  function renderStep1(err = "", text = "") {
    $("#impStep").textContent = "Passo 1 de 2 · Enviar dados";
    impContent.innerHTML = `
      <div class="imp-body">
        <p class="lead">Envie um arquivo ou cole dados copiados do Excel, Google Sheets, sistema ou e-mail. O assistente identifica cada coluna (datas, valores, categorias, e-mails, telefones), corrige formatos, remove repetidos e monta a planilha com o painel.</p>
        <label class="drop" id="dropZone" for="impFile">
          ${ICONS.up}<span>Arraste um arquivo aqui ou <u>escolha no computador</u></span>
          <small>.xlsx, .xls, .csv ou .txt</small>
        </label>
        <input type="file" id="impFile" accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt" hidden>
        <div class="or">ou cole aqui</div>
        <textarea id="impText" spellcheck="false" placeholder="Data;Cliente;Cidade;Valor&#10;03/01/2026;Ana Souza;São Paulo;R$ 1.200,00&#10;07/01/2026;Bruno Lima;Campinas;850">${esc(text)}</textarea>
        ${err ? `<div class="imp-err" role="alert">${esc(err)}</div>` : ""}
      </div>
      <div class="imp-foot">
        <button class="btn ghost" type="button" data-imp="sample">Testar com dados bagunçados de exemplo</button>
        <span class="grow"></span>
        <button class="btn" type="button" data-imp="close">Cancelar</button>
        <button class="btn primary" type="button" data-imp="analyze">Analisar dados</button>
      </div>`;
    setTimeout(() => $("#impText")?.focus(), 30);
  }

  function loadMatrix(matrix, name, pre = {}) {
    const an = analyze(matrix, pre.forceHeader);
    if (!an) return renderStep1("Não encontrei dados. Cole pelo menos uma linha com conteúdo.");
    // Ao reorganizar uma planilha já tipada, mantém os tipos que ela já tinha.
    if (pre.types) an.columns.forEach((c, i) => { if (pre.types[i]) c.type = pre.types[i]; });
    imp.an = an;
    imp.replaceId = pre.replaceId || null;
    imp.note = pre.note || "";
    imp.name = name || suggestName(an);
    renderStep2();
  }
  function suggestName(an) {
    const n = an.columns.map(c => norm(c.name)).join(" ");
    const base = /cliente|e-?mail|telefone/.test(n) && !/valor|preco|receita/.test(n) ? "Contatos"
      : /estoque|quantidade|item|fornecedor/.test(n) ? "Estoque"
      : /valor|receita|preco|venda/.test(n) ? "Vendas" : "Dados importados";
    let name = base, i = 2;
    while (state.sheets.some(s => norm(s.name) === norm(name))) name = `${base} ${i++}`;
    return name;
  }

  function fmtPreview(v, type) {
    if (!v) return "";
    if (type === "moeda") { const n = parseNum(v); return isNaN(n) ? v : nfBRL2.format(n); }
    if (type === "numero") { const n = parseNum(v); return isNaN(n) ? v : nfNum.format(n); }
    if (type === "percentual") { const n = parseNum(v); return isNaN(n) ? v : nfNum.format(n) + "%"; }
    if (type === "duracao") { const n = parseNum(v); return isNaN(n) ? v : fmtDur(n); }
    return v;
  }
  function fixesTotal(st) { return Object.values(st).reduce((a, b) => a + b, 0); }

  function renderStep2() {
    const an = imp.an, res = organize(an, imp.opts);
    imp.res = res;
    $("#impStep").textContent = "Passo 2 de 2 · Conferir";
    const hasDate = an.columns.some(c => c.type === "data");
    const notes = [];
    if (imp.note) notes.push(esc(imp.note));
    if (an.skipped.length) notes.push(`Ignorei ${an.skipped.length} linha(s) de título acima da tabela, ex.: <code>${esc(an.skipped[0].slice(0, 60))}</code>.`);
    notes.push(an.hasHeader ? `A linha com ${an.columns.slice(0, 3).map(c => `<code>${esc(c.name)}</code>`).join(", ")}… foi reconhecida como cabeçalho.` : "Não havia cabeçalho; dei nomes às colunas pelo conteúdo.");
    if (an.junk.length) notes.push(`Removi ${an.junk.length} linha(s) de total, rodapé, cabeçalho repetido ou título de grupo, ex.: <code>${esc(an.junk[0].slice(0, 60))}</code>.`);
    if (res.st.data) notes.push(`${res.st.data} data(s) padronizada(s) para dd/mm/aaaa.`);
    if (res.st.moeda + res.st.numero + res.st.percentual) notes.push(`${res.st.moeda + res.st.numero + res.st.percentual} valor(es) convertido(s) em número (ex.: “R$ 1.200,50” → 1200,5).`);
    res.unify.forEach(([from, to]) => notes.push(`Categorias unificadas: ${from.map(v => `<code>${esc(v)}</code>`).join(", ")} → <code>${esc(to)}</code>`));
    if (res.st.duracao) notes.push(`${res.st.duracao} duração(ões) convertida(s) em horas.`);
    if (res.st.telefone) notes.push(`${res.st.telefone} telefone(s) formatado(s).`);
    if (res.st.email) notes.push(`${res.st.email} e-mail(s) em minúsculas.`);
    if (res.st.texto) notes.push(`${res.st.texto} nome(s) com maiúsculas corrigidas.`);
    if (res.addedMonth) notes.push("Adicionei a coluna <code>Mês</code> para agrupar por período no painel.");
    if (res.invalid.length) notes.push(`<span style="color:var(--warn)">${res.invalid.length} valor(es) não reconhecido(s) mantido(s) como estão, ex.: ${res.invalid.slice(0, 3).map(([c, v]) => `<code>${esc(v)}</code> em ${esc(c)}`).join(", ")}.</span>`);
    const prevRows = res.rows.slice(0, 10);
    impContent.innerHTML = `
      <div class="imp-body">
        <div class="stats">
          <div class="stat"><b>${nfNum.format(res.rows.length)}</b><span>linhas organizadas</span></div>
          <div class="stat"><b>${res.columns.length}</b><span>colunas</span></div>
          <div class="stat fix"><b>${fixesTotal(res.st)}</b><span>valores corrigidos</span></div>
          <div class="stat fix"><b>${res.dups}</b><span>duplicadas removidas</span></div>
          <div class="stat fix"><b>${an.emptyRows + an.emptyCols}</b><span>linhas/colunas vazias</span></div>
        </div>
        <div class="name-row">
          <label for="impName" class="sec-title" style="margin:0">Nome da planilha</label>
          <input class="ctl" id="impName" value="${esc(imp.name)}">
        </div>
        <div class="imp-grid">
          <div>
            <h3 class="sec-title">Colunas identificadas</h3>
            <div class="cols">${an.columns.map((c, i) => `
              <div class="colrow">
                <input class="ctl" data-colname="${i}" value="${esc(c.name)}" aria-label="Nome da coluna ${i + 1}">
                <select class="ctl" data-coltype="${i}" aria-label="Tipo da coluna ${esc(c.name)}">${TYPES.map(t => `<option value="${t}" ${t === c.type ? "selected" : ""}>${TYPE_LABEL[t]}</option>`).join("")}</select>
                <div class="ex" title="${esc(c.samples.join(" · "))}">${esc(c.samples.join(" · ")) || "(vazia)"}</div>
              </div>`).join("")}
            </div>
          </div>
          <div>
            <h3 class="sec-title">Como vai ficar${res.rows.length > 10 ? ` (primeiras 10 de ${res.rows.length})` : ""}</h3>
            <div class="preview-wrap"><table class="preview">
              <thead><tr>${res.columns.map((c, i) => `<th>${esc(c)}<small>${TYPE_LABEL[res.types[i]]}${res.addedMonth && i === res.periodCol ? " · nova" : ""}</small></th>`).join("")}</tr></thead>
              <tbody>${prevRows.map(r => `<tr>${r.map((v, i) => `<td class="${["numero", "moeda", "percentual", "duracao"].includes(res.types[i]) ? "num" : ""} ${res.addedMonth && i === res.periodCol ? "new" : ""}">${esc(fmtPreview(v, res.types[i]))}</td>`).join("")}</tr>`).join("")}</tbody>
            </table></div>
          </div>
        </div>
        ${hasDate ? `<div class="opts">
          <label><input type="checkbox" id="optSort" ${imp.opts.sortDate ? "checked" : ""}> Ordenar por data</label>
          <label><input type="checkbox" id="optMonth" ${imp.opts.addMonth ? "checked" : ""}> Criar coluna Mês</label>
        </div>` : ""}
        <div><h3 class="sec-title">O que o assistente fez</h3><ul class="notes">${notes.map(n => `<li>${n}</li>`).join("")}</ul></div>
      </div>
      <div class="imp-foot">
        ${imp.replaceId ? "" : `<button class="btn ghost" type="button" data-imp="back">Voltar</button>`}
        <span class="grow"></span>
        <button class="btn" type="button" data-imp="close">Cancelar</button>
        <button class="btn primary" type="button" data-imp="create">${imp.replaceId ? "Aplicar na planilha" : "Criar planilha e painel"}</button>
      </div>`;
  }

  function autoCharts(sh) {
    const t = sh.types, idx = type => t.map((x, i) => x === type ? i : -1).filter(i => i >= 0);
    const metric = idx("moeda")[0] ?? idx("numero").find(i => !isAvgCol(sh, i)) ?? -1;
    const period = sh.periodCol;
    const uniq = c => new Set(sh.rows.map(r => r[c]).filter(Boolean)).size;
    const cats = idx("categoria").filter(i => i !== period && uniq(i) >= 2);
    const name = v => v < 0 ? "Registros" : sh.columns[v];
    const list = [];
    const add = (type, label, values) => list.push({ id: uid(), sheetId: sh.id, type, label, values, title: (t => t.charAt(0).toUpperCase() + t.slice(1))(`${values.map(name).join(" e ")} por ${sh.columns[label].toLowerCase()}`) });
    if (period != null && uniq(period) > 1) {
      const money = idx("moeda").slice(0, 2);
      add("line", period, money.length ? money : [metric]);
    }
    // Rosca: de preferência status/tipo (conta registros); barras: a categoria com mais grupos úteis.
    const statusLike = c => /status|situacao|tipo|prioridade|criticidade|etapa|fase/.test(norm(sh.columns[c]));
    const small = cats.find(c => statusLike(c) && uniq(c) <= 6) ?? cats.find(c => uniq(c) <= 5);
    const barCat = cats.filter(c => c !== small).sort((a, b) => (uniq(a) > 12) - (uniq(b) > 12) || (uniq(b) >= 3) - (uniq(a) >= 3))[0];
    if (barCat != null) add("bar", barCat, [metric]);
    if (small != null) add("doughnut", small, statusLike(small) || metric < 0 ? [-1] : [metric]);
    if (!list.length) {
      const anyText = textCols(sh)[0];
      if (anyText != null && uniq(anyText) <= 25) add("bar", anyText, [metric]);
    }
    return list.slice(0, 3);
  }

  function createFromImport() {
    const res = imp.res;
    const name = ($("#impName").value || imp.name).trim();
    let sh;
    if (imp.replaceId) {
      sh = state.sheets.find(s => s.id === imp.replaceId);
      Object.assign(sh, { name, columns: res.columns, rows: res.rows, types: res.types, periodCol: res.periodCol });
      state.charts = state.charts.filter(c => c.sheetId !== sh.id);
    } else {
      sh = { id: uid(), name, columns: res.columns, rows: res.rows, types: res.types, periodCol: res.periodCol };
      state.sheets.push(sh);
    }
    if (sh.periodCol == null) sh.periodCol = periodCol(sh) ?? null;
    const newCharts = autoCharts(sh);
    state.charts.push(...newCharts);
    state.activeSheet = sh.id;
    const firstCat = sh.types.findIndex((t, i) => t === "categoria" && i !== sh.periodCol);
    state.filter = { col: firstCat >= 0 ? firstCat : null, val: "" };
    selCell = null;
    const wasReplace = !!imp.replaceId;
    closeImport();
    goto("painel");
    openAssist();
    const ident = sh.columns.map((c, i) => `${code(c)} ${TYPE_LABEL[sh.types[i]]}`).join(", ");
    const fixes = fixesTotal(res.st);
    say(`${wasReplace ? "Organizei" : "Criei"} a planilha <b>${esc(sh.name)}</b> com ${sh.rows.length} linhas.<ul>
      <li>Colunas: ${ident}.</li>
      <li>${fixes} valor(es) corrigido(s)${res.dups ? `, ${res.dups} linha(s) duplicada(s) removida(s)` : ""}.</li>
      <li>${newCharts.length ? `Montei ${newCharts.length} gráfico(s) no painel: ${newCharts.map(c => esc(c.title.toLowerCase())).join("; ")}.` : "Não havia colunas numéricas ou categorias para gráficos automáticos."}</li>
    </ul>Próximos passos: ${code("resumo")}${firstCat >= 0 ? `, ${code(`filtrar ${sh.columns[firstCat].toLowerCase()} = ${sh.rows.find(r => r[firstCat])?.[firstCat] || ""}`)}` : ""}${newCharts.length ? "" : `, ${code(`criar gráfico de registros por ${sh.columns[0].toLowerCase()}`)}`}.`);
    renderSuggest();
  }

  // Exemplo propositalmente desorganizado para demonstrar a identificação.
  function messySample() {
    const clientes = [["ana souza", "ANA.SOUZA@GMAIL.COM", "11987654321"], ["Bruno Lima", "bruno@lima.com.br", "(19) 99876-5432"], ["CARLA MENDES", "carla.m@outlook.com", "+55 21 98888-1234"],
      ["Diego Rocha", "diego.rocha@empresa.com", "11 91234 5678"], ["elaine prado", "Elaine.Prado@gmail.com", "(31)97777-0000"], ["Fábio Nunes", "fabio@nunes.net", "41 98765-1111"]];
    const cidades = ["São Paulo", "sao paulo", "SÃO PAULO", "Campinas", "campinas ", "Rio de Janeiro", "Belo Horizonte", "Curitiba"];
    const prods = ["Consultoria", "consultoria", "Treinamento", "TREINAMENTO", "Suporte mensal", "suporte mensal"];
    const status = ["Pago", "pago", "PAGO", "Pendente", "pendente", "Atrasado"];
    const lines = ["Data da venda\tCLIENTE\te-mail\ttelefone\tcidade\tproduto\tvalor (R$)\tstatus"];
    let seed = 20260925; const rnd = n => { seed = (seed * 1103515245 + 12345) % 2147483648; return Math.floor(seed / 2147483648 * n); };
    for (let i = 0; i < 26; i++) {
      const [cli, mail, tel] = clientes[rnd(clientes.length)];
      const day = 1 + rnd(28), mon = 1 + Math.floor(i / 9);
      const date = [`${pad2(day)}/${pad2(mon)}/2026`, `2026-${pad2(mon)}-${pad2(day)}`, `${day}/${mon}/26`, `${day} ${MES_NOMES[mon - 1]} 2026`][rnd(4)];
      const prod = prods[rnd(prods.length)];
      const base = norm(prod).startsWith("cons") ? 2400 : norm(prod).startsWith("trei") ? 1350 : 690;
      const val = base + rnd(9) * 50;
      const vfmt = [`R$ ${nfNum.format(val)},00`.replace(",00,00", ",00"), String(val), `${val},00`, `R$${val}`][rnd(4)];
      lines.push([date, cli, mail, tel, cidades[rnd(cidades.length)], prod, vfmt, status[rnd(status.length)]].join("\t"));
      if (i === 5 || i === 17) lines.push(lines[lines.length - 1]);
      if (i === 9 || i === 20) lines.push("");
    }
    return lines.join("\n");
  }

  dlg.addEventListener("click", async e => {
    if (e.target === dlg) return closeImport();
    const b = e.target.closest("[data-imp]"); if (!b) return;
    const a = b.dataset.imp;
    if (a === "close") closeImport();
    else if (a === "back") renderStep1("", "");
    else if (a === "sample") { $("#impText").value = messySample(); }
    else if (a === "analyze") {
      const text = $("#impText").value;
      if (!text.trim()) return renderStep1("Cole os dados ou escolha um arquivo primeiro.");
      loadMatrix(textToMatrix(text), "");
    } else if (a === "create") createFromImport();
  });
  dlg.addEventListener("cancel", () => { imp = null; });
  dlg.addEventListener("change", async e => {
    const t = e.target;
    if (t.id === "impFile" && t.files[0]) handleFile(t.files[0]);
    else if (t.dataset.coltype) { imp.an.columns[+t.dataset.coltype].type = t.value; imp.name = $("#impName").value; renderStep2(); }
    else if (t.dataset.colname) { imp.an.columns[+t.dataset.colname].name = t.value.trim() || imp.an.columns[+t.dataset.colname].name; imp.name = $("#impName").value; renderStep2(); }
    else if (t.id === "optSort" || t.id === "optMonth") { imp.opts = { sortDate: $("#optSort").checked, addMonth: $("#optMonth").checked }; imp.name = $("#impName").value; renderStep2(); }
  });
  async function handleFile(file) {
    if (!imp) openImport();
    try {
      const { matrix, note } = await fileToMatrix(file);
      const fname = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
      loadMatrix(matrix, fname.charAt(0).toUpperCase() + fname.slice(1), { note });
    } catch (err) {
      renderStep1(err.message || "Não consegui ler esse arquivo.");
    }
  }

  // Arrastar arquivo para qualquer lugar da página
  let dragDepth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
  addEventListener("dragenter", e => { if (!hasFiles(e)) return; dragDepth++; if (!dlg.open) $("#dragVeil").hidden = false; else $("#dropZone")?.classList.add("over"); });
  addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#dragVeil").hidden = true; $("#dropZone")?.classList.remove("over"); } });
  addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; $("#dragVeil").hidden = true;
    const f = e.dataTransfer.files[0]; if (f) handleFile(f);
  });

  // Colar dados em qualquer lugar (fora de campos) ou no campo de comando abre a importação
  document.addEventListener("paste", e => {
    const text = e.clipboardData?.getData("text") || "";
    const multi = /\n.*\S/.test(text.trim()) || text.includes("\t");
    const t = e.target;
    if (!multi) return;
    if (t.id === "cmdInput" || !/INPUT|TEXTAREA|SELECT/.test(t.tagName || "")) {
      e.preventDefault();
      openImport({ text });
      say("Recebi dados colados. Confira a análise na janela de importação.");
    }
  });

  /* =====================================================================
     Eventos
     ===================================================================== */
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1800); }

  document.addEventListener("click", e => {
    const t = e.target.closest("button, [data-run]");
    if (!t) return;
    if (t.dataset.view) { goto(t.dataset.view); return; }
    if (t.dataset.sheet) { state.activeSheet = t.dataset.sheet; state.filter = { col: null, val: "" }; selCell = null; state.view = "planilhas"; render(); return; }
    if (t.dataset.run) { const inp = $("#cmdInput"); if (/ $|nova planilha$|gráfico$/.test(t.dataset.run)) { openAssist(); inp.value = t.dataset.run + " "; inp.focus(); } else run(t.dataset.run); return; }
    if (t.dataset.ctype) { const c = state.charts.find(c => c.id === t.dataset.chart); if (c.values.length > 1 && t.dataset.ctype === "doughnut") { toast("Rosca mostra só uma medida; usei a primeira."); c.values = [c.values[0]]; } c.type = t.dataset.ctype; render(); return; }
    if (t.dataset.delchart) { state.charts = state.charts.filter(c => c.id !== t.dataset.delchart); render(); toast("Gráfico removido"); return; }
    if (t.dataset.fval !== undefined) { state.filter.val = t.dataset.fval; render(); return; }
    if (t.dataset.deltask) { state.tasks = state.tasks.filter(x => x.id !== t.dataset.deltask); render(); return; }
    if (t.dataset.act === "import") { openImport(); return; }
    if (t.dataset.act === "delSheet") {
      if (!t.dataset.armed) { t.dataset.armed = "1"; t.innerHTML = `${ICONS.trash}Confirmar exclusão`; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.innerHTML = `${ICONS.trash}Excluir planilha`; } }, 4000); return; }
      const sh = sheet(); snapshot(sh.name); removeSheets([sh.id]); render();
      say(`Planilha <b>${esc(sh.name)}</b> excluída, junto com os gráficos dela.${undoBtn}`); openAssist(); return;
    }
    if (t.dataset.act === "addRow") { const sh = sheet(); sh.rows.push(sh.columns.map(() => "")); render(); const g = $(".grid-wrap"); g.scrollTop = g.scrollHeight; return; }
    if (t.dataset.act === "addCol") { const sh = sheet(); sh.columns.push("Coluna " + colLetter(sh.columns.length)); sh.rows.forEach(r => r.push("")); render(); return; }
    if (t.dataset.suggest) { run(t.dataset.suggest); return; }
  });

  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "sheetPick") { state.activeSheet = t.value; state.filter = { col: null, val: "" }; render(); }
    else if (t.id === "filterCol") { state.filter = { col: +t.value, val: "" }; render(); }
    else if (t.dataset.task) { const x = state.tasks.find(x => x.id === t.dataset.task); x.done = t.checked; render(); }
    else if (t.dataset.hcol) { sheet().columns[+t.dataset.hcol] = t.value || "Coluna"; render(); }
  });

  // Edição de células: mostra a fórmula ao focar, recalcula ao sair
  document.addEventListener("focusin", e => {
    const t = e.target;
    if (t.dataset.r !== undefined) {
      const sh = sheet(); selCell = { r: +t.dataset.r, c: +t.dataset.c };
      t.value = sh.rows[selCell.r][selCell.c] ?? "";
      $("#cellRef").textContent = colLetter(selCell.c) + (selCell.r + 2);
      $("#fx").value = t.value;
      t.select();
    }
  });
  function commitCell(r, c, value) {
    const sh = sheet();
    if ((sh.rows[r][c] ?? "") === value) return false;
    sh.rows[r][c] = value; save(); return true;
  }
  function refreshCells() {
    const sh = sheet();
    document.querySelectorAll(".grid td input[data-r]").forEach(inp => {
      if (inp === document.activeElement) return;
      inp.value = display(sh, +inp.dataset.r, +inp.dataset.c);
    });
    const ncols = numericCols(sh);
    document.querySelectorAll(".grid tfoot td:not(.rownum)").forEach((td, i) => {
      td.textContent = ncols.includes(i) ? (isAvgCol(sh, i) ? "média " : "") + fmtCol(sh, i, colSummary(sh, i, sh.rows.map((_, r) => r))) : "";
    });
  }
  document.addEventListener("focusout", e => {
    const t = e.target;
    if (t.dataset.r !== undefined) {
      const r = +t.dataset.r, c = +t.dataset.c;
      commitCell(r, c, t.value);
      const td = t.parentElement, raw = sheet().rows[r][c];
      td.classList.toggle("formula", String(raw).startsWith("="));
      t.value = display(sheet(), r, c);
      td.classList.toggle("err", String(raw).startsWith("=") && t.value.startsWith("#"));
      refreshCells();
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "fx" && selCell) {
      commitCell(selCell.r, selCell.c, e.target.value);
      const inp = document.querySelector(`.grid input[data-r="${selCell.r}"][data-c="${selCell.c}"]`);
      if (inp) inp.value = display(sheet(), selCell.r, selCell.c);
      refreshCells();
    } else if (e.target.dataset.r !== undefined) {
      $("#fx").value = e.target.value;
    }
  });
  document.addEventListener("keydown", e => {
    const t = e.target;
    if (t.dataset && t.dataset.r !== undefined && (e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      const nr = +t.dataset.r + (e.key === "ArrowUp" ? -1 : 1);
      const next = document.querySelector(`.grid input[data-r="${nr}"][data-c="${t.dataset.c}"]`);
      if (next) next.focus(); else t.blur();
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openAssist(); $("#cmdInput").focus(); }
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openAssist(); $("#cmdInput").focus(); }
    if (e.key === "Escape") closeAssist();
  });

  document.addEventListener("submit", e => {
    if (e.target.id === "taskForm") {
      e.preventDefault();
      const text = $("#taskText").value.trim();
      if (!text) return;
      state.tasks.unshift({ id: uid(), text, due: $("#taskDue").value, done: false });
      render(); toast("Tarefa adicionada");
    }
  });

  // Assistente: formulário, autocompletar, histórico
  const form = $("#cmdForm"), input = $("#cmdInput"), ac = $("#ac");
  let acIdx = -1, histIdx = -1;
  form.addEventListener("submit", e => { e.preventDefault(); const v = input.value; input.value = ""; ac.hidden = true; histIdx = -1; run(v); });
  function acItems() {
    const q = norm(input.value.replace(/^\//, ""));
    if (!q) return [];
    return COMMANDS.filter(([c]) => norm(c).includes(q) || norm(c).split(" ")[0].startsWith(q.split(" ")[0])).slice(0, 7);
  }
  function renderAc() {
    const items = acItems();
    if (!items.length || document.activeElement !== input) { ac.hidden = true; return; }
    acIdx = Math.min(acIdx, items.length - 1);
    ac.innerHTML = items.map(([c, d], i) => `<button type="button" role="option" data-ac="${esc(c)}" aria-selected="${i === acIdx}"><span>${esc(c)}</span><span>${esc(d)}</span></button>`).join("");
    ac.hidden = false;
  }
  input.addEventListener("input", () => { acIdx = -1; renderAc(); });
  input.addEventListener("blur", () => setTimeout(() => ac.hidden = true, 150));
  ac.addEventListener("mousedown", e => { const b = e.target.closest("[data-ac]"); if (b) { e.preventDefault(); input.value = b.dataset.ac; ac.hidden = true; input.focus(); } });
  input.addEventListener("keydown", e => {
    const items = acItems();
    if (!ac.hidden && items.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault(); acIdx = (acIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; renderAc(); return;
    }
    if (e.key === "Tab" && !ac.hidden && items.length) { e.preventDefault(); input.value = items[Math.max(acIdx, 0)][0]; ac.hidden = true; return; }
    if (e.key === "Enter" && !ac.hidden && acIdx >= 0) { e.preventDefault(); input.value = items[acIdx][0]; ac.hidden = true; return; }
    if (e.key === "ArrowUp" && ac.hidden && state.history.length) {
      e.preventDefault(); histIdx = histIdx < 0 ? state.history.length - 1 : Math.max(0, histIdx - 1); input.value = state.history[histIdx];
    }
    if (e.key === "ArrowDown" && ac.hidden && histIdx >= 0) {
      e.preventDefault(); histIdx++; input.value = histIdx < state.history.length ? state.history[histIdx] : ""; if (histIdx >= state.history.length) histIdx = -1;
    }
  });

  function openAssist() { $("#assist").classList.add("open"); }
  function closeAssist() { $("#assist").classList.remove("open"); }
  $("#openAssist").addEventListener("click", () => { openAssist(); input.focus(); });
  $("#closeAssist").addEventListener("click", closeAssist);

  function renderSuggest() {
    const sh = sheet();
    let list;
    if (!state.sheets.length) list = ["importar dados", "ver dados de exemplo", "ajuda"];
    else if (sh && !isSampleSheet(sh)) {
      const cat = (sh.types || []).findIndex((t, i) => t === "categoria" && i !== sh.periodCol);
      const num = numericCols(sh)[0];
      list = ["resumo", num != null ? `maior ${sh.columns[num].toLowerCase()}` : null, cat >= 0 ? `criar gráfico de registros por ${sh.columns[cat].toLowerCase()}` : null, "importar dados", hasSamples() ? "apagar exemplos" : null, "ajuda"].filter(Boolean);
    } else list = ["apagar exemplos", "importar dados", "resumo", "criar gráfico de receita por categoria", "ajuda"];
    $("#suggest").innerHTML = list.map(s => `<button type="button" data-suggest="${esc(s)}">${esc(s)}</button>`).join("");
  }
  $("#suggest").innerHTML = ["importar dados", "resumo", "criar gráfico de receita por categoria", "maior lucro", "filtrar categoria = Serviços", "listar tarefas", "ajuda"]
    .map(s => `<button type="button" data-suggest="${esc(s)}">${esc(s)}</button>`).join("");

  // Início
  render();
  if (hasSamples()) say(`Olá! Sou seu assistente de gestão. O painel mostra <b>dados de exemplo</b>. Para usar os seus, digite ${code("apagar exemplos")} e depois ${code("importar dados")} (ou arraste o arquivo exportado do seu sistema para esta página).`);
  else say(`Olá! ${state.sheets.length ? `Suas planilhas estão carregadas. Digite ${code("resumo")} ou ${code("importar dados")}.` : `Para começar, digite ${code("importar dados")} ou arraste um arquivo .xlsx/.csv para a página.`}`);
  if (hasSamples()) say(`Com o exemplo, experimente:<ul><li>${code("resumo")}</li><li>${code("criar gráfico de receita por categoria")}</li><li>${code("nova planilha Clientes com colunas Nome, Cidade, Valor")}</li><li>${code("nova tarefa Revisar orçamento até 30/10")}</li></ul>Digite ${code("ajuda")} para ver tudo.`);
})();
</script>
