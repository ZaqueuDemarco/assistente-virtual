  // Busca de novo e troca as linhas, mantendo tipos escolhidos, cartões e gráficos.
  const apiBusy = new Set();
  async function refreshApi(sh, quiet = false) {
    if (!sh?.api || apiBusy.has(sh.id)) return;
    apiBusy.add(sh.id);
    if (!quiet) say(`Buscando dados novos de <b>${esc(sh.name)}</b>…`);
    try {
      const out = await fetchApiMatrix(sh.api);
      const an = analyze(out.matrix);
      if (!an) throw Object.assign(new Error("x"), { html: "A API não trouxe registros." });
      const oldCols = sh.columns.map(norm), oldType = new Map(oldCols.map((c, i) => [c, sh.types?.[i]]));
      an.columns.forEach(c => { const t = oldType.get(norm(c.name)); if (t) c.type = t; });
      const res = organize(an, { sortDate: true, addMonth: oldCols.includes("mes") });
      const idx = new Map(res.columns.map((c, i) => [norm(c), i]));
      const map = c => c == null || c < 0 ? c : idx.get(oldCols[c]) ?? null;
      const before = sh.rows.length;
      const mine = state.charts.filter(ch => ch.sheetId === sh.id);
      mine.forEach(ch => { ch.label = map(ch.label); ch.values = ch.values.map(map); if (ch.where) { ch.where.col = map(ch.where.col); if (ch.where.col == null) ch.label = null; } if (ch.split) { ch.split.col = map(ch.split.col); if (ch.split.col == null) ch.label = null; } });
      const lost = mine.filter(ch => ch.label === null || ch.values.includes(null));
      state.charts = state.charts.filter(ch => !lost.includes(ch));
      if (sh.cards) sh.cards = sh.cards.filter(cd => { if (cd.kind !== "data") return true; cd.col = map(cd.col); if (cd.where) { cd.where.col = map(cd.where.col); (cd.where.more || []).forEach(w => w.col = map(w.col)); } return cd.col !== null && cd.where?.col !== null && !(cd.where?.more || []).some(w => w.col === null); });
      if (sh.hiddenKpis) sh.hiddenKpis = sh.hiddenKpis.map(map).filter(c => c != null);
      if (sh.userSet) sh.userSet = Object.fromEntries(Object.keys(sh.userSet).map(k => [map(+k), true]).filter(([k]) => k != null));
      if (state.activeSheet === sh.id && state.filter.col != null) { state.filter.col = map(state.filter.col); if (state.filter.col == null) state.filter = { col: null, val: "" }; }
      Object.assign(sh, { columns: res.columns, rows: res.rows, types: res.types, periodCol: res.periodCol ?? null, typesV: 3 });
      if (sh.periodCol == null) sh.periodCol = periodCol(sh) ?? null;
      sh.api.lastAt = Date.now(); sh.api.lastError = "";
      render();
      const diff = sh.rows.length - before;
      if (!quiet || diff) say(`<b>${esc(sh.name)}</b> atualizada pela API: ${nfNum.format(sh.rows.length)} registro(s)${diff ? ` (${diff > 0 ? "+" : ""}${nfNum.format(diff)})` : ", nenhum novo"}.${lost.length ? ` Removi ${lost.length} gráfico(s) de colunas que não vieram mais.` : ""}`);
    } catch (e) {
      const msg = e.html || esc(e.message || "erro desconhecido");
      if (!quiet || sh.api.lastError !== msg) say(`Não consegui atualizar <b>${esc(sh.name)}</b> pela API. ${msg}`, "bot", "err");
      sh.api.lastError = msg; save();
    } finally { apiBusy.delete(sh.id); }
  }
  // Atualização automática: confere a cada minuto quais conexões estão vencidas.
  setInterval(() => {
    if (!state || document.hidden) return;
    state.sheets.forEach(sh => { if (sh.api?.every > 0 && Date.now() - (sh.api.lastAt || 0) >= sh.api.every * 60000) refreshApi(sh, true); });
  }, 60000);

  // Arrastar arquivo para qualquer lugar da página
  let dragDepth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes("Files");
  addEventListener("dragenter", e => { if (!hasFiles(e)) return; dragDepth++; if (!dlg.open) $("#dragVeil").hidden = false; else $("#dropZone")?.classList.add("over"); });
  addEventListener("dragleave", e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; $("#dragVeil").hidden = true; $("#dropZone")?.classList.remove("over"); } });
  addEventListener("dragover", e => { if (hasFiles(e)) e.preventDefault(); });
  addEventListener("drop", e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; $("#dragVeil").hidden = true;
    const f = e.dataTransfer.files[0]; if (f) handleFile(f);
  });

  // Colar dados em qualquer lugar (fora de campos) ou no campo de comando abre a importação
  document.addEventListener("paste", e => {
    const text = e.clipboardData?.getData("text") || "";
    const multi = /\n.*\S/.test(text.trim()) || text.includes("\t");
    const t = e.target;
    if (!multi) return;
    if (t.id === "cmdInput" || !/INPUT|TEXTAREA|SELECT/.test(t.tagName || "")) {
      e.preventDefault();
      openImport({ text });
      say("Recebi dados colados. Confira a análise na janela de importação.");
    }
  });

  /* =====================================================================
     Eventos
     ===================================================================== */
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 1800); }

  document.addEventListener("click", e => {
    if (!state) return;
    if (e.target.closest("[data-restore]")) { applyRestore(e.target.closest("[data-restore]").dataset.restore); return; }
    // Tocar em qualquer parte do cartão abre o editor (no iPad o lápis é pequeno).
    const fb = e.target.closest("[data-fill]");
    if (fb && cdraft) { const inp = $("#" + fb.dataset.fill), k = CARD_FIELDS[fb.dataset.fill]; if (inp && k) { inp.value = fb.dataset.v; cdraft.txt[k] = fb.dataset.v; applyCardTexts(); } return; }
    const kc = e.target.closest(".kpi[data-card]");
    if (kc && !e.target.closest("button")) { openCardEditor(kc.dataset.card); return; }
    const t = e.target.closest("button, [data-run]");
    if (!t) return;
    if (t.dataset.view) { goto(t.dataset.view); return; }
    if (t.dataset.tab) { state.activeSheet = t.dataset.tab; state.filter = { col: null, val: "" }; selCell = null; render(); return; }
    if (t.dataset.sheet) { state.activeSheet = t.dataset.sheet; state.filter = { col: null, val: "" }; selCell = null; state.view = "planilhas"; render(); return; }
    if (t.dataset.run) { const inp = $("#cmdInput"); if (/ $|nova planilha$|gráfico$/.test(t.dataset.run)) { openAssist(); inp.value = t.dataset.run + " "; inp.focus(); } else run(t.dataset.run); return; }
    if (t.dataset.ctype) { const c = state.charts.find(c => c.id === t.dataset.chart); if (c.values.length > 1 && (t.dataset.ctype === "doughnut" || t.dataset.ctype === "rank")) { toast("Esse tipo mostra só uma medida; usei a primeira."); c.values = [c.values[0]]; c.title = chartTitle(sheet(), c); } c.type = t.dataset.ctype; render(); return; }
    if (t.dataset.editchart) { openBuilder(state.charts.find(c => c.id === t.dataset.editchart)); return; }
    if (t.dataset.act === "newchart") { openBuilder(); return; }
    if (t.dataset.editcard) { openCardEditor(t.dataset.editcard); return; }
    if (t.dataset.delcard) { const sh = sheet(); snapshot("cartão"); removeCard(sh, t.dataset.delcard); render(); toast("Cartão removido"); return; }
    if (t.dataset.act === "newcard") { openCardEditor(); return; }
    if (t.dataset.cact) { cardAct(t.dataset.cact); return; }
    if (t.dataset.bset) { builderSet(t.dataset.bset, t.dataset.v); return; }
    if (t.dataset.bact) { builderAct(t.dataset.bact); return; }
    if (t.dataset.delchart) { state.charts = state.charts.filter(c => c.id !== t.dataset.delchart); render(); toast("Gráfico removido"); return; }
    if (t.dataset.fval !== undefined) { state.filter.val = t.dataset.fval; render(); return; }
    if (t.dataset.deltask) { state.tasks = state.tasks.filter(x => x.id !== t.dataset.deltask); render(); return; }
    if (t.dataset.act === "import") { openImport(); return; }
    if (t.dataset.act === "apiRefresh") { openAssist(); refreshApi(sheet()); return; }
    if (t.dataset.act === "apiEdit") { openApi(sheet()); return; }
    if (t.dataset.act === "restore") { $("#backupFile").click(); return; }
    if (t.dataset.page !== undefined) { gridPage.set(`${sheet().id}|${state.filter.col}|${state.filter.val}`, Math.max(0, +t.dataset.page)); render(); $(".grid-wrap").scrollTop = 0; return; }
    if (t.dataset.act === "wipe") { openWipe(); return; }
    if (t.dataset.delsheet) { state.activeSheet = t.dataset.delsheet; openWipe(); return; }
    if (t.dataset.wipe) { doWipe(t.dataset.wipe); return; }
    if (t.dataset.act === "delSheet") {
      if (!t.dataset.armed) { t.dataset.armed = "1"; t.innerHTML = `${ICONS.trash}Confirmar exclusão`; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.innerHTML = `${ICONS.trash}Excluir planilha`; } }, 4000); return; }
      const sh = sheet(); snapshot(sh.name); removeSheets([sh.id]); render();
      say(`Planilha <b>${esc(sh.name)}</b> excluída, junto com os gráficos dela.${undoBtn}`); openAssist(); return;
    }
    if (t.dataset.act === "addRow") { const sh = sheet(); sh.rows.push(sh.columns.map(() => "")); state.filter.val = ""; gridPage.set(`${sh.id}|${state.filter.col}|`, Math.floor((sh.rows.length - 1) / PAGE)); render(); const g = $(".grid-wrap"); g.scrollTop = g.scrollHeight; return; }
    if (t.dataset.act === "addCol") { const sh = sheet(); sh.columns.push("Coluna " + colLetter(sh.columns.length)); sh.rows.forEach(r => r.push("")); render(); return; }
    if (t.dataset.suggest) { run(t.dataset.suggest); return; }
  });

  document.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "sheetPick") { state.activeSheet = t.value; state.filter = { col: null, val: "" }; render(); }
    else if (t.id === "filterCol") { state.filter = { col: +t.value, val: "" }; render(); }
    else if (t.dataset.task) { const x = state.tasks.find(x => x.id === t.dataset.task); x.done = t.checked; render(); }
    else if (t.dataset.settype) {
      const sh = sheet(), c = +t.dataset.settype;
      setType(sh, c, t.value); render();
      say(`Coluna ${code(sh.columns[c])} agora é <b>${esc(TYPE_LABEL[t.value])}</b>. Painel e gráficos atualizados.`);
    }
    else if (t.dataset.hcol) { sheet().columns[+t.dataset.hcol] = t.value || "Coluna"; render(); }
  });

  // Edição de células: mostra a fórmula ao focar, recalcula ao sair
  document.addEventListener("focusin", e => {
    const t = e.target;
    if (t.dataset.r !== undefined) {
      const sh = sheet(); selCell = { r: +t.dataset.r, c: +t.dataset.c };
      t.value = sh.rows[selCell.r][selCell.c] ?? "";
      $("#cellRef").textContent = colLetter(selCell.c) + (selCell.r + 2);
      $("#fx").value = t.value;
      t.select();
    }
  });
  function commitCell(r, c, value) {
    const sh = sheet();
    if ((sh.rows[r][c] ?? "") === value) return false;
    sh.rows[r][c] = value; bust(); save(); return true;
  }
  function refreshCells() {
    const sh = sheet();
    document.querySelectorAll(".grid td input[data-r]").forEach(inp => {
      if (inp === document.activeElement) return;
      inp.value = display(sh, +inp.dataset.r, +inp.dataset.c);
    });
    const ncols = numericCols(sh);
    document.querySelectorAll(".grid tfoot td:not(.rownum)").forEach((td, i) => {
      td.textContent = ncols.includes(i) ? (isAvgCol(sh, i) ? "média " : "") + fmtCol(sh, i, colSummary(sh, i, sh.rows.map((_, r) => r))) : "";
    });
  }
  document.addEventListener("focusout", e => {
    const t = e.target;
    if (t.dataset.r !== undefined) {
      const r = +t.dataset.r, c = +t.dataset.c;
      commitCell(r, c, t.value);
      const td = t.parentElement, raw = sheet().rows[r][c];
      td.classList.toggle("formula", String(raw).startsWith("="));
      t.value = display(sheet(), r, c);
      td.classList.toggle("err", String(raw).startsWith("=") && t.value.startsWith("#"));
      refreshCells();
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "fx" && selCell) {
      commitCell(selCell.r, selCell.c, e.target.value);
      const inp = document.querySelector(`.grid input[data-r="${selCell.r}"][data-c="${selCell.c}"]`);
      if (inp) inp.value = display(sheet(), selCell.r, selCell.c);
      refreshCells();
    } else if (e.target.dataset.r !== undefined) {
      $("#fx").value = e.target.value;
    }
  });
  document.addEventListener("keydown", e => {
    const t = e.target;
    if (t.dataset && t.dataset.r !== undefined && (e.key === "Enter" || e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      const nr = +t.dataset.r + (e.key === "ArrowUp" ? -1 : 1);
      const next = document.querySelector(`.grid input[data-r="${nr}"][data-c="${t.dataset.c}"]`);
      if (next) next.focus(); else t.blur();
    }
    if ((e.key === "Enter" || e.key === " ") && t.matches?.(".kpi[data-card]")) { e.preventDefault(); openCardEditor(t.dataset.card); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openAssist(); $("#cmdInput").focus(); }
    if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); openAssist(); $("#cmdInput").focus(); }
    if (e.key === "Escape") closeAssist();
  });

  document.addEventListener("submit", e => {
    if (e.target.id === "taskForm") {
      e.preventDefault();
      const text = $("#taskText").value.trim();
      if (!text) return;
      state.tasks.unshift({ id: uid(), text, due: $("#taskDue").value, done: false });
      render(); toast("Tarefa adicionada");
    }
  });

  // Assistente: formulário, autocompletar, histórico
  const form = $("#cmdForm"), input = $("#cmdInput"), ac = $("#ac");
  let acIdx = -1, histIdx = -1;
  form.addEventListener("submit", e => { e.preventDefault(); const v = input.value; input.value = ""; ac.hidden = true; histIdx = -1; run(v); });
  function acItems() {
    const q = norm(input.value.replace(/^\//, ""));
    if (!q) return [];
    return COMMANDS.filter(([c]) => norm(c).includes(q) || norm(c).split(" ")[0].startsWith(q.split(" ")[0])).slice(0, 7);
  }
  function renderAc() {
    const items = acItems();
    if (!items.length || document.activeElement !== input) { ac.hidden = true; return; }
    acIdx = Math.min(acIdx, items.length - 1);
    ac.innerHTML = items.map(([c, d], i) => `<button type="button" role="option" data-ac="${esc(c)}" aria-selected="${i === acIdx}"><span>${esc(c)}</span><span>${esc(d)}</span></button>`).join("");
    ac.hidden = false;
  }
  input.addEventListener("input", () => { acIdx = -1; renderAc(); });
  input.addEventListener("blur", () => setTimeout(() => ac.hidden = true, 150));
  ac.addEventListener("mousedown", e => { const b = e.target.closest("[data-ac]"); if (b) { e.preventDefault(); input.value = b.dataset.ac; ac.hidden = true; input.focus(); } });
  input.addEventListener("keydown", e => {
    const items = acItems();
    if (!ac.hidden && items.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault(); acIdx = (acIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; renderAc(); return;
    }
    if (e.key === "Tab" && !ac.hidden && items.length) { e.preventDefault(); input.value = items[Math.max(acIdx, 0)][0]; ac.hidden = true; return; }
    if (e.key === "Enter" && !ac.hidden && acIdx >= 0) { e.preventDefault(); input.value = items[acIdx][0]; ac.hidden = true; return; }
    if (e.key === "ArrowUp" && ac.hidden && state.history.length) {
      e.preventDefault(); histIdx = histIdx < 0 ? state.history.length - 1 : Math.max(0, histIdx - 1); input.value = state.history[histIdx];
    }
    if (e.key === "ArrowDown" && ac.hidden && histIdx >= 0) {
      e.preventDefault(); histIdx++; input.value = histIdx < state.history.length ? state.history[histIdx] : ""; if (histIdx >= state.history.length) histIdx = -1;
    }
  });

  function openAssist() { $("#assist").classList.add("open"); }
  function closeAssist() { $("#assist").classList.remove("open"); }
  $("#openAssist").addEventListener("click", () => { openAssist(); input.focus(); });
  $("#closeAssist").addEventListener("click", closeAssist);

  function renderSuggest() {
    const sh = sheet();
    let list;
    if (!state.sheets.length) list = ["importar dados", "ver dados de exemplo", "ajuda"];
    else if (sh && !isSampleSheet(sh)) {
      const cat = (sh.types || []).findIndex((t, i) => t === "categoria" && i !== sh.periodCol);
      const num = numericCols(sh)[0];
      list = [...chartExamples(sh).slice(0, 3), "verificar", "resumo", hasSamples() ? "apagar exemplos" : null, "ajuda"].filter(Boolean);
    } else list = ["apagar exemplos", "importar dados", "resumo", "criar gráfico de receita por categoria", "ajuda"];
    $("#suggest").innerHTML = list.map(s => `<button type="button" data-suggest="${esc(s)}">${esc(s)}</button>`).join("");
  }
  $("#suggest").innerHTML = ["importar dados", "resumo", "criar gráfico de receita por categoria", "maior lucro", "filtrar categoria = Serviços", "listar tarefas", "ajuda"]
    .map(s => `<button type="button" data-suggest="${esc(s)}">${esc(s)}</button>`).join("");

  // Planilhas importadas por versões anteriores: a regra de dinheiro era frouxa ("total" já bastava).
  const fixedCols = [];
  function migrateTypes() { state.sheets.forEach(sh => {
    if (!sh.types || sh.typesV >= 3) return;
    if (!(sh.typesV >= 2)) sh.types.forEach((t, c) => {
      if (t === "moeda" && !isMoneyCol(sh.columns[c])) { sh.types[c] = "numero"; migrated.push(`${sh.name} › ${sh.columns[c]}`); }
    });
    sh.types.forEach((t, c) => {
      if (t !== "numero" || sh.userSet?.[c]) return;
      const kind = ID_HINT.test(norm(sh.columns[c])) ? "codigo" : classifyNumbers(sh.rows.map(r => r[c]).filter(v => v !== "" && v != null), sh.columns[c]);
      if (!kind) return;
      if (kind === "codigo") { sh.types[c] = "texto"; fixedCols.push([sh, c, "código"]); return; }
      sh.rows.forEach(r => {
        const v = String(r[c] ?? "").trim(); if (!v) return;
        const d = kind === "data8" ? new Date(+v.slice(0, 4), +v.slice(4, 6) - 1, +v.slice(6, 8)) : serialToDate(parseNum(v));
        if (!isNaN(d)) r[c] = fmtDMY(d) + (d.getHours() || d.getMinutes() ? " " + fmtTime(d) : "");
      });
      sh.types[c] = "data"; fixedCols.push([sh, c, "data"]);
    });
    // Gráficos que somavam essas colunas deixam de fazer sentido: troca pelos automáticos.
    const bad = new Set(fixedCols.filter(([x]) => x === sh).map(([, c]) => c));
    if (bad.size) {
      state.charts = state.charts.filter(ch => ch.sheetId !== sh.id || !ch.values.some(v => bad.has(v)));
      if (!state.charts.some(ch => ch.sheetId === sh.id)) state.charts.push(...autoCharts(sh));
    }
    sh.typesV = 3;
  }); }
  // Início: carrega os dados salvos e só então desenha a tela.
  $("#view").innerHTML = `<div class="empty">Carregando seus dados…</div>`;
  boot();
  async function boot() {
  state = await loadState();
  const cloud = await cloudLoad();
  let fromCloud = false;
  if (cloud?.state && cloud.savedAt > (state.savedAt || 0)) {
    // Mantém os tokens de API deste aparelho (não vão para a nuvem).
    const localApi = new Map(state.sheets.filter(s => s.api?.headers).map(s => [s.id, s.api.headers]));
    state = cloud.state; state.savedAt = cloud.savedAt; fromCloud = true;
    state.sheets.forEach(s => { if (s.api && localApi.has(s.id)) s.api.headers = localApi.get(s.id); });
    saveNow();
  } else if (cloud) scheduleCloud();
  state.history = state.history || [];
  if (DEMO && !state.sheets.length && !state.demoLoaded) loadDemo();
  migrateTypes();
  const hadChat = !!state.chat?.length;
  restoreChat();
  chatReady = true;
  render();
  updateStoreInfo();
  if (movedFromLocal) { saveNow(); say(`Mudei seus dados para o armazenamento de maior capacidade do navegador. Antes o limite era de cerca de 5 MB; agora cabem relatórios bem maiores. Nada foi perdido.`); }
  if (storeMode === "local") say(`Este navegador não liberou o armazenamento maior; seus dados ficam no limitado (~5 MB). Faça ${code("backup")} de vez em quando.`, "bot", "err");
  if (storeMode === "memory" && !cloudOk) say(`Este navegador não está permitindo salvar dados (janela anônima ou bloqueio). Tudo funciona agora, mas some ao fechar. Use ${code("backup")} para guardar um arquivo.`, "bot", "err");
  if (fixedCols.length) say(`Encontrei colunas que estavam sendo <b>somadas por engano</b> (era daí que vinham valores como “500 mi” e “1 bi”):<ul>${fixedCols.map(([sh, c, k]) => `<li>${code(sh.columns[c])} em ${esc(sh.name)}: é ${k === "data" ? "uma <b>data</b> que o Excel gravou como número; converti para dd/mm/aaaa" : "um <b>código</b>; não entra mais em somas"}</li>`).join("")}</ul>Os gráficos que usavam essas colunas foram refeitos. Digite ${code("verificar")} para ver como cada coluna é calculada.`);
  if (migrated.length) say(`Revisei suas planilhas: ${migrated.map(x => code(x)).join(", ")} ${migrated.length > 1 ? "estavam sendo tratadas" : "estava sendo tratada"} como dinheiro sem motivo claro e ${migrated.length > 1 ? "voltaram" : "voltou"} a ser número. Se for mesmo custo, diga ${code(`${migrated[0].split(" › ")[1].toLowerCase()} é custo`)}.`);
  backupReminder();
  if (hadChat) return; // conversa já existente: não repete as boas-vindas
  if (DEMO) {
    say(`Oi! 👋 Sou o assistente de gestão. Esta é uma <b>demonstração com dados fictícios</b> de ${state.sheets.length} áreas: ${state.sheets.map(s => `<b>${esc(s.name)}</b>`).join(", ")}. Troque de área nas abas <b>Minhas planilhas</b>, no topo do painel.`);
    say(`Experimente escrever:<ul>${DEMO.tips.map(t => `<li>${code(t)}</li>`).join("")}</ul>Também dá para ${code("importar dados")} com um arquivo seu (.xlsx, .csv ou .pdf); ele fica só neste navegador.`);
    return;
  }
  if (fromCloud && !hadChat) say(`Carreguei suas ${state.sheets.length} planilha(s) salvas.`);
  if (hasSamples()) say(`Oi! 👋 Sou seu assistente de gestão. Pode falar comigo como no WhatsApp. O painel mostra <b>dados de exemplo</b>. Para usar os seus, digite ${code("apagar exemplos")} e depois ${code("importar dados")} (ou arraste o arquivo exportado do seu sistema para esta página).`);
  else say(`Oi! 👋 Sou seu assistente de gestão. Pode falar comigo como no WhatsApp: pergunte, peça gráficos, cartões ou tarefas. ${state.sheets.length ? `Suas planilhas estão carregadas. Digite ${code("resumo")} ou ${code("importar dados")}.` : `Para começar, digite ${code("importar dados")} ou arraste um arquivo .xlsx/.csv para a página.`}`);
  if (hasSamples()) say(`Com o exemplo, experimente:<ul><li>${code("resumo")}</li><li>${code("criar gráfico de receita por categoria")}</li><li>${code("nova planilha Clientes com colunas Nome, Cidade, Valor")}</li><li>${code("nova tarefa Revisar orçamento até 30/10")}</li></ul>Digite ${code("ajuda")} para ver tudo.`);
  }
})();
</script>
